name: CI

# Continuous integration for Mosh (FIT-009).
#
# Reuses the SAME verification gate the owner runs by hand on the Mac —
# scripts/auto-loop/gate.sh — so CI can never drift from local truth. Two lanes:
#
#   cheap-gate  (fast, ~10 min)  typecheck + vitest + e2e + touched-py tests.
#                                This is the intended REQUIRED status check.
#   native-gate (slow, heavy)    cmake build + Catch2 + `Mosh --selftest ×3
#                                deterministic` + verify.py --gate + DAW conformance.
#                                Best-effort here; promote to required once stable.
#
# Real-model paths (SA3, SoulX/SSH, RAVE, whisper, basic-pitch) are owner-gated and
# stay OFF in CI — the native selftest already pins MOSH_ENABLE_SA3=0 / _TRANSFORM=0
# etc., so this runs the hermetic default only.
#
# NOTE: .github/** is on the auto-loop hard-exclusion list, so this file is
# human-maintained and never flows through the autonomous loop.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight run per ref; a new push cancels the previous (saves macOS minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Classifier: decides whether the expensive macOS native lane is needed. ──
  # Reuses scripts/auto-loop/classify.sh — the SAME classifier the local gate and
  # the auto-loop use — so CI's skip decision can never drift from local truth.
  # Runs on ubuntu (1× billing) to gate a macos-14 job (10× billing): a docs- or
  # UI-only PR skips ~12 min of macOS build, the single largest line on the bill.
  #
  # FAIL-CLOSED: native-gate's `if` runs the native lane unless this job
  # SUCCEEDED *and* said "cheap". A crash, a timeout, or an unparseable result
  # all fall through to running the full gate.
  classify:
    name: classify change (cheap vs native)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      class: ${{ steps.c.outputs.class }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: c
        name: Classify the diff
        run: |
          set -o pipefail
          base_ref="${{ github.base_ref || 'main' }}"
          git fetch --no-tags origin "$base_ref:refs/remotes/origin/$base_ref" || true
          out="$(./scripts/auto-loop/classify.sh "origin/$base_ref" "$PWD")"
          echo "$out"
          cls="$(printf '%s' "$out" | jq -r '.class // "native"')"
          # Anything that is not exactly "cheap" means run the native lane.
          [ "$cls" = "cheap" ] || cls=native
          echo "class=$cls" >> "$GITHUB_OUTPUT"
          echo "### Change class: \`$cls\`" >> "$GITHUB_STEP_SUMMARY"

  # ── Cheap lane: no native build. The required check. ────────────────────────
  cheap-gate:
    name: cheap gate (typecheck · vitest · e2e · py)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the gate's `git diff <base>...HEAD` (used by the
          # touched-python-tests step) resolves a real merge-base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure jq (gate emits JSON)
        run: jq --version >/dev/null 2>&1 || brew install jq

      - name: Install Python test deps
        run: python3 -m pip install --upgrade pip numpy "pydantic>=2,<3" pytest soundfile typer rich safetensors

      - name: Install UI deps
        working-directory: ui
        run: npm ci

      - name: Install Playwright browser (chromium)
        working-directory: ui
        run: npx playwright install chromium

      - name: Stamp installed deps
        # Tell the gate its deps are already fresh (matches lib.sh deps_write_stamp)
        # so gate_cheap's ensure_node_modules skips a redundant `npm ci`.
        run: shasum -a 256 ui/package-lock.json | awk '{print $1}' > ui/node_modules/.mosh-deps-stamp

      - name: Run cheap gate
        run: |
          set -o pipefail
          base_ref="${{ github.base_ref || 'main' }}"
          # Make origin/<base> resolvable for the gate's diff-based steps.
          git fetch --no-tags origin "$base_ref:refs/remotes/origin/$base_ref" || true
          ./scripts/auto-loop/gate.sh cheap "$PWD" "origin/$base_ref" | tee gate-cheap.json
          # gate.sh exits non-zero on a red lane; propagate it (pipefail keeps the code).

      - name: Gate summary
        if: always()
        run: |
          [ -f gate-cheap.json ] || { echo "no gate output"; exit 0; }
          {
            echo "### Cheap gate — \`$(jq -r '.pass' gate-cheap.json)\`"
            echo ""
            echo "| step | result |"
            echo "|------|:------:|"
            jq -r '.steps[] | "| \(.name) | \(if .ok then "✅" else "❌" end) |"' gate-cheap.json
          } >> "$GITHUB_STEP_SUMMARY"
          # Echo failing step logs to the job log for quick triage.
          jq -r '.steps[] | select(.ok|not) | "\n=== FAILED: \(.name) ===\n\(.detail.log // .detail)"' gate-cheap.json || true

  # ── Native lane: full compiled gate. Heavy — promote to required once green. ─
  native-gate:
    name: native gate (build · Catch2 · selftest ×3 · verify.py · conformance)
    needs: classify
    # Skip ONLY when the classifier positively succeeded and said "cheap" on a PR.
    # Every push to main still runs the full lane unconditionally: a cheap-class PR
    # gets no native coverage of its own, so main's post-merge run is that change's
    # only native validation — and with `strict: false` on branch protection it is
    # also the only place a bad PR *combination* is ever compiled.
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       needs.classify.result != 'success' ||
       needs.classify.outputs.class != 'cheap')
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Toolchain (ninja, jq) + numpy
        run: |
          jq --version >/dev/null 2>&1 || brew install jq
          command -v ninja >/dev/null 2>&1 || brew install ninja
          python3 -m pip install --upgrade pip numpy

      - name: Rewrite SSH submodule URLs to HTTPS
        # tracktion_engine's JUCE submodule is pinned via a git@github.com: URL; the
        # recursive FetchContent fetch has no SSH key on the runner. This rewrite lets
        # it clone over HTTPS (documented in cmake/Dependencies.cmake).
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Restore dep cache (CPM packages + patched tracktion/JUCE source)
        # Because runners set CI=true, CMakeLists.txt pins CPM_SOURCE_CACHE=
        # <repo>/.cpm-cache and FETCHCONTENT_BASE_DIR=<repo>/.cpm-cache/_fc (developer
        # Macs default OUTSIDE the tree — iCloud eviction), so this ONE dir holds every
        # fetched source (Catch2 + tracktion_engine + its recursive JUCE submodule,
        # already patched). Restore-only here; a poison-resistant save runs at the end
        # (only when the recursive JUCE checkout is complete).
        uses: actions/cache/restore@v4
        with:
          path: .cpm-cache
          # github.repository is folded into the key so a repo RENAME (which changes the
          # runner checkout path /Users/runner/work/<repo>/<repo>) ROTATES the cache
          # instead of restoring a pre-rename cache whose FetchContent sub-build
          # CMakeCache.txt has the old absolute path baked in — cmake then refuses the
          # mismatched dir ("current CMakeCache.txt directory ... is different than ...")
          # and every branch's native gate dies at configure (this happened on the
          # 2026-07-16 zeke431/ClaudeMosh -> zeke431/Mosh rename; see CLAUDE.md). No
          # restore-keys: an exact-key miss must refetch, never prefix-fall-back to a
          # foreign-path cache.
          key: deps-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake', 'patches/**') }}

      - name: Purge a path-stale dep cache (self-heal)
        # Defense-in-depth for the key rotation above: if a restored .cpm-cache carries a
        # FetchContent sub-build CMakeCache.txt baked with a checkout path other than this
        # run's ($GITHUB_WORKSPACE) — e.g. after any future move/rename — drop it so the
        # build refetches fresh into the correct path instead of dying at cmake configure.
        run: |
          f=.cpm-cache/_fc/tracktion_engine-subbuild/CMakeCache.txt
          if [ -f "$f" ]; then
            baked="$(sed -n 's/^CMAKE_CACHEFILE_DIR:INTERNAL=//p' "$f" | head -1)"
            case "$baked" in
              "$GITHUB_WORKSPACE"/*|"") : ;;  # belongs to this checkout (or unknown fmt) — keep
              *) echo "stale .cpm-cache baked at '$baked' (!= $GITHUB_WORKSPACE) — purging"; rm -rf .cpm-cache ;;
            esac
          fi

      - name: Install UI deps
        working-directory: ui
        run: npm ci

      - name: Run native gate
        env:
          MOSH_AUTOLOOP_HOME: ${{ runner.temp }}/mosh-autoloop
          # Standard hosted Apple-Silicon runners have limited RAM. The owner
          # cockpit adds another substantial translation unit; unbounded Ninja
          # parallelism can OOM one compiler while later warnings hide the kill.
          CMAKE_BUILD_PARALLEL_LEVEL: 2
          # Anti-vacuity RATCHET. gate.sh only reds on "the 3 runs disagree" and
          # "a check failed" — so a change that silently stops RUNNING a whole
          # selftest section is green, because all 3 runs agree on the new, lower
          # number. This floor is the guard that catches that; without it the
          # check at gate.sh's baseline block is dead code ("baseline":"unset").
          #
          # It is a ratchet: RAISING it is a normal commit. LOWERING it requires a
          # stated reason in the PR body — a drop is either a deleted section
          # (justify it) or the #424 `return 0; // SABOTAGE` class (fix it).
          #
          # 1656 is THIS LANE's number, not the Mac's. Counts are gate-dependent:
          # a dev Mac with SA3/RAVE/whisper weights installed reports ~1681, while
          # CI runs the hermetic default (MOSH_ENABLE_SA3=0 / _TRANSFORM=0 etc.)
          # and reports 1656 — verified deterministic across runs 29643334376,
          # 29642707322, 29667786187, 29666934939. Do NOT paste a local count in
          # here: a 1681 floor reds every CI run.
          MOSH_SELFTEST_BASELINE: 1656
        run: |
          set -o pipefail
          # Leave CPM_SOURCE_CACHE / FETCHCONTENT_BASE_DIR at the CMakeLists defaults
          # (<repo>/.cpm-cache[/_fc]) so the cached dir above is exactly what the build reads.
          base_ref="${{ github.base_ref || 'main' }}"
          git fetch --no-tags origin "$base_ref:refs/remotes/origin/$base_ref" || true
          ./scripts/auto-loop/gate.sh native "$PWD" "origin/$base_ref" | tee gate-native.json

      - name: Check tracktion/JUCE clone completeness
        if: always()
        id: fc
        run: |
          # Only cache once the recursive JUCE submodule is fully checked out, so a
          # half-populated clone from an interrupted run can never poison the cache.
          if [ -d .cpm-cache/_fc/tracktion_engine-src/modules/juce/modules ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save dep cache
        if: always() && steps.fc.outputs.complete == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cpm-cache
          # Key MUST match the restore step (incl. the github.repository segment).
          key: deps-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake', 'patches/**') }}

      - name: Gate summary
        if: always()
        run: |
          [ -f gate-native.json ] || { echo "no gate output"; exit 0; }
          {
            echo "### Native gate — \`$(jq -r '.pass' gate-native.json)\`"
            echo ""
            echo "selftest checks (×3): \`$(jq -rc '.selftest' gate-native.json)\`  ·  failed: \`$(jq -r '.selftest_failed' gate-native.json)\`  ·  asserts: \`$(jq -r '.asserts' gate-native.json)\`"
            echo ""
            echo "| step | result |"
            echo "|------|:------:|"
            jq -r '.steps[] | "| \(.name) | \(if .ok then "✅" else "❌" end) |"' gate-native.json
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.steps[] | select(.ok|not) | "\n=== FAILED: \(.name) ===\n\(.detail.log // .detail)"' gate-native.json || true
