# Linux build spike (FIT-011) — the piece that actually COMPILES Mosh on real Linux.
# The macOS dev box can't build for Linux, so CI is the proof. Two stages share one
# tracktion/JUCE fetch (FETCHCONTENT_BASE_DIR is pinned to .cpm-cache/_fc in
# CMakeLists.txt, independent of the build dir):
#   1. Headless MoshTests — REQUIRED. Configures with the app OFF, so it needs no
#      WebKitGTK/ALSA/node and can't be blocked by a GUI-dep snag.
#   2. Full GUI app — REQUIRED. Builds the Debug app and runs its --selftest ×3 +
#      --selftest-undo under Xvfb against the Linux floors (./run-linux.sh selftest).
#      Not evidence for the macOS native gate.
# See docs/2026-07-07-linux-build-spike.md.
name: linux-ci

on:
  push:
    # main only. A `claude/**` branch with an open PR was matching BOTH this and the
    # pull_request trigger below on the same commit, and their concurrency groups
    # differ (refs/heads/... vs refs/pull/N/merge) so neither cancelled the other —
    # every push ran linux-x64 twice. PR branches are covered by pull_request; this
    # trigger now exists for post-merge main validation only.
    branches: [main]
    paths:
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "src/**"
      - "tests/**"
      - "service/**"
      - "ui/**"
      - "run-linux.sh"
      - ".github/workflows/linux-ci.yml"
      # Conformance-check inputs outside the paths above (the conformance job below).
      - "scripts/daw-conformance/**"
      - "scripts/verify-hardware/**"
      - "docs/reality-pack/**"
      - "docs/FEATURE_AUDIT.md"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "CMakePresets.json"
      - "cmake/**"
      - "src/**"
      - "tests/**"
      - "service/**"
      - "ui/**"
      - "run-linux.sh"
      - ".github/workflows/linux-ci.yml"
      # Conformance-check inputs outside the paths above (the conformance job below).
      - "scripts/daw-conformance/**"
      - "scripts/verify-hardware/**"
      - "docs/reality-pack/**"
      - "docs/FEATURE_AUDIT.md"
  workflow_dispatch:

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # tracktion_engine pulls JUCE as a recursive submodule over SSH — rewrite to
      # HTTPS so the FetchContent clone works with no SSH keys (cmake/Dependencies.cmake).
      - name: Rewrite git SSH -> HTTPS (for the JUCE submodule)
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      # Full system-dep set. The headless gate uses only build-essential/cmake/ninja;
      # webkit/gtk/alsa/x11/freetype are for stage 2 (the full app). node is preinstalled
      # on ubuntu-latest (the Vite bundle build for the app).
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libfreetype6-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libxcomposite-dev libcurl4-openssl-dev xvfb
          cmake --version && ninja --version && node --version

      # Best-effort cache of the tracktion/JUCE FetchContent tree (shared by both stages).
      # github.repository is folded into BOTH the key AND the restore-keys prefix so a
      # repo RENAME (which changes /home/runner/work/<repo>/<repo>) can't prefix-match a
      # pre-rename cache whose sub-build CMakeCache.txt has the old absolute path baked in
      # — cmake then refuses the mismatched dir at configure (the 2026-07-16
      # zeke431/ClaudeMosh -> zeke431/Mosh rename broke this stage; see ci.yml + CLAUDE.md).
      - name: Cache CPM/FetchContent
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          # Keep the patch-stack hash ahead of the restore prefix: a dependency patch
          # change must never restore source containing an older version of that stack.
          key: cpm-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('patches/**') }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('patches/**') }}-

      - name: Purge a path-stale dep cache (self-heal)
        # Defense-in-depth: restore-keys can prefix-match an older cache, so if the
        # restored .cpm-cache has a FetchContent sub-build CMakeCache.txt baked with a
        # checkout path other than this run's ($GITHUB_WORKSPACE), drop it and refetch.
        run: |
          f=.cpm-cache/_fc/tracktion_engine-subbuild/CMakeCache.txt
          if [ -f "$f" ]; then
            baked="$(sed -n 's/^CMAKE_CACHEFILE_DIR:INTERNAL=//p' "$f" | head -1)"
            case "$baked" in
              "$GITHUB_WORKSPACE"/*|"") : ;;  # belongs to this checkout (or unknown fmt) — keep
              *) echo "stale .cpm-cache baked at '$baked' (!= $GITHUB_WORKSPACE) — purging"; rm -rf .cpm-cache ;;
            esac
          fi

      # ── Stage 1 (REQUIRED): headless MoshTests ────────────────────────────────
      # App/UI OFF so this configures with only build-essential/cmake/ninja present.
      - name: Configure (headless MoshTests)
        run: |
          cmake --preset linux-x64-debug \
            -B build-linux-headless \
            -DMOSH_BUILD_APP=OFF -DMOSH_BUILD_UI=OFF -DMOSH_BUILD_PLUGIN_FIXTURES=OFF

      - name: Build MoshTests
        run: cmake --build build-linux-headless --target MoshTests

      - name: Run MoshTests (ctest)
        run: ctest --test-dir build-linux-headless -R MoshTests --output-on-failure

      # ── Stage 1b (REQUIRED): the cross-platform Python service imports/boots ──
      # No build step — prove the service is import-clean and answers /health on Linux
      # under the stdlib FakeAdapter (MOSH_ENABLE_SA3=0). Uses runner python3 only.
      - name: Smoke the generative service (FakeAdapter)
        run: |
          # Import-clean check (top-level imports must be stdlib-only on a bare box).
          python3 -c "import sys; sys.path.insert(0,'service'); import server; print('server import OK', server.SERVICE_VERSION)"
          # Boot it, learn the actually-bound port from the portfile, hit /health.
          PORTFILE="$(mktemp)"
          MOSH_ENABLE_SA3=0 MOSH_SERVICE_PORTFILE="$PORTFILE" python3 service/server.py &
          SVC_PID=$!
          HEALTHY=""
          for i in $(seq 1 30); do
            PORT="$(cat "$PORTFILE" 2>/dev/null || true)"
            if [ -n "$PORT" ] && curl -sf "http://127.0.0.1:$PORT/health" >/dev/null 2>&1; then
              echo "service /health OK on port $PORT"; HEALTHY=1; break
            fi
            sleep 1
          done
          kill "$SVC_PID" 2>/dev/null || true
          test -n "$HEALTHY" || { echo "service did not become healthy"; exit 1; }

      # ── Stage 2 (REQUIRED): the full GUI app + its headless self-tests ────────
      # WebKitGTK webview + ALSA audio + JUCE Linux VST3 hosting + the Vite bundle.
      # Debug, NOT the native gate's Release: GCC -O3 on src/app/SelfTest.cpp (~22k lines)
      # alone ran >80 min on 4 vCPU and never finished, which cannot fit this job. In
      # Debug, jassert is live, so ./run-linux.sh selftest reports JUCE assertions but
      # does not fail on them (the gate's Release run cannot see them either). The
      # workflow's path filter above already limits this to src/cmake/CMakeLists/tests/
      # ui/service/run-linux.sh/workflow changes, so no extra filter is needed.
      # The app build's MoshSkillIdentityGate target runs `npm run verify:skill-identities`
      # (tsx from ui/node_modules) before anything in the build installs ui deps, so a fresh
      # checkout fails with "tsx: not found". Install them first, as the cheap gate does.
      - name: Install UI deps (npm ci)
        working-directory: ui
        run: npm ci --no-audit --no-fund

      - name: Configure (full app)
        run: cmake --preset linux-x64-debug

      - name: Build Mosh app
        run: cmake --build build-linux-x64 --target Mosh

      # --selftest ×3 + --selftest-undo under xvfb-run, SA3/transform off (the selftest
      # also forces both off itself). Logs land in selftest-logs/ for the artifact below.
      - name: Self-test Mosh app under Xvfb
        env:
          MOSH_LINUX_PRESET: linux-x64-debug
          MOSH_ENABLE_SA3: "0"
          MOSH_ENABLE_TRANSFORM: "0"
          MOSH_SELFTEST_LOG_DIR: ${{ github.workspace }}/selftest-logs
        run: ./run-linux.sh selftest

      - name: Upload self-test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-selftest-logs
          path: selftest-logs/
          if-no-files-found: ignore
          retention-days: 7

  # ── Re-Imagine VST3 plug-in tests (path-filtered, separate job) ─────────────────
  # Cheap gate: decide whether this change touches the Re-Imagine plug-in, its service
  # path, its tests, CMake or this workflow. Only then pay for the plug-in build below,
  # so the required linux-x64 job is not lengthened for every PR.
  reimagine-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect Re-Imagine-relevant changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = "pull_request" ]; then base="$BASE_SHA"; else base="$BEFORE_SHA"; fi
          # Unknown/zero base (new branch, force-push) → run rather than silently skip.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$base"...HEAD)"
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/reimagine/|service/direct_render\.py$|service/reimagine_planner\.py$|service/server\.py$|tests/test_reimagine|CMakeLists\.txt$|.*/CMakeLists\.txt$|CMakePresets\.json$|cmake/|\.github/workflows/linux-ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # Builds the Re-Imagine VST3 + its headless tests on Linux (MOSH_BUILD_REIMAGINE_PLUGIN
  # is explicitly ON here; its default stays Apple-only) and runs:
  #   MoshReImagineLoopE2E      — M1 loop against service/server.py with the direct-render
  #                               TEST FIXTURE adapter (python3, no model, no audio claim)
  #   MoshReImagineEditorSmoke  — editor paint under Xvfb
  # MoshReImagineBundleSmoke is macOS-only (plutil/lipo on the .vst3 bundle) and is not
  # configured on Linux. The [reimagine] Catch2 cases run in linux-x64's MoshTests.
  reimagine-plugin:
    needs: reimagine-changes
    if: needs.reimagine-changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite git SSH -> HTTPS (for the JUCE submodule)
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config xvfb \
            libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libfreetype6-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev \
            libxcomposite-dev libcurl4-openssl-dev

      # Restore-only: linux-x64 owns saving this key, so the two jobs never race a save.
      - name: Restore CPM/FetchContent cache
        uses: actions/cache/restore@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('patches/**') }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake', 'CMakeLists.txt') }}
          restore-keys: |
            cpm-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('patches/**') }}-

      - name: Purge a path-stale dep cache (self-heal)
        run: |
          f=.cpm-cache/_fc/tracktion_engine-subbuild/CMakeCache.txt
          if [ -f "$f" ]; then
            baked="$(sed -n 's/^CMAKE_CACHEFILE_DIR:INTERNAL=//p' "$f" | head -1)"
            case "$baked" in
              "$GITHUB_WORKSPACE"/*|"") : ;;
              *) echo "stale .cpm-cache baked at '$baked' (!= $GITHUB_WORKSPACE) — purging"; rm -rf .cpm-cache ;;
            esac
          fi

      - name: Configure (Re-Imagine plug-in ON)
        run: |
          cmake --preset linux-x64-debug \
            -B build-linux-reimagine \
            -DMOSH_BUILD_APP=OFF -DMOSH_BUILD_UI=OFF -DMOSH_BUILD_PLUGIN_FIXTURES=OFF \
            -DMOSH_BUILD_REIMAGINE_PLUGIN=ON

      - name: Build Re-Imagine VST3 + tests
        run: |
          cmake --build build-linux-reimagine --target \
            MoshReImaginePlugin_VST3 MoshReImagineLoopE2E MoshReImagineEditorSmoke

      - name: Run Re-Imagine plug-in tests (ctest, Xvfb)
        run: xvfb-run -a ctest --test-dir build-linux-reimagine -R MoshReImagine --output-on-failure

  # ── DAW-parity conformance checks (path-filtered, separate job, seconds) ──────
  # The same three stdlib-only checks gate.sh's run_parity_checks runs in both lanes:
  # the model lint, the dispatch-command coverage ledger, and the scoreboard freshness
  # check (a stale docs/FEATURE_AUDIT.md). Running them here surfaces scoreboard drift
  # on ubuntu instead of waiting for the macOS cheap gate. No build, no deps beyond the
  # runner's python3. The filter lists exactly the files those scripts read.
  conformance-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect conformance-input changes
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = "pull_request" ]; then base="$BASE_SHA"; else base="$BEFORE_SHA"; fi
          # Unknown/zero base (new branch, force-push) → run rather than silently skip.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$base"...HEAD)"
          if echo "$changed" | grep -qE '^(scripts/daw-conformance/|scripts/verify-hardware/|docs/reality-pack/|docs/FEATURE_AUDIT\.md$|src/moshops/|src/app/|ui/e2e/|\.github/workflows/linux-ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Model lint
        if: steps.filter.outputs.run == 'true'
        run: python3 scripts/daw-conformance/model_lint.py
      - name: Dispatch-command coverage
        if: steps.filter.outputs.run == 'true'
        run: python3 scripts/daw-conformance/coverage_check.py
      - name: Scoreboard freshness (docs/FEATURE_AUDIT.md)
        if: steps.filter.outputs.run == 'true'
        run: python3 scripts/daw-conformance/scoreboard.py --check
