name: Release

# Build, Developer-ID sign, notarize, staple, and package Mosh.app on a version-tag
# push (v*), and publish a GitHub Release with the DMG + zip attached.
#
# This calls the SAME `./run-mosh.sh release` verb the owner runs locally — which
# itself delegates the actual signing/notarization mechanics to
# scripts/release/sign-and-notarize.sh (+ scripts/release/make-dmg.sh) — so there is
# exactly ONE implementation of "how Mosh gets signed", not a CI-side reimplementation
# that could quietly drift from the local path. This workflow's own job is narrower:
# get real credentials into the runner's keychain/environment, then get out of the way.
#
# FAIL-CLOSED: a "Check required secrets" step runs FIRST (before the slow dependency
# restore + build) and refuses with an exact list of missing repo secrets rather than
# limping through a 20+ minute build only to fail at the signing step. The signing
# script's OWN preflight (scripts/release/sign-and-notarize.sh --preflight-only) is a
# second, independent fail-closed layer — belt and suspenders, not redundant: the first
# catches "secrets never configured", the second catches "secrets configured but wrong"
# (bad password, wrong team id, expired cert), which only a live Apple API call reveals.
#
# Real signing/notarization is UNVERIFIED by this repo's own gate (no Developer ID
# Application cert exists on the machine this workflow was authored on — see
# docs/release/SIGNING_RUNBOOK.md). Everything up to and including "does the script
# fail closed / does it construct the right commands" was proven with --dry-run and a
# fake identity (see the PR description); the live codesign → notarytool → stapler →
# spctl chain against Apple's real service is the owner's first real run to verify.
#
# CI may be flaky (network blips talking to Apple, a runner hiccup) — every step below
# is written to be safely re-run: nothing here mutates persistent state outside this
# job's own ephemeral keychain and temp/output directories, and `run-mosh.sh release`
# itself is idempotent (re-running it re-signs/re-notarizes from scratch; it never
# assumes a partial prior run's leftovers).
#
# Required repo secrets (Settings → Secrets and variables → Actions). Names are exactly
# the env vars scripts/release/sign-and-notarize.sh reads — no translation layer:
#   MOSH_DIST_CERT_P12_BASE64   base64 of the exported "Developer ID Application" .p12
#                                 (Keychain Access → export the cert+key → base64 it:
#                                 `base64 -i DeveloperIDApplication.p12 | pbcopy`)
#   MOSH_DIST_CERT_PASSWORD     the password set when exporting that .p12
#   MOSH_NOTARY_APPLE_ID        Apple ID email (notarization account)
#   MOSH_NOTARY_TEAM_ID         Developer Team ID (e.g. ZYT77F9B27)
#   MOSH_NOTARY_PASSWORD        an APP-SPECIFIC password (appleid.apple.com → Sign-In
#                                 and Security → App-Specific Passwords) — NEVER the
#                                 actual Apple ID password
# Optional:
#   MOSH_SIGN_IDENTITY           pin an exact identity string instead of auto-discovery
#                                 (only useful if the imported .p12 somehow yields more
#                                 than one Developer ID Application identity)
#   MOSH_RELEASE_BRAIN_ENV_BASE64  base64 of a ui/.env.local-shaped dotenv containing
#                                 MOSH_BRAIN_PROXY_URL and its publishable
#                                 MOSH_BRAIN_PROXY_APIKEY. Provider keys are refused.
#
# See docs/release/SIGNING_RUNBOOK.md for the full one-time setup (creating the cert,
# exporting the .p12, generating the app-specific password) and the Sparkle/appcast
# auto-update hook point this workflow deliberately does NOT wire up yet.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # manual test run — builds/signs/notarizes/packages, uploads
                          # as workflow artifacts, but NEVER creates a public GitHub
                          # Release (that only ever happens on an actual tag push).

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-notarization

permissions:
  contents: write   # only used by the "Create GitHub Release" step, tag-push only

env:
  MOSH_RELEASE_DIR: ${{ github.workspace }}/dist/release

jobs:
  release:
    name: build · sign · notarize · package
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── fail closed on missing secrets BEFORE spending any CI time ────────────
      - name: Check required release secrets
        env:
          HAVE_CERT: ${{ secrets.MOSH_DIST_CERT_P12_BASE64 != '' }}
          HAVE_CERT_PW: ${{ secrets.MOSH_DIST_CERT_PASSWORD != '' }}
          HAVE_APPLE_ID: ${{ secrets.MOSH_NOTARY_APPLE_ID != '' }}
          HAVE_TEAM_ID: ${{ secrets.MOSH_NOTARY_TEAM_ID != '' }}
          HAVE_NOTARY_PW: ${{ secrets.MOSH_NOTARY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          missing=""
          [ "$HAVE_CERT" = "true" ]      || missing="$missing MOSH_DIST_CERT_P12_BASE64"
          [ "$HAVE_CERT_PW" = "true" ]   || missing="$missing MOSH_DIST_CERT_PASSWORD"
          [ "$HAVE_APPLE_ID" = "true" ]  || missing="$missing MOSH_NOTARY_APPLE_ID"
          [ "$HAVE_TEAM_ID" = "true" ]   || missing="$missing MOSH_NOTARY_TEAM_ID"
          [ "$HAVE_NOTARY_PW" = "true" ] || missing="$missing MOSH_NOTARY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repo secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions." >&2
            echo "See docs/release/SIGNING_RUNBOOK.md for exactly what each one is and" >&2
            echo "how to produce it (export the Developer ID .p12, make an app-specific" >&2
            echo "password, etc.) — this workflow refuses to spend a 20+ minute build on" >&2
            echo "a release it already knows can't be signed." >&2
            exit 1
          fi
          echo "all required release secrets are present (names only checked, never values)"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Toolchain (ninja, jq)
        run: |
          command -v ninja >/dev/null 2>&1 || brew install ninja
          jq --version >/dev/null 2>&1 || brew install jq

      - name: Rewrite SSH submodule URLs to HTTPS
        # Same fix as ci.yml: tracktion_engine's JUCE submodule is pinned via a
        # git@github.com: URL; the recursive FetchContent fetch has no SSH key here.
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Restore dep cache (CPM packages + patched tracktion/JUCE source)
        uses: actions/cache/restore@v4
        with:
          path: .cpm-cache
          key: deps-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/CPM.cmake', 'patches/**') }}

      - name: Purge a path-stale dep cache (self-heal)
        # See .github/workflows/ci.yml for the full rationale (2026-07-16 repo-rename
        # poisoning incident) — same defense here, since this workflow shares the cache.
        run: |
          f=.cpm-cache/_fc/tracktion_engine-subbuild/CMakeCache.txt
          if [ -f "$f" ]; then
            baked="$(sed -n 's/^CMAKE_CACHEFILE_DIR:INTERNAL=//p' "$f" | head -1)"
            case "$baked" in
              "$GITHUB_WORKSPACE"/*|"") : ;;
              *) echo "stale .cpm-cache baked at '$baked' (!= $GITHUB_WORKSPACE) — purging"; rm -rf .cpm-cache ;;
            esac
          fi

      # ── import the Developer ID cert into an EPHEMERAL keychain ───────────────
      # Standard GH Actions macOS codesigning recipe: a fresh keychain (never touches
      # the runner's default/login keychain), added to the search list so
      # `security find-identity` (which scripts/release/sign-and-notarize.sh calls
      # with no -k, i.e. "search the default list") actually finds it, with a long
      # lock timeout so it can't auto-lock mid-build, and `set-key-partition-list` so
      # codesign can use the imported key without a GUI keychain-access prompt (which
      # would hang forever on a headless runner). Deleted unconditionally at the end
      # (`if: always()`, a separate step below) — nothing here outlives this job.
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MOSH_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MOSH_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/mosh-release.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          # Mask it defensively even though it's a throwaway generated-here password
          # never exported to GITHUB_ENV or used past this step (delete-keychain,
          # used by the cleanup step below, does not require it) — belt and suspenders
          # against it ever ending up in a log line.
          echo "::add-mask::$KEYCHAIN_PW"
          echo "MOSH_CI_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          EXISTING="$(security list-keychains -d user | sed 's/[[:space:]]*"\(.*\)"/\1/')"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING

          CERT_PATH="$RUNNER_TEMP/mosh-dist-cert.p12"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PW" "$KEYCHAIN"
          rm -f "$CERT_PATH"

          echo "imported cert; identities now visible to security find-identity:"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed 's/^/  /'

      # ── optional: bundle proxy configuration ────────────────────────────────
      - name: Bundle brain proxy configuration (optional)
        if: ${{ secrets.MOSH_RELEASE_BRAIN_ENV_BASE64 != '' }}
        env:
          BRAIN_ENV_BASE64: ${{ secrets.MOSH_RELEASE_BRAIN_ENV_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$BRAIN_ENV_BASE64" | base64 --decode > ui/.env.local
          if grep -qE '^[[:space:]]*[A-Z0-9_]+_API_KEY[[:space:]]*=[[:space:]]*.+' ui/.env.local; then
            echo "provider API keys are forbidden in release artifacts" >&2
            exit 1
          fi
          grep -qE '^MOSH_BRAIN_PROXY_URL=.+' ui/.env.local
          grep -qE '^MOSH_BRAIN_PROXY_APIKEY=.+' ui/.env.local
          echo "wrote proxy-only ui/.env.local from MOSH_RELEASE_BRAIN_ENV_BASE64"

      # ── build once here so a broken build fails BEFORE notarization is attempted;
      # `./run-mosh.sh release` below rebuilds against the same preset, which is then
      # a fast no-op incremental step (nothing changed) ──────────────────────────
      - name: Build (Release)
        run: |
          set -euo pipefail
          cmake --preset macos-arm64-release
          cmake --build --preset macos-arm64-release-app

      - name: Selftest smoke (fail before burning notary quota on a broken build)
        run: |
          set -euo pipefail
          APP="$(find build-macos-arm64-release -maxdepth 4 -name 'Mosh.app' -type d | sort | tail -n 1)"
          BIN="$APP/Contents/MacOS/Mosh"
          [ -x "$BIN" ] || { echo "::error::built Mosh binary not found"; exit 1; }
          SESS="ci-release-$$"
          PORT=$((10000 + RANDOM % 5000))
          set +e
          MOSH_SELFTEST_SESSION="$SESS" MOSH_SERVICE_PORT="$PORT" \
            "$BIN" --selftest -ApplePersistenceIgnoreState YES > selftest.log 2>&1
          rc=$?
          set -e
          tail -n 40 selftest.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::--selftest exited $rc — see selftest.log (uploaded as an artifact)"
            exit 1
          fi
          if grep -qE '\bFAILED\b|\bassertion\b' selftest.log; then
            echo "::error::--selftest reported a failure — see selftest.log"
            exit 1
          fi
          echo "selftest: clean"

      - name: Upload selftest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-log
          path: selftest.log
          retention-days: 14
          if-no-files-found: ignore

      # ── the real work: build (no-op incremental) → stage → bundle service/brain
      # key → sign+notarize+staple the app → package a DMG → sign+notarize+staple
      # the DMG → zip. See run-mosh.sh's own `release)` case — this is that exact
      # code path, not a CI-side reimplementation. ─────────────────────────────
      - name: "./run-mosh.sh release"
        env:
          MOSH_NOTARY_APPLE_ID: ${{ secrets.MOSH_NOTARY_APPLE_ID }}
          MOSH_NOTARY_TEAM_ID: ${{ secrets.MOSH_NOTARY_TEAM_ID }}
          MOSH_NOTARY_PASSWORD: ${{ secrets.MOSH_NOTARY_PASSWORD }}
          MOSH_SIGN_IDENTITY: ${{ secrets.MOSH_SIGN_IDENTITY }}
        run: |
          set -o pipefail
          ./run-mosh.sh release 2>&1 | tee release.log

      - name: Upload release log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-log
          path: release.log
          retention-days: 14
          if-no-files-found: ignore

      # ── delete the ephemeral keychain + any leftover secret material, always ──
      - name: Clean up signing keychain
        if: always()
        run: |
          if [ -n "${MOSH_CI_KEYCHAIN:-}" ] && [ -f "$MOSH_CI_KEYCHAIN" ]; then
            security delete-keychain "$MOSH_CI_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/mosh-dist-cert.p12" ui/.env.local || true

      # ── rename to versioned filenames + upload as workflow artifacts (always,
      # so a workflow_dispatch test run has something to download and inspect).
      # `github.ref_name` is a branch name (can contain "/") on workflow_dispatch —
      # sanitize before using it in a filename or an artifact name (GitHub rejects
      # "/" in artifact names; a literal "/" in a filename would nest a directory
      # nobody asked for). ─────────────────────────────────────────────────────
      - name: Collect artifacts
        if: success()
        run: |
          set -euo pipefail
          SAFE_REF="$(printf '%s' "${{ github.ref_name }}" | tr '/' '-')"
          echo "SAFE_REF=$SAFE_REF" >> "$GITHUB_ENV"
          mkdir -p "$MOSH_RELEASE_DIR/named"
          cp "$MOSH_RELEASE_DIR/Mosh.dmg" "$MOSH_RELEASE_DIR/named/Mosh-$SAFE_REF.dmg"
          cp "$MOSH_RELEASE_DIR/Mosh.zip" "$MOSH_RELEASE_DIR/named/Mosh-$SAFE_REF.zip"
          echo "MOSH_DMG_PATH=$MOSH_RELEASE_DIR/named/Mosh-$SAFE_REF.dmg" >> "$GITHUB_ENV"
          echo "MOSH_ZIP_PATH=$MOSH_RELEASE_DIR/named/Mosh-$SAFE_REF.zip" >> "$GITHUB_ENV"

      - name: Upload DMG + zip as workflow artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mosh-${{ env.SAFE_REF }}
          path: |
            ${{ env.MOSH_DMG_PATH }}
            ${{ env.MOSH_ZIP_PATH }}
          retention-days: 90

      # ── publish a public GitHub Release — ONLY on an actual tag push, never on
      # workflow_dispatch (that path is test-only; see the header note). Plain
      # --generate-notes (no manually-computed --notes-start-tag): gh already finds
      # the previous release/tag itself — a hand-rolled tag-range computation here
      # would be one more untested thing that could quietly break a release. ─────
      - name: Create GitHub Release
        if: success() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ github.ref_name }}" \
            "$MOSH_DMG_PATH" "$MOSH_ZIP_PATH" \
            --title "Mosh ${{ github.ref_name }}" \
            --generate-notes
