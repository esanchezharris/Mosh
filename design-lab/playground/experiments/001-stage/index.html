<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>001 · HEARTH v2 — presence in fog</title>
<style>
  :root {
    --ink: #0B0B0B; --lime: #CCFF23; --lime-glow: #D9FF4C;
    --bone: #F6F2EB; --mist: #E5E5E1;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --font-display: "Archivo Black", "Helvetica Neue", -apple-system, "Arial Black", sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .chrome { position: fixed; font-family: var(--font-mono); color: var(--bone);
            user-select: none; -webkit-user-select: none; }
  #title { top: 18px; left: 20px; font-size: 11px; letter-spacing: .14em; opacity: .55; }
  #title b { font-family: var(--font-display); font-weight: 900; letter-spacing: .06em;
             color: var(--lime); font-size: 12px; }
  #bar { top: 18px; right: 20px; font-size: 11px; letter-spacing: .1em; opacity: .65;
         font-variant-numeric: tabular-nums; }
  #hint { bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 10px;
          letter-spacing: .12em; opacity: .35; text-align: center; }
  #controls { bottom: 14px; right: 16px; display: flex; gap: 8px; align-items: center; }
  #controls a { font-family: var(--font-mono); font-size: 9px; letter-spacing: .14em;
          color: var(--bone); opacity: .35; text-decoration: none; margin-right: 6px; }
  #controls a:hover { color: var(--lime); opacity: 1; }
  .pill { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em;
         background: transparent; color: var(--bone); border: 1px solid rgba(246,242,235,.25);
         border-radius: 999px; padding: 5px 12px; cursor: pointer; opacity: .7; }
  .pill:hover { opacity: 1; border-color: var(--lime); color: var(--lime); }
  .pill.on { color: var(--ink); background: var(--lime); border-color: var(--lime);
            opacity: 1; box-shadow: 0 0 24px rgba(217,255,76,.35); }
  #rec.on { animation: rp 1.1s ease-in-out infinite; }
  @keyframes rp { 50% { box-shadow: 0 0 44px rgba(217,255,76,.7); } }
  #err { top: 50%; left: 50%; transform: translate(-50%,-50%); color: var(--lime);
         font-size: 12px; display: none; }

  /* PS2 CRUNCH (house style v1) */
  #crt2 { position: fixed; inset: 0; z-index: 90; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); }
  canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<div id="crt2"></div>
<canvas id="gl"></canvas>
<div class="chrome" id="title"><b>HEARTH</b>&ensp;001 · v2 — presence in fog</div>
<div class="chrome tc" id="bar">BAR 1.1</div>
<div class="chrome" id="hint">move = brightness / energy · click = hit · R = open · mic optional</div>
<div class="chrome" id="controls"><a href="v1.html">V1 ⟶</a><button class="pill" id="rec">● OPEN (R)</button><button class="pill" id="mic">MIC OFF</button></div>
<div class="chrome" id="err">webgl unavailable</div>

<script>
// HEARTH v2 — rebuilt per inspiration/FIELD_NOTES.md "what this changes":
//   motif 3 (MCHX17, sabosugi): not veins-everywhere — ONE barely-resolved lime
//     mass breathing in ink fog, interference streaks raking across it. The form
//     drifts in and out of bilateral symmetry, so it almost becomes a creature,
//     then doesn't. Restraint is the whole composition.
//   motif 1 (marioecg): a razor-thin spectral fringe living EXACTLY on the
//     membrane iso-edge — constant screen width via fwidth(d), lime-white core
//     splitting to a cyan whisper inside and a magenta whisper outside.
//   specoolar: heat (recording) doesn't brighten the mass — it OPENS it. The core
//     inverts to true void wearing an accretion ring, doppler-bright on one side.
//   position: a faint lume tide leans across the fog once per 8 bars (+ mono BAR).
// Params: energy / bright / onset / heat / barPhase — autopilot < mouse < mic.

const FRAG_SRC = `
precision highp float;
uniform vec2  u_res;
uniform float u_time;
uniform float u_energy;    // loudness -> mass swells, fringe heats
uniform float u_bright;    // centroid -> lime leans toward glow
uniform float u_onset;     // transient -> the streaks flare
uniform float u_heat;      // recording -> the core opens (void + accretion)
uniform float u_barPhase;  // 0..1 in 8 bars -> the tide

const vec3 LIME = vec3(0.800, 1.000, 0.137);
const vec3 GLOW = vec3(0.851, 1.000, 0.298);

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x),
             mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) { v += a * vnoise(p); p = p * 2.03 + 7.31; a *= 0.5; }
  return v;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);
  float t = u_time * 0.05 * (1.0 + 0.6 * u_energy);

  // the presence wanders, low in the frame, never centered
  vec2 c = vec2(0.14 * sin(u_time * 0.043 + 1.7), -0.05 + 0.07 * sin(u_time * 0.031));
  vec2 q = uv - c;

  // transient bilateral symmetry: the fog almost resolves into a creature, then lets go
  float sym = smoothstep(0.25, 0.85, 0.5 + 0.5 * sin(u_time * 0.07)) * 0.65;
  vec2 qs = vec2(abs(q.x), q.y);

  vec2 p1 = q * 1.9, p2 = qs * 1.9;
  float w1 = fbm(p1 + vec2(fbm(p1 + t * 0.8), fbm(p1 - t * 0.6 + 5.2)));
  float w2 = fbm(p2 + vec2(fbm(p2 + t * 0.8), fbm(p2 - t * 0.6 + 5.2)));
  float body = mix(w1, w2, sym);

  float breath = 1.0 + 0.05 * sin(u_time * 0.85);
  float core = exp(-dot(q, q) * (9.5 - 3.2 * u_energy) * breath);
  float d = core * (0.28 + 0.95 * body * body);

  // interference streaks raking the mass; they flare on hits
  float scan = sin(uv.y * 230.0 + fbm(uv * 2.5 + t) * 8.0) * 0.5 + 0.5;
  scan = pow(scan, 3.0);
  float scanMod = 1.0 - (0.30 + 0.55 * u_onset) * smoothstep(0.08, 0.5, core) * (1.0 - scan) * 0.7;

  // ink fog + the tide (song position leans across the room)
  float fog = fbm(uv * 1.2 - t * 0.4);
  float tide = exp(-pow((uv.x - (u_barPhase * 2.6 - 1.3)) * 2.1, 2.0));
  vec3 col = vec3(0.022)
           + LIME * fog * fog * 0.035
           + mix(LIME, GLOW, u_bright) * tide * 0.016;

  // the presence itself: dim. luminance is earned by energy, not given.
  vec3 pcol = mix(LIME, GLOW, u_bright);
  float voidc = exp(-dot(q, q) * 26.0) * u_heat;
  col += pcol * d * scanMod * (0.11 + 0.55 * u_energy) * (1.0 - voidc * 0.9);

  // heat: the core opens — a void wearing an accretion ring
  if (u_heat > 0.004) {
    float r = length(q);
    float pulse = 0.75 + 0.25 * sin(u_time * 7.0);
    float rr = 0.125 + 0.008 * sin(u_time * 1.7) + 0.006 * pulse;
    float ring = exp(-pow((r - rr) * 34.0, 2.0));
    float dopp = 1.0 + 0.55 * sin(atan(q.y, q.x) + u_time * 0.5);
    col = mix(col, vec3(0.006), voidc * 0.95);
    col += mix(GLOW, vec3(1.0, 1.0, 0.88), 0.45) * ring * dopp * u_heat * pulse * 2.3;
    col += GLOW * exp(-pow((r - rr) * 6.5, 2.0)) * u_heat * 0.16;
    col += LIME * exp(-pow((r - rr * 2.1) * 8.0, 2.0)) * u_heat * 0.12
         * (0.5 + 0.5 * fbm(q * 6.0 + t * 2.0));
  }

  // the membrane fringe: razor-thin, constant screen width, spectrally split
  float iso = 0.235;
#ifdef HAS_DERIV
  float fw = fwidth(d) * 1.5 + 1e-5;
#else
  float fw = 0.010;
#endif
  float e = (d - iso) / fw;
  float band = exp(-e * e * 0.5);
  vec3 fringe = mix(LIME, vec3(1.0), 0.35) * band
              + vec3(0.30, 1.00, 0.85) * exp(-pow(e + 1.7, 2.0) * 0.5) * 0.30
              + vec3(1.00, 0.45, 0.95) * exp(-pow(e - 1.7, 2.0) * 0.5) * 0.22;
  col += fringe * smoothstep(0.06, 0.22, core)
       * (0.10 + 0.45 * u_energy + 0.25 * u_heat);

  // vignette into the void + grain (banding dies here)
  float vig = smoothstep(1.30, 0.42, length(uv));
  col = mix(vec3(0.014), col, vig);
  col = floor(col * 6.0 + hash(gl_FragCoord.xy + fract(u_time) * 61.7)) / 6.0;   // 6 bands + dither

  gl_FragColor = vec4(col, 1.0);
}`;

const VERT = `attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;

const cv = document.getElementById('gl');
const gl = cv.getContext('webgl', { antialias: false, alpha: false });
if (!gl) { document.getElementById('err').style.display = 'block'; throw new Error('no webgl'); }
const deriv = gl.getExtension('OES_standard_derivatives');
const FRAG = (deriv ? '#extension GL_OES_standard_derivatives : enable\n#define HAS_DERIV 1\n' : '') + FRAG_SRC;

function sh(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = {};
for (const n of ['u_res','u_time','u_energy','u_bright','u_onset','u_heat','u_barPhase'])
  U[n] = gl.getUniformLocation(prog, n);

function resize() {
  const dpr = 0.25;   // PS2 crunch: quarter-res, nearest
  cv.width = Math.floor(innerWidth * dpr);
  cv.height = Math.floor(innerHeight * dpr);
  gl.viewport(0, 0, cv.width, cv.height);
}
addEventListener('resize', resize); resize();

// ---------- parameter sources: autopilot < mouse < mic; heat is its own switch ----------
const state = { energy: .28, bright: .4, onset: 0, heat: 0, target: { energy: .28, bright: .4 } };
let mouseAge = 1e9, micOn = false, recOn = false;

addEventListener('mousemove', e => {
  state.target.bright = e.clientX / innerWidth;
  state.target.energy = 1 - e.clientY / innerHeight;
  mouseAge = 0;
});
addEventListener('pointerdown', e => {
  if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A') { state.onset = 1; mouseAge = 0; }
});

const recBtn = document.getElementById('rec');
function setRec(on) {
  recOn = on;
  recBtn.classList.toggle('on', on);
  recBtn.textContent = on ? '● OPEN' : '● OPEN (R)';
}
recBtn.addEventListener('click', () => setRec(!recOn));
addEventListener('keydown', e => { if (e.key.toLowerCase() === 'r') setRec(!recOn); });

let analyser = null, freq = null, wave = null, prevMag = null;
document.getElementById('mic').addEventListener('click', async (e) => {
  if (micOn) { micOn = false; e.target.classList.remove('on'); e.target.textContent = 'MIC OFF'; return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(stream);
    analyser = ac.createAnalyser(); analyser.fftSize = 1024;
    src.connect(analyser);
    freq = new Float32Array(analyser.frequencyBinCount);
    wave = new Float32Array(analyser.fftSize);
    prevMag = new Float32Array(analyser.frequencyBinCount);
    micOn = true; e.target.classList.add('on'); e.target.textContent = 'MIC ON';
  } catch { e.target.textContent = 'MIC DENIED'; }
});
function micFeatures() {
  analyser.getFloatTimeDomainData(wave);
  analyser.getFloatFrequencyData(freq);
  let rms = 0;
  for (let i = 0; i < wave.length; i++) rms += wave[i] * wave[i];
  rms = Math.sqrt(rms / wave.length);
  let num = 0, den = 0, flux = 0;
  for (let i = 0; i < freq.length; i++) {
    const m = Math.pow(10, freq[i] / 20);
    num += i * m; den += m;
    const dd = m - prevMag[i];
    if (dd > 0) flux += dd;
    prevMag[i] = m;
  }
  const centroid = den > 0 ? num / den / freq.length : 0;
  state.target.energy = Math.min(1, rms * 9);
  state.target.bright = Math.min(1, centroid * 3.2);
  if (flux > 0.55) state.onset = 1;
}

const BPM = 120, BARS = 8;
const barEl = document.getElementById('bar');
const t0 = performance.now();

function frame(now) {
  const t = (now - t0) / 1000;
  mouseAge += 16;

  if (micOn && analyser) micFeatures();
  else if (mouseAge > 4000) {
    state.target.energy = .26 + .16 * Math.sin(t * .21) + .08 * Math.sin(t * .067);
    state.target.bright = .40 + .24 * Math.sin(t * .113 + 2.0);
    if (Math.random() < 0.003) state.onset = Math.max(state.onset, .6);
  }

  state.energy += (state.target.energy - state.energy) * .05;
  state.bright += (state.target.bright - state.bright) * .05;
  state.onset *= .94;
  // heat: the switch, plus sustained loudness simmers it open on its own
  const heatTarget = Math.max(recOn ? 1 : 0, Math.max(0, state.energy - 0.8) * 2.0);
  state.heat += (heatTarget - state.heat) * .04;

  const beats = t * BPM / 60;
  const barPhase = (beats / 4 % BARS) / BARS;
  barEl.textContent = `BAR ${Math.floor(beats / 4 % BARS) + 1}.${Math.floor(beats % 4) + 1}`;

  gl.uniform2f(U.u_res, cv.width, cv.height);
  gl.uniform1f(U.u_time, Math.floor(t * 12) / 12);   // on twos
  gl.uniform1f(U.u_energy, state.energy);
  gl.uniform1f(U.u_bright, state.bright);
  gl.uniform1f(U.u_onset, state.onset);
  gl.uniform1f(U.u_heat, state.heat);
  gl.uniform1f(U.u_barPhase, barPhase);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
