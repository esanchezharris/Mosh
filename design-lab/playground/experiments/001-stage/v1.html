<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>001 · HEARTH — the stage centerpiece</title>
<style>
  /* tokens (canonical: design-lab/tokens/moshi.css) */
  :root {
    --ink: #0B0B0B; --lime: #CCFF23; --lime-glow: #D9FF4C;
    --bone: #F6F2EB; --mist: #E5E5E1;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --font-display: "Archivo Black", "Helvetica Neue", -apple-system, "Arial Black", sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .chrome { position: fixed; font-family: var(--font-mono); color: var(--bone);
            user-select: none; -webkit-user-select: none; }
  #title { top: 18px; left: 20px; font-size: 11px; letter-spacing: .14em; opacity: .55; }
  #title b { font-family: var(--font-display); font-weight: 900; letter-spacing: .06em;
             color: var(--lime); font-size: 12px; }
  #bar { top: 18px; right: 20px; font-size: 11px; letter-spacing: .1em; opacity: .65;
         font-variant-numeric: tabular-nums; }
  #hint { bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 10px;
          letter-spacing: .12em; opacity: .35; text-align: center; }
  #controls { bottom: 14px; right: 16px; display: flex; gap: 8px; align-items: center; }
  #mic { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em;
         background: transparent; color: var(--bone); border: 1px solid rgba(246,242,235,.25);
         border-radius: 999px; padding: 5px 12px; cursor: pointer; opacity: .7; }
  #mic:hover { opacity: 1; border-color: var(--lime); color: var(--lime); }
  #mic.on { color: var(--ink); background: var(--lime); border-color: var(--lime);
            opacity: 1; box-shadow: 0 0 24px rgba(217,255,76,.35); }
  #err { top: 50%; left: 50%; transform: translate(-50%,-50%); color: var(--lime);
         font-size: 12px; display: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="chrome" id="title"><b>HEARTH</b>&ensp;001 · the stage centerpiece</div>
<div class="chrome tc" id="bar">BAR 1.1</div>
<div class="chrome" id="hint">move = brightness / energy · click = hit · or give it your mic</div>
<div class="chrome" id="controls"><button id="mic">MIC OFF</button></div>
<div class="chrome" id="err">webgl unavailable</div>

<script>
// HEARTH — what Moshi dreams about while you think.
// Domain-warped fbm "ink body" with bioluminescent lime veins. Slow, alive,
// autonomous; leans toward the music when given energy. The 8-bar position
// reads ambiently as a luminous front sweeping the field left to right.
//
// Params (the future engine feed; today: autopilot + mouse + optional mic):
//   energy    0..1  loudness (RMS)        -> vein heat, field speed
//   bright    0..1  spectral centroid     -> vein color lime->glow, vein density
//   onset     0..1  transient (decaying)  -> expanding pressure ring
//   barPhase  0..1  position in 8 bars    -> sweeping lume front

const FRAG = `
precision highp float;
uniform vec2  u_res;
uniform float u_time;
uniform float u_energy;
uniform float u_bright;
uniform float u_onset;
uniform float u_barPhase;

const vec3 INK  = vec3(0.0431);
const vec3 LIME = vec3(0.800, 1.000, 0.137);
const vec3 GLOW = vec3(0.851, 1.000, 0.298);

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) {
    v += a * vnoise(p);
    p = p * 2.03 + vec2(7.31, 3.17);
    a *= 0.5;
  }
  return v;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);
  float t = u_time * (0.035 + 0.12 * u_energy);

  // breathe: the whole field inhales ~ every 7s, deeper when hot
  float breath = 0.5 + 0.5 * sin(u_time * 0.9);
  float inhale = 1.0 + 0.035 * breath * (0.4 + 0.6 * u_energy);

  // double domain warp -> the ink body
  vec2 p = uv * 2.1 * inhale;
  vec2 q = vec2(fbm(p + t * 0.9), fbm(p - t * 0.6 + 5.2));
  vec2 r = vec2(fbm(p + 1.9 * q + vec2(1.7, 9.2) + t * 0.35),
                fbm(p + 1.9 * q + vec2(8.3, 2.8) - t * 0.27));
  float f = fbm(p + 2.1 * r);

  // veins: ribbons where the field crosses iso levels; density rises w/ bright
  float vein = 0.0;
  float w = mix(0.012, 0.030, u_bright);
  vein += smoothstep(w, 0.0, abs(f - 0.38));
  vein += smoothstep(w, 0.0, abs(f - 0.52)) * 0.85;
  vein += smoothstep(w, 0.0, abs(f - 0.66)) * (0.35 + 0.65 * u_bright);
  vein *= 0.55 + 0.45 * fbm(p * 3.0 + r);      // broken, organic, not contour-plot

  // onset: a pressure ring expanding from the heart
  float ring = 0.0;
  if (u_onset > 0.003) {
    float rad = (1.0 - u_onset) * 1.35;
    ring = exp(-pow((length(uv) - rad) * 14.0, 2.0)) * u_onset;
  }

  // bar front: a soft lume wave crossing the stage once per 8 bars
  float fx = u_barPhase * 2.6 - 1.3;
  float front = exp(-pow((uv.x - fx) * 5.5, 2.0)) * 0.5;

  // composite
  vec3 col = INK * (0.55 + 0.85 * f * f);                       // matte body
  vec3 veinCol = mix(LIME, GLOW, u_bright);
  float heat = 0.22 + 0.78 * u_energy;
  col += vein * veinCol * heat * 0.85;
  col += ring * GLOW * 0.8;
  col += front * veinCol * (0.06 + 0.10 * heat);
  col += smoothstep(0.75, 1.0, vein * heat) * GLOW * 0.35;      // hot cores bloom

  // vignette into the void
  float vig = smoothstep(1.25, 0.45, length(uv));
  col = mix(vec3(0.0235), col, vig);

  gl_FragColor = vec4(col, 1.0);
}`;

const VERT = `attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;

const cv = document.getElementById('gl');
const gl = cv.getContext('webgl', { antialias: false, alpha: false });
if (!gl) { document.getElementById('err').style.display = 'block'; throw new Error('no webgl'); }

function sh(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = {};
for (const n of ['u_res','u_time','u_energy','u_bright','u_onset','u_barPhase'])
  U[n] = gl.getUniformLocation(prog, n);

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  cv.width = Math.floor(innerWidth * dpr);
  cv.height = Math.floor(innerHeight * dpr);
  gl.viewport(0, 0, cv.width, cv.height);
}
addEventListener('resize', resize); resize();

// ---------- parameter sources: autopilot < mouse < mic ----------
const state = { energy: .3, bright: .4, onset: 0, target: { energy: .3, bright: .4 } };
let mouseAge = 1e9, micOn = false;

addEventListener('mousemove', e => {
  state.target.bright = e.clientX / innerWidth;
  state.target.energy = 1 - e.clientY / innerHeight;
  mouseAge = 0;
});
addEventListener('pointerdown', () => { state.onset = 1; mouseAge = 0; });

// optional mic: RMS -> energy, centroid -> bright, flux -> onset
let analyser = null, freq = null, wave = null, prevMag = null;
document.getElementById('mic').addEventListener('click', async (e) => {
  if (micOn) { micOn = false; e.target.classList.remove('on'); e.target.textContent = 'MIC OFF'; return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const src = ac.createMediaStreamSource(stream);
    analyser = ac.createAnalyser(); analyser.fftSize = 1024;
    src.connect(analyser);
    freq = new Float32Array(analyser.frequencyBinCount);
    wave = new Float32Array(analyser.fftSize);
    prevMag = new Float32Array(analyser.frequencyBinCount);
    micOn = true; e.target.classList.add('on'); e.target.textContent = 'MIC ON';
  } catch { e.target.textContent = 'MIC DENIED'; }
});

function micFeatures() {
  analyser.getFloatTimeDomainData(wave);
  analyser.getFloatFrequencyData(freq);
  let rms = 0;
  for (let i = 0; i < wave.length; i++) rms += wave[i] * wave[i];
  rms = Math.sqrt(rms / wave.length);
  let num = 0, den = 0, flux = 0;
  for (let i = 0; i < freq.length; i++) {
    const m = Math.pow(10, freq[i] / 20);
    num += i * m; den += m;
    const d = m - prevMag[i];
    if (d > 0) flux += d;
    prevMag[i] = m;
  }
  const centroid = den > 0 ? num / den / freq.length : 0;
  state.target.energy = Math.min(1, rms * 9);
  state.target.bright = Math.min(1, centroid * 3.2);
  if (flux > 0.55) state.onset = 1;
}

// fake 8-bar transport @ 120bpm for the position front
const BPM = 120, BARS = 8;
const barEl = document.getElementById('bar');
const t0 = performance.now();

function frame(now) {
  const t = (now - t0) / 1000;
  mouseAge += 16;

  if (micOn && analyser) micFeatures();
  else if (mouseAge > 4000) {
    // autopilot: the hearth dreams on its own
    state.target.energy = .28 + .18 * Math.sin(t * .23) + .08 * Math.sin(t * .071);
    state.target.bright = .42 + .25 * Math.sin(t * .117 + 2.0);
    if (Math.random() < 0.004) state.onset = Math.max(state.onset, .7);
  }

  state.energy += (state.target.energy - state.energy) * .06;
  state.bright += (state.target.bright - state.bright) * .06;
  state.onset *= .955;

  const beats = t * BPM / 60;
  const barPhase = (beats / 4 % BARS) / BARS;
  const bar = Math.floor(beats / 4 % BARS) + 1;
  const beat = Math.floor(beats % 4) + 1;
  barEl.textContent = `BAR ${bar}.${beat}`;

  gl.uniform2f(U.u_res, cv.width, cv.height);
  gl.uniform1f(U.u_time, t);
  gl.uniform1f(U.u_energy, state.energy);
  gl.uniform1f(U.u_bright, state.bright);
  gl.uniform1f(U.u_onset, state.onset);
  gl.uniform1f(U.u_barPhase, barPhase);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
