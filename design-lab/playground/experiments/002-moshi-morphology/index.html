<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>002 · SPECIMEN — Moshi morphology</title>
<style>
  :root {
    --ink: #0B0B0B; --lime: #CCFF23; --lime-glow: #D9FF4C;
    --bone: #F6F2EB; --mist: #E5E5E1;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --font-display: "Archivo Black", "Helvetica Neue", -apple-system, "Arial Black", sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .chrome { position: fixed; font-family: var(--font-mono); color: var(--bone);
            user-select: none; -webkit-user-select: none; }
  #title { top: 18px; left: 20px; font-size: 11px; letter-spacing: .14em; opacity: .55; }
  #title b { font-family: var(--font-display); font-weight: 900; color: var(--lime); font-size: 12px; }
  #bar { top: 18px; right: 20px; font-size: 11px; opacity: .65; font-variant-numeric: tabular-nums; }

  /* the eyes live OVER the render — they are DOM so they can act */
  #eyes { top: 38%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 84px;
          font-family: var(--font-display); font-weight: 900; font-size: 46px;
          color: var(--bone); pointer-events: none;
          transition: color .5s, text-shadow .5s, gap .5s; }
  #eyes span { display: inline-block; transition: transform .45s cubic-bezier(.34,1.56,.64,1); }
  #eyes.listening span { animation: bob 2.4s ease-in-out infinite; }
  #eyes.armed { gap: 92px; }
  #eyes.armed span { transform: scaleY(1.35); }
  #eyes.recording { color: var(--lime); text-shadow: 0 0 18px rgba(217,255,76,.7); }
  #eyes.recording span { animation: pulse 1.1s ease-in-out infinite; }
  #eyes.clipped { color: var(--lime-glow); }
  #eyes.clipped span { animation: shake .14s linear infinite; }
  #eyes.feral { color: var(--lime); gap: 64px; }
  #eyes.feral span:first-child { transform: rotate(24deg) scaleY(1.2); }
  #eyes.feral span:last-child  { transform: rotate(-24deg) scaleY(1.2); }
  @keyframes bob   { 0%,100% { translate: 0 0; } 50% { translate: 0 -6px; } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  @keyframes shake { 0% { translate: -3px 0; } 50% { translate: 3px 1px; } 100% { translate: -3px 0; } }

  #deck { bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px;
          align-items: center; flex-wrap: wrap; justify-content: center; }
  #deck button { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em;
          background: transparent; color: var(--bone); border: 1px solid rgba(246,242,235,.22);
          border-radius: 999px; padding: 5px 12px; cursor: pointer; opacity: .7; }
  #deck button:hover { opacity: 1; border-color: var(--lime); }
  #deck button.on { color: var(--ink); background: var(--lime); border-color: var(--lime);
          opacity: 1; box-shadow: 0 0 20px rgba(217,255,76,.35); }
  #spectrum { display: flex; align-items: center; gap: 8px; margin-left: 14px;
          font-size: 9px; letter-spacing: .12em; opacity: .6; }
  #spectrum input { accent-color: var(--lime); width: 130px; }
  #caption { bottom: 64px; left: 50%; transform: translateX(-50%); font-size: 10px;
          letter-spacing: .12em; opacity: .35; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="chrome" id="eyes"><span>&gt;</span><span>&lt;</span></div>
<div class="chrome" id="title"><b>SPECIMEN</b>&ensp;002 · morphology — the body IS the record light</div>
<div class="chrome tc" id="bar">BAR 1.1</div>
<div class="chrome" id="caption">the lume circling the membrane = where you are in the 8 bars</div>
<div class="chrome" id="deck">
  <button data-s="calm" class="on">CALM</button>
  <button data-s="listening">LISTENING</button>
  <button data-s="armed">ARMED</button>
  <button data-s="recording">RECORDING</button>
  <button data-s="clipped">CLIPPED</button>
  <button data-s="feral">FERAL</button>
  <span id="spectrum">SPECTRUM <input id="arousal" type="range" min="0" max="100" value="6"></span>
</div>

<script>
// SPECIMEN — the creature as instrument cluster.
// Raymarched SDF: smooth-min of five drifting lobes, displaced by 3D noise whose
// amplitude/frequency rise with arousal (the Color-Rack axes will drive this).
// Recording is HEAT: an ember glowing through the matte skin. Song position is a
// lume that circles the membrane once per 8 bars. Clipping is a body-wide tremor.

const FRAG = `
precision highp float;
uniform vec2  u_res;
uniform float u_time;
uniform float u_arousal;   // 0 calm .. 1 feral
uniform float u_heat;      // recording ember
uniform float u_clip;      // distress tremor
uniform float u_mouth;     // mouth aperture
uniform float u_barPhase;  // 0..1 in 8 bars

const vec3 INK  = vec3(0.045);
const vec3 LIME = vec3(0.800, 1.000, 0.137);
const vec3 GLOW = vec3(0.851, 1.000, 0.298);

float hash31(vec3 p) {
  p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3));
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}
float noise3(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  vec3 u = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(mix(hash31(i),                  hash31(i + vec3(1,0,0)), u.x),
        mix(hash31(i + vec3(0,1,0)),    hash31(i + vec3(1,1,0)), u.x), u.y),
    mix(mix(hash31(i + vec3(0,0,1)),    hash31(i + vec3(1,0,1)), u.x),
        mix(hash31(i + vec3(0,1,1)),    hash31(i + vec3(1,1,1)), u.x), u.y), u.z);
}
float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}

float map(vec3 p) {
  float t = u_time;
  vec3 q = p;
  q.y *= 1.0 + 0.05 * sin(t * 0.9);                  // breathing squash
  float d = length(q) - 0.60;
  d = smin(d, length(q - vec3( 0.40*sin(t*0.43+1.0), 0.33*cos(t*0.37),      0.18*sin(t*0.51))) - 0.30, 0.30);
  d = smin(d, length(q - vec3(-0.44*sin(t*0.31),     0.28*cos(t*0.41+2.0), -0.15*cos(t*0.29))) - 0.27, 0.30);
  d = smin(d, length(q - vec3( 0.24*cos(t*0.27+4.0),-0.40*sin(t*0.33),      0.20*sin(t*0.40))) - 0.24, 0.30);
  d = smin(d, length(q - vec3(-0.20,                 0.43*sin(t*0.23+1.7),  0.10))             - 0.22, 0.30);
  float amp   = mix(0.012, 0.150, pow(u_arousal, 1.4));
  float freq  = mix(2.5, 8.5, u_arousal);
  float speed = mix(0.35, 2.4, u_arousal);
  d -= amp * (noise3(q * freq + vec3(0.0, 0.0, t * speed)) - 0.5) * 2.0;
  d -= u_clip * 0.035 * (noise3(q * 18.0 + t * 9.0) - 0.5) * 2.0;
  return d;
}
vec3 normalAt(vec3 p) {
  const vec2 e = vec2(0.0015, -0.0015);
  return normalize(e.xyy * map(p + e.xyy) + e.yyx * map(p + e.yyx)
                 + e.yxy * map(p + e.yxy) + e.xxx * map(p + e.xxx));
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);
  vec3 ro = vec3(0.0, 0.0, 2.35);
  vec3 rd = normalize(vec3(uv, -1.45));

  float t = 0.0; float d; vec3 hp;
  bool hit = false;
  for (int i = 0; i < 80; i++) {
    hp = ro + rd * t;
    d = map(hp);
    if (d < 0.0012) { hit = true; break; }
    t += d * 0.85;
    if (t > 5.0) break;
  }

  // the void, with the faintest pool of lume under the creature
  vec3 col = vec3(0.0235);
  col += LIME * 0.018 * exp(-pow((uv.y + 0.62) * 4.0, 2.0)) * (0.4 + 0.6 * u_heat);

  if (hit) {
    vec3 n = normalAt(hp);
    float fres = pow(1.0 - max(dot(n, -rd), 0.0), 2.5);

    col = INK * (0.55 + 0.45 * max(dot(n, normalize(vec3(0.4, 0.8, 0.5))), 0.0));
    col += LIME * fres * (0.16 + 0.55 * u_heat + 0.22 * u_arousal);

    // ember: subsurface heat, pulsing ~1.1 Hz while recording
    float ember = u_heat * (0.45 * fres + 0.55 * exp(-3.2 * length(hp)))
                * (0.75 + 0.25 * sin(u_time * 7.0));
    col += GLOW * ember * 0.9;

    // the mouth: glossy acid-lime aperture, front-lower
    vec3 mdir = normalize(vec3(0.0, -0.34, 1.0));
    float ang = acos(clamp(dot(normalize(hp), mdir), -1.0, 1.0));
    float mr = mix(0.18, 0.46, u_mouth);
    float mouth = smoothstep(mr, mr - 0.10, ang);
    float spec = pow(max(dot(reflect(rd, n), normalize(vec3(0.3, 0.9, 0.4))), 0.0), 28.0);
    col = mix(col, LIME * (0.72 + 0.45 * u_heat) + vec3(spec), mouth);

    // song position: lume circling the membrane once per 8 bars
    float az = atan(hp.x, hp.z);
    float ph = u_barPhase * 6.2831853 - 3.14159265;
    float dAz = abs(atan(sin(az - ph), cos(az - ph)));
    col += LIME * exp(-pow(dAz * 2.2, 2.0)) * (0.10 + 0.28 * u_heat) * (1.0 - mouth);

    // clip distress: hard flicker
    col *= 1.0 - u_clip * 0.22 * step(0.5, fract(u_time * 13.0));
  }

  float vig = smoothstep(1.35, 0.5, length(uv));
  col = mix(vec3(0.0195), col, vig);
  gl_FragColor = vec4(col, 1.0);
}`;

const VERT = `attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;

const cv = document.getElementById('gl');
const gl = cv.getContext('webgl', { antialias: false, alpha: false });
function sh(ty, src) {
  const s = gl.createShader(ty);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const al = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(al);
gl.vertexAttribPointer(al, 2, gl.FLOAT, false, 0, 0);
const U = {};
for (const n of ['u_res','u_time','u_arousal','u_heat','u_clip','u_mouth','u_barPhase'])
  U[n] = gl.getUniformLocation(prog, n);

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 1.25);   // raymarch: keep it cheap
  cv.width = Math.floor(innerWidth * dpr);
  cv.height = Math.floor(innerHeight * dpr);
  gl.viewport(0, 0, cv.width, cv.height);
}
addEventListener('resize', resize); resize();

// ---------- the spectrum: calm -> feral ----------
const STATES = {
  calm:      { a: 0.06, heat: 0.00, clip: 0, mouth: 0.26 },
  listening: { a: 0.22, heat: 0.10, clip: 0, mouth: 0.36 },
  armed:     { a: 0.40, heat: 0.34, clip: 0, mouth: 0.30 },
  recording: { a: 0.58, heat: 1.00, clip: 0, mouth: 0.55 },
  clipped:   { a: 0.75, heat: 0.80, clip: 1, mouth: 0.72 },
  feral:     { a: 1.00, heat: 0.55, clip: 0, mouth: 0.88 },
};
const EYES = { calm: ['>','<'], listening: ['>','<'], armed: ['>','<'],
               recording: ['>','<'], clipped: ['×','×'], feral: ['>','<'] };

const cur = { a: 0.06, heat: 0, clip: 0, mouth: 0.26 };
let target = { ...STATES.calm };
const eyes = document.getElementById('eyes');
const slider = document.getElementById('arousal');

function setState(name) {
  target = { ...STATES[name] };
  slider.value = Math.round(target.a * 100);
  document.querySelectorAll('#deck button').forEach(b =>
    b.classList.toggle('on', b.dataset.s === name));
  eyes.className = 'chrome ' + name;
  const [l, r] = EYES[name];
  eyes.children[0].textContent = l;
  eyes.children[1].textContent = r;
}
document.querySelectorAll('#deck button').forEach(b =>
  b.addEventListener('click', () => setState(b.dataset.s)));
slider.addEventListener('input', () => { target.a = slider.value / 100; });
eyes.className = 'chrome calm';

const BPM = 120, BARS = 8;
const barEl = document.getElementById('bar');
const t0 = performance.now();

function frame(now) {
  const t = (now - t0) / 1000;
  for (const k of ['heat', 'clip', 'mouth']) cur[k] += (target[k] - cur[k]) * 0.05;
  cur.a += (target.a - cur.a) * 0.05;

  const beats = t * BPM / 60;
  const barPhase = (beats / 4 % BARS) / BARS;
  barEl.textContent = `BAR ${Math.floor(beats / 4 % BARS) + 1}.${Math.floor(beats % 4) + 1}`;

  gl.uniform2f(U.u_res, cv.width, cv.height);
  gl.uniform1f(U.u_time, t);
  gl.uniform1f(U.u_arousal, cur.a);
  gl.uniform1f(U.u_heat, cur.heat);
  gl.uniform1f(U.u_clip, cur.clip);
  gl.uniform1f(U.u_mouth, cur.mouth);
  gl.uniform1f(U.u_barPhase, barPhase);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
