<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>003 · PERIPHERY — the vision filter</title>
<style>
  :root {
    --ink: #0B0B0B; --lime: #CCFF23; --lime-glow: #D9FF4C;
    --bone: #F6F2EB; --mist: #E5E5E1;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --font-display: "Archivo Black", "Helvetica Neue", -apple-system, "Arial Black", sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .chrome { position: fixed; font-family: var(--font-mono); color: var(--bone);
            user-select: none; -webkit-user-select: none; }
  #title { top: 26px; left: 30px; font-size: 11px; letter-spacing: .14em; opacity: .5; }
  #title b { font-family: var(--font-display); font-weight: 900; color: var(--lime); font-size: 12px; }
  #center { top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center;
            font-size: 11px; letter-spacing: .22em; color: var(--mist); opacity: .14; }
  #pos { bottom: 26px; left: 30px; font-size: 11px; opacity: .6; font-variant-numeric: tabular-nums; }
  #pos b { color: var(--lime); font-weight: 400; }
  #rec { top: 26px; right: 30px; font-size: 11px; letter-spacing: .14em; cursor: pointer;
         opacity: .55; border: 1px solid rgba(246,242,235,.2); border-radius: 999px; padding: 5px 12px; }
  #rec.on { color: var(--ink); background: var(--lime); border-color: var(--lime); opacity: 1;
            box-shadow: 0 0 26px rgba(217,255,76,.5); animation: rp 1.1s ease-in-out infinite; }
  @keyframes rp { 50% { box-shadow: 0 0 44px rgba(217,255,76,.8); } }

  /* the whisper line — how you talk to the thing in your head */
  #ask { bottom: 64px; left: 50%; transform: translateX(-50%); width: min(440px, 70vw); }
  #ask input { width: 100%; background: transparent; border: 0; outline: 0;
        border-bottom: 1px solid rgba(246,242,235,.18); padding: 8px 2px; text-align: center;
        font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; color: var(--bone); }
  #ask input::placeholder { color: rgba(246,242,235,.28); }
  #ask input:focus { border-bottom-color: rgba(204,255,35,.6); }

  /* the ledger — what it did while you weren't looking */
  #ledger { top: 70px; right: 30px; display: flex; flex-direction: column; gap: 8px;
            align-items: flex-end; }
  .deed { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em;
          color: var(--bone); background: rgba(11,11,11,.7);
          border: 1px solid rgba(204,255,35,.35); border-radius: 999px;
          padding: 6px 12px; display: flex; gap: 10px; align-items: center;
          box-shadow: 0 0 14px rgba(204,255,35,.12);
          animation: dein .5s cubic-bezier(.34,1.56,.64,1); transition: opacity 1.2s, transform 1.2s; }
  .deed em { font-style: normal; color: var(--lime); }
  .deed button { background: none; border: 0; color: rgba(246,242,235,.4); cursor: pointer;
          font-family: var(--font-mono); font-size: 10px; padding: 0; }
  .deed button:hover { color: var(--lime); }
  .deed.bye { opacity: 0; transform: translateY(-18px); }
  @keyframes dein { from { opacity: 0; transform: translateX(30px) scale(.8); } }

  /* PS2 CRUNCH (house style v1) */
  #crt2 { position: fixed; inset: 0; z-index: 90; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); }
  canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<div id="crt2"></div>
<canvas id="gl"></canvas>
<div class="chrome" id="title"><b>PERIPHERY</b>&ensp;003 · the studio at the corner of your eye</div>
<div class="chrome" id="center">YOUR WORLD STAYS HERE — GAME · GUITAR · DISHES</div>
<div class="chrome tc" id="pos"><b id="sect">VERSE 1</b>&ensp;<span id="bar">BAR 1.1</span></div>
<div class="chrome" id="rec">● REC&ensp;<span style="opacity:.6">(R)</span></div>
<div class="chrome" id="ask"><input id="cmd" placeholder="tell moshi — “punch me in after the hook”" autocomplete="off" /></div>
<div class="chrome" id="ledger"></div>

<script>
// PERIPHERY — Moshi never makes you look AT it. The studio is a membrane creeping
// in from the edges of vision; the center of the screen belongs to your life.
//   where am I?    a lume bead orbits the screen border — one lap = the song;
//                  8 ticks = sections.
//   am I recording? the entire periphery runs hot and breathes at 1.1 Hz.
//   what did it do? deeds surface as glyph chips top-right, then dissolve. × undoes.

const FRAG = `
precision highp float;
uniform vec2  u_res;
uniform float u_time;
uniform float u_rec;       // 0..1, the whole rim runs hot
uniform float u_pos;       // 0..1 song position -> bead on the perimeter
uniform float u_ask;       // flares briefly when you speak to it

const vec3 INK  = vec3(0.0431);
const vec3 LIME = vec3(0.800, 1.000, 0.137);
const vec3 GLOW = vec3(0.851, 1.000, 0.298);

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x),
             mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 4; i++) { v += a * vnoise(p); p = p * 2.03 + 7.31; a *= 0.5; }
  return v;
}
// clockwise perimeter parameter (0 at top-left), quarter per edge
float perim(vec2 st) {
  float dT = 1.0 - st.y, dB = st.y, dL = st.x, dR = 1.0 - st.x;
  float m = min(min(dT, dB), min(dL, dR));
  if (m == dT) return 0.00 + st.x * 0.25;
  if (m == dR) return 0.25 + (1.0 - st.y) * 0.25;
  if (m == dB) return 0.50 + (1.0 - st.x) * 0.25;
  return 0.75 + st.y * 0.25;
}

void main() {
  vec2 st = gl_FragCoord.xy / u_res;
  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);
  float t = u_time;

  // distance to the nearest screen edge (0 at the edge)
  float dEdge = min(min(st.x, 1.0 - st.x), min(st.y, 1.0 - st.y));

  // the membrane: how deep the creature reaches into your sight
  float breathe = 0.5 + 0.5 * sin(t * (0.8 + 6.2 * u_rec));
  float reach = 0.085 + 0.020 * breathe + u_rec * (0.055 + 0.02 * breathe) + u_ask * 0.05;
  reach += (fbm(uv * 3.0 + t * 0.12) - 0.5) * 0.07;     // organic, uneven boundary
  float m = smoothstep(reach, reach - 0.085, dEdge);

  // ink flesh + lime veins inside the membrane
  float f = fbm(uv * 5.0 + vec2(t * 0.06, -t * 0.04));
  float vein = smoothstep(0.022, 0.0, abs(f - 0.45))
             + smoothstep(0.022, 0.0, abs(f - 0.62)) * 0.7;
  vec3 flesh = INK * 1.5 + LIME * vein * (0.18 + 0.65 * u_rec + 0.3 * u_ask);

  vec3 col = vec3(0.0275);                               // the empty middle: near-void
  col = mix(col, flesh, m);

  // the lume bead: one lap of the border per song
  float s = perim(st);
  float dS = abs(s - u_pos); dS = min(dS, 1.0 - dS);
  float nearEdge = smoothstep(0.16, 0.0, dEdge);
  col += mix(LIME, GLOW, u_rec) * exp(-pow(dS * 70.0, 2.0)) * nearEdge * (0.9 + 0.6 * u_rec);
  col += LIME * exp(-pow(dS * 14.0, 2.0)) * nearEdge * 0.10; // comet tail

  // 8 section ticks on the border
  for (int i = 0; i < 8; i++) {
    float ts = float(i) / 8.0;
    float dT2 = abs(s - ts); dT2 = min(dT2, 1.0 - dT2);
    col += LIME * exp(-pow(dT2 * 320.0, 2.0)) * nearEdge * 0.22;
  }

  gl_FragColor = vec4(col, 1.0);
}`;

const VERT = `attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl', { antialias: false, alpha: false });
function sh(ty, src) {
  const s = gl.createShader(ty);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const al = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(al);
gl.vertexAttribPointer(al, 2, gl.FLOAT, false, 0, 0);
const U = {};
for (const n of ['u_res','u_time','u_rec','u_pos','u_ask']) U[n] = gl.getUniformLocation(prog, n);
function resize() {
  const dpr = 0.25;   // PS2 crunch
  cv.width = Math.floor(innerWidth * dpr);
  cv.height = Math.floor(innerHeight * dpr);
  gl.viewport(0, 0, cv.width, cv.height);
}
addEventListener('resize', resize); resize();

// ---------- transport: a 2-minute song, 8 sections ----------
const SECTIONS = ['INTRO','VERSE 1','HOOK','VERSE 2','HOOK','BRIDGE','HOOK','OUT'];
const SONG_S = 120, BPM = 120;
let rec = 0, recOn = false, ask = 0;
const recEl = document.getElementById('rec');
function toggleRec() { recOn = !recOn; recEl.classList.toggle('on', recOn); }
recEl.addEventListener('click', toggleRec);
addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'r' && document.activeElement !== cmd) toggleRec();
});

// ---------- the ledger of deeds ----------
const ledger = document.getElementById('ledger');
const DEMO = ['kept take 4', 'tucked the delay −2 dB', 'looped verse 2', 'punched in after the hook',
              'tuned the harmony, subtle', 'muted the click on the bounce'];
function deed(text) {
  const d = document.createElement('div');
  d.className = 'deed';
  d.innerHTML = `<em>✓</em> ${text} <button title="undo">×</button>`;
  d.querySelector('button').addEventListener('click', () => {
    d.firstElementChild.textContent = '↺';
    d.childNodes[1].textContent = ` undid: ${text} `;
    setTimeout(() => d.classList.add('bye'), 900);
    setTimeout(() => d.remove(), 2200);
  });
  ledger.prepend(d);
  while (ledger.children.length > 4) ledger.lastElementChild.remove();
  setTimeout(() => { d.classList.add('bye'); setTimeout(() => d.remove(), 1300); }, 9000);
}
setInterval(() => { if (Math.random() < .5) deed(DEMO[Math.floor(Math.random() * DEMO.length)]); }, 8000);

const cmd = document.getElementById('cmd');
cmd.addEventListener('keydown', e => {
  if (e.key === 'Enter' && cmd.value.trim()) {
    ask = 1;
    deed(cmd.value.trim());
    cmd.value = '';
    cmd.blur();
  }
});

const barEl = document.getElementById('bar'), sectEl = document.getElementById('sect');
const t0 = performance.now();
function frame(now) {
  const t = (now - t0) / 1000;
  const pos = (t % SONG_S) / SONG_S;
  rec += ((recOn ? 1 : 0) - rec) * 0.07;
  ask *= 0.97;

  const beats = t * BPM / 60;
  barEl.textContent = `BAR ${Math.floor(beats / 4) % 64 + 1}.${Math.floor(beats % 4) + 1}`;
  sectEl.textContent = SECTIONS[Math.floor(pos * 8)];

  gl.uniform2f(U.u_res, cv.width, cv.height);
  gl.uniform1f(U.u_time, t);
  gl.uniform1f(U.u_rec, rec);
  gl.uniform1f(U.u_pos, pos);
  gl.uniform1f(U.u_ask, ask);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
