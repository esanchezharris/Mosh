<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>004 · THE GULLET — creature as timeline</title>
<style>
  :root {
    --ink: #0B0B0B; --lime: #CCFF23; --lime-glow: #D9FF4C;
    --bone: #F6F2EB; --mist: #E5E5E1;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --font-display: "Archivo Black", "Helvetica Neue", -apple-system, "Arial Black", sans-serif;
  }
  html, body { margin: 0; height: 100%; background: #060606; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .chrome { position: fixed; font-family: var(--font-mono); color: var(--bone);
            user-select: none; -webkit-user-select: none; }
  #title { top: 18px; left: 20px; font-size: 11px; letter-spacing: .14em; opacity: .55; }
  #title b { font-family: var(--font-display); font-weight: 900; color: var(--lime); font-size: 12px; }
  #cap { top: 36px; left: 20px; font-size: 10px; letter-spacing: .1em; opacity: .3; }
  #deck { bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
  #deck button { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em;
        background: transparent; color: var(--bone); border: 1px solid rgba(246,242,235,.22);
        border-radius: 999px; padding: 5px 14px; cursor: pointer; opacity: .7; }
  #deck button:hover { opacity: 1; border-color: var(--lime); }
  #deck button.on { color: var(--ink); background: var(--lime); border-color: var(--lime);
        opacity: 1; box-shadow: 0 0 20px rgba(217,255,76,.4); }
  #tip { display: none; font-size: 10px; letter-spacing: .08em; color: var(--ink);
        background: var(--lime); border-radius: 999px; padding: 4px 10px; pointer-events: none;
        box-shadow: 0 0 18px rgba(217,255,76,.45); }
  #toast { bottom: 64px; left: 50%; transform: translateX(-50%); font-size: 10.5px;
        letter-spacing: .1em; color: var(--lime); opacity: 0; transition: opacity .4s; }

  /* Y2K CONSOLE (house style v2): res-crunch only — scanlines were the wrong decade */
  canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="chrome" id="title"><b>THE GULLET</b>&ensp;004 · the song is something it's digesting</div>
<div class="chrome" id="cap">takes are swallowed · the pulse is the playhead · undo = it gives one back</div>
<div class="chrome" id="tip"></div>
<div class="chrome" id="toast"></div>
<div class="chrome" id="deck">
  <button id="play" class="on">PLAYING</button>
  <button id="rec">● RECORD</button>
  <button id="undo">↺ UNDO</button>
</div>

<script>
// THE GULLET — the timeline is not a strip of rectangles; it is Moshi's body
// stretched across your vision, and the song is inside it.
//   where am I?     the peristaltic bulge — you can see (and feel) the wave of
//                   digestion move left -> right through the sections.
//   am I recording? the mouth at the right end is open, glowing, swallowing the
//                   live signal as particles. takes appear as lumps under the skin.
//   undo?           it regurgitates. politely.

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const LIME = '#CCFF23', GLOW = '#D9FF4C', BONE = '#F6F2EB';

let W, H, dpr;
function resize() {
  dpr = 0.5;   // PS2 crunch
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

// 1-D value noise
function h1(i) { const s = Math.sin(i * 127.1) * 43758.5453; return s - Math.floor(s); }
function n1(x) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return h1(i) * (1 - u) + h1(i + 1) * u;
}

const SECTIONS = ['INTRO', 'VERSE 1', 'HOOK', 'VERSE 2', 'HOOK', 'BRIDGE', 'HOOK', 'OUT'];
const SONG_S = 64;                 // demo loop length
let playing = true, recOn = false, recAmt = 0;
let tPos = 0;                      // 0..1 through the song
let lumps = [                      // what it has swallowed so far
  { pos: .16, r: 13, name: 'take 1 · verse' },
  { pos: .30, r: 17, name: 'take 4 · hook (kept)' },
  { pos: .47, r: 12, name: 'guitar dub' },
  { pos: .56, r: 15, name: 'take 2 · hook' },
];
let particles = [], spat = [], sel = -1;

function bodyGeom() {
  const x0 = 90, x1 = W - 150, cy = H * 0.52, base = Math.min(78, H * 0.14);
  return { x0, x1, cy, base, len: x1 - x0 };
}
function radiusAt(x, t, g) {
  const u = (x - g.x0) / g.len;                       // 0..1 along the body
  let r = g.base * (1 + 0.10 * (n1(x * 0.012 + t * 0.4) - 0.5) * 2);
  // constrictions between sections — the body is segmented like a grub
  const seg = u * 8;
  const dSeg = Math.abs(seg - Math.round(seg));
  r *= 0.70 + 0.30 * Math.min(1, dSeg * 4.5);
  // peristaltic bulge = the playhead
  const dP = (u - tPos) * g.len;
  r += 26 * Math.exp(-(dP * dP) / (2 * 42 * 42)) * (playing ? 1 : 0.55);
  // end caps (right end stays open: the mouth)
  r *= Math.min(1, (x - g.x0) / 70);
  r *= Math.min(1, (g.x1 - x) / 50 * 0.25 + 0.75);
  return r;
}

function spawnTake() {
  lumps.push({ pos: tPos, r: 10 + Math.random() * 6, name: `take ${lumps.length + 1} · ${SECTIONS[Math.floor(tPos * 8)].toLowerCase()}`, fresh: 1 });
}

// ---- controls ----
const playB = document.getElementById('play'), recB = document.getElementById('rec'),
      undoB = document.getElementById('undo'), tip = document.getElementById('tip'),
      toast = document.getElementById('toast');
playB.addEventListener('click', () => {
  playing = !playing;
  playB.textContent = playing ? 'PLAYING' : 'PAUSED';
  playB.classList.toggle('on', playing);
});
recB.addEventListener('click', () => {
  recOn = !recOn;
  recB.classList.toggle('on', recOn);
  if (!recOn) spawnTake();                            // the swallow completes
});
function say(msg) {
  toast.textContent = msg;
  toast.style.opacity = .9;
  setTimeout(() => toast.style.opacity = 0, 2200);
}
undoB.addEventListener('click', () => {
  const l = lumps.pop();
  if (!l) return say('nothing left to give back');
  const g = bodyGeom();
  spat.push({ x: g.x0 + l.pos * g.len, y: g.cy, r: l.r, vx: 7, vy: -2.5, life: 1, name: l.name });
  say(`↺ regurgitated ${l.name}`);
});
cv.addEventListener('mousemove', e => {
  const g = bodyGeom();
  sel = -1;
  for (let i = 0; i < lumps.length; i++) {
    const lx = g.x0 + lumps[i].pos * g.len;
    if (Math.hypot(e.clientX - lx, e.clientY - g.cy) < lumps[i].r + 12) sel = i;
  }
  if (sel >= 0) {
    tip.style.display = 'block';
    tip.style.left = e.clientX + 14 + 'px';
    tip.style.top = e.clientY - 26 + 'px';
    tip.textContent = lumps[sel].name;
  } else tip.style.display = 'none';
});

const t0 = performance.now();
let last = t0;
function frame(now) {
  const t = (now - t0) / 1000, dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (playing) tPos = (tPos + dt / SONG_S) % 1;
  recAmt += ((recOn ? 1 : 0) - recAmt) * 0.08;
  const g = bodyGeom();

  ctx.clearRect(0, 0, W, H);

  // recording = the room itself runs hot at the edges
  if (recAmt > 0.01) {
    const vg = ctx.createRadialGradient(W/2, H/2, H * 0.35, W/2, H/2, H * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, `rgba(204,255,35,${0.05 * recAmt * (0.7 + 0.3 * Math.sin(t * 7))})`);
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  // ---- the body ----
  const step = 7;
  ctx.beginPath();
  for (let x = g.x0; x <= g.x1; x += step) {
    const r = radiusAt(x, t, g);
    const y = g.cy - r + Math.sin(x * 0.01 + t * 0.7) * 4;
    x === g.x0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  for (let x = g.x1; x >= g.x0; x -= step) {
    const r = radiusAt(x, t, g);
    ctx.lineTo(x, g.cy + r + Math.sin(x * 0.01 + t * 0.7) * 4);
  }
  ctx.closePath();
  ctx.fillStyle = '#101010';
  ctx.shadowColor = `rgba(204,255,35,${0.18 + 0.25 * recAmt})`;
  ctx.shadowBlur = 26;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = `rgba(204,255,35,${0.22 + 0.3 * recAmt})`;
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // section labels riding above the skin
  ctx.textAlign = 'center';
  for (let i = 0; i < 8; i++) {
    const u = (i + 0.5) / 8, x = g.x0 + u * g.len;
    const cur = Math.floor(tPos * 8) === i;
    ctx.font = `900 ${cur ? 13 : 11}px "Archivo Black","Helvetica Neue",sans-serif`;
    ctx.fillStyle = cur ? LIME : 'rgba(246,242,235,.30)';
    if (cur) { ctx.shadowColor = 'rgba(217,255,76,.6)'; ctx.shadowBlur = 12; }
    ctx.fillText(SECTIONS[i], x, g.cy - radiusAt(x, t, g) - 22);
    ctx.shadowBlur = 0;
  }

  // ---- what it has swallowed ----
  for (let i = 0; i < lumps.length; i++) {
    const l = lumps[i];
    if (l.fresh) l.fresh = Math.max(0, l.fresh - dt * 0.8);
    const x = g.x0 + l.pos * g.len;
    const glowAmt = (sel === i ? 1 : 0.45) + (l.fresh || 0) * 0.8;
    const pulse = 1 + 0.07 * Math.sin(t * 2.2 + i * 1.7);
    ctx.beginPath();
    ctx.ellipse(x, g.cy + Math.sin(i * 3.1) * 10, l.r * pulse, l.r * 0.8 * pulse, 0, 0, 7);
    ctx.fillStyle = `rgba(204,255,35,${0.55 * glowAmt})`;
    ctx.shadowColor = `rgba(217,255,76,${0.8 * glowAmt})`;
    ctx.shadowBlur = 22;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // ---- the mouth (right end) ----
  const mx = g.x1 + 8, open = 14 + 30 * recAmt + 6 * Math.sin(t * (recOn ? 6 : 1.3));
  ctx.beginPath();
  ctx.moveTo(mx - 26, g.cy - open - 12);
  ctx.quadraticCurveTo(mx + 34, g.cy, mx - 26, g.cy + open + 12);
  ctx.quadraticCurveTo(mx + 6, g.cy, mx - 26, g.cy - open - 12);
  ctx.fillStyle = LIME;
  ctx.shadowColor = GLOW;
  ctx.shadowBlur = recAmt > 0.3 ? 38 : 14;
  ctx.fill();
  ctx.shadowBlur = 0;

  // signal particles being swallowed while recording
  if (recOn && Math.random() < 0.6) particles.push({ x: W + 6, y: g.cy + (Math.random() - 0.5) * 90, v: 4 + Math.random() * 4 });
  particles = particles.filter(p => {
    p.x -= p.v;
    p.y += (g.cy - p.y) * 0.06;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.2, 0, 7);
    ctx.fillStyle = `rgba(217,255,76,.8)`;
    ctx.fill();
    return p.x > mx - 18;
  });

  // regurgitations
  spat = spat.filter(s => {
    s.x += s.vx; s.y += s.vy; s.vy += 0.12; s.life -= dt * 0.7;
    ctx.beginPath();
    ctx.ellipse(s.x, s.y, s.r, s.r * 0.8, 0, 0, 7);
    ctx.fillStyle = `rgba(204,255,35,${0.6 * Math.max(0, s.life)})`;
    ctx.fill();
    return s.life > 0 && s.x < W + 40;
  });

  // position, plainly, for the skeptic (tabular mono in the corner)
  ctx.textAlign = 'left';
  ctx.font = '11px ui-monospace, Menlo, monospace';
  ctx.fillStyle = 'rgba(246,242,235,.55)';
  const beats = tPos * SONG_S * 2;
  ctx.fillText(`${SECTIONS[Math.floor(tPos * 8)]}  ·  BAR ${Math.floor(beats / 4) + 1}.${Math.floor(beats % 4) + 1}${recOn ? '  ·  ● SWALLOWING' : ''}`, 20, H - 24);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
