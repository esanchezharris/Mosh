<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>006 · BROADCAST — the familiar, on stage</title>
<style>
  :root {
    --ink: #0B0B0B; --lime: #CCFF23; --lime-glow: #D9FF4C;
    --bone: #F6F2EB; --mist: #E5E5E1;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --font-display: "Archivo Black", "Helvetica Neue", -apple-system, "Arial Black", sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
  body.obs { background:
      repeating-conic-gradient(#161616 0% 25%, #0e0e0e 0% 50%) 0 0 / 28px 28px; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .chrome { position: fixed; font-family: var(--font-mono); color: var(--bone);
            user-select: none; -webkit-user-select: none; }
  #title { top: 18px; left: 20px; font-size: 11px; letter-spacing: .14em; opacity: .55; }
  #title b { font-family: var(--font-display); font-weight: 900; color: var(--lime); font-size: 12px; }

  #onair { top: 44px; left: 20px; font-size: 11px; letter-spacing: .2em; opacity: 0;
           color: var(--lime); transition: opacity .4s; }
  #onair.on { opacity: 1; animation: oa 1.1s ease-in-out infinite; }
  @keyframes oa { 50% { text-shadow: 0 0 18px rgba(217,255,76,.9); } }

  /* the creature's face rides the canvas */
  #face { left: 0; top: 0; text-align: center; pointer-events: none; }
  #face .eyes { font-family: var(--font-display); font-weight: 900; font-size: 40px;
        color: var(--bone); letter-spacing: 48px; text-indent: 48px; }
  #face .mouth { width: 44px; height: 26px; margin: 4px auto 0; background: var(--lime);
        border-radius: 4px 4px 26px 26px;
        box-shadow: 0 0 26px rgba(217,255,76,.8), inset 0 -5px 0 rgba(255,255,255,.35);
        transition: height .1s; }

  #songinfo { left: 50%; transform: translateX(-50%); text-align: center; }
  #songinfo .sect { font-family: var(--font-display); font-weight: 900; font-size: 15px;
        letter-spacing: .18em; color: var(--lime); }
  #songinfo .tcv { font-size: 10.5px; opacity: .55; margin-top: 3px; }

  /* right rail: the clutch + the crowd */
  #rail { right: 26px; top: 80px; width: 150px; display: flex; flex-direction: column; gap: 22px; }
  .railTitle { font-size: 9px; letter-spacing: .22em; opacity: .4; margin-bottom: 8px; }
  #eggs { display: flex; flex-wrap: wrap; gap: 7px; }
  .egg { width: 19px; height: 23px; border-radius: 50% 50% 50% 50% / 58% 58% 42% 42%;
        background: radial-gradient(circle at 36% 30%, var(--lime-glow), #5d7607 75%);
        box-shadow: 0 0 10px rgba(204,255,35,.4); animation: lay .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes lay { from { transform: scale(0) translateY(-22px); } }
  .voteRow { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; cursor: pointer; }
  .voteRow .lbl { font-size: 10px; letter-spacing: .14em; width: 40px; }
  .voteRow .barWrap { flex: 1; height: 8px; border-radius: 99px; background: rgba(246,242,235,.08); overflow: hidden; }
  .voteRow .bar { height: 100%; border-radius: 99px; background: var(--lime);
        box-shadow: 0 0 8px rgba(204,255,35,.5); transition: width .5s; }
  .voteRow.redo .bar { background: rgba(246,242,235,.45); box-shadow: none; }
  .voteRow .n { font-size: 10px; opacity: .55; width: 28px; text-align: right; }

  /* the deed ticker */
  #tickerWrap { bottom: 0; left: 0; right: 0; height: 34px; overflow: hidden;
        border-top: 1px solid rgba(204,255,35,.18); background: rgba(6,6,6,.5);
        display: flex; align-items: center; }
  #ticker { white-space: nowrap; font-size: 11px; letter-spacing: .1em; opacity: .8;
        animation: roll 26s linear infinite; }
  #ticker em { font-style: normal; color: var(--lime); }
  @keyframes roll { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  #obs { top: 18px; right: 26px; font-size: 10px; letter-spacing: .12em; cursor: pointer;
        border: 1px solid rgba(246,242,235,.2); border-radius: 999px; padding: 5px 12px; opacity: .6; }
  #obs:hover { opacity: 1; border-color: var(--lime); }

  /* PS2 CRUNCH (house style v1) */
  #crt2 { position: fixed; inset: 0; z-index: 90; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px); }
  canvas { image-rendering: pixelated; }
</style>
</head>
<body>
<div id="crt2"></div>
<canvas id="cv"></canvas>
<div class="chrome" id="face"><div class="eyes">&gt;&lt;</div><div class="mouth"></div></div>
<div class="chrome" id="title"><b>BROADCAST</b>&ensp;006 · the audience watches the symbiote work</div>
<div class="chrome" id="onair">● ON AIR — TAKING VOCALS</div>
<div class="chrome" id="obs">OBS TRANSPARENT</div>
<div class="chrome" id="songinfo">
  <div class="sect" id="sect">HOOK</div>
  <div class="tcv tc" id="tcv">BAR 1.1 · 120 BPM</div>
</div>
<div class="chrome" id="rail">
  <div>
    <div class="railTitle">THE CLUTCH — TAKES THIS SESSION</div>
    <div id="eggs"></div>
  </div>
  <div>
    <div class="railTitle">THE PIT — CHAT VOTES</div>
    <div class="voteRow" id="vibe"><span class="lbl">VIBE</span><span class="barWrap"><span class="bar" style="width:70%"></span></span><span class="n">0</span></div>
    <div class="voteRow redo" id="redo"><span class="lbl">REDO</span><span class="barWrap"><span class="bar" style="width:30%"></span></span><span class="n">0</span></div>
  </div>
</div>
<div class="chrome" id="tickerWrap"><div id="ticker"></div></div>

<script>
// BROADCAST — making music legible to a crowd. Moshi is the watchable star:
// it dances on the beat, runs hot when the take is live, lays an egg when a
// take lands, and the chat feeds it votes. The halo around it is the song —
// one revolution per loop, ticks at the sections. OBS mode drops the stage
// background out for a stream overlay.

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H, dpr;
function resize() {
  dpr = 0.5;   // PS2 crunch
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

function h1(i) { const s = Math.sin(i * 127.1) * 43758.5453; return s - Math.floor(s); }
function n1(x) {
  const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
  return h1(i) * (1 - u) + h1(i + 1) * u;
}

const BPM = 120, SONG_S = 64;
const SECTIONS = ['INTRO','VERSE 1','HOOK','VERSE 2','HOOK','BRIDGE','HOOK','OUT'];
let recOn = false, recAmt = 0, level = 0;

// blob outline: layered sines + noise — five soft lobes, beat-squash
function blobR(theta, t, beatPulse) {
  let r = 1
    + 0.16 * Math.sin(theta * 3 + t * 0.7)
    + 0.10 * Math.sin(theta * 5 - t * 0.5 + 1.7)
    + 0.05 * Math.sin(theta * 8 + t * 1.1)
    + 0.06 * (n1(theta * 2.2 + t * 0.6) - 0.5) * 2;
  return r * (1 + 0.10 * beatPulse);
}

// demo "vocal" level for the mouth: noise envelope, hotter when recording
function fakeLevel(t) {
  const e = Math.max(0, n1(t * 2.1) * 1.4 - 0.35);
  return Math.min(1, e * (recOn ? 1.25 : 0.7));
}

const face = document.getElementById('face');
const mouth = face.querySelector('.mouth');
const eyesEl = face.querySelector('.eyes');
const onair = document.getElementById('onair');
const sectEl = document.getElementById('sect');
const tcvEl = document.getElementById('tcv');
document.getElementById('obs').addEventListener('click', () => document.body.classList.toggle('obs'));
addEventListener('keydown', e => { if (e.key.toLowerCase() === 'r') setRec(!recOn); });
function setRec(on) {
  recOn = on;
  onair.classList.toggle('on', on);
  eyesEl.style.color = on ? 'var(--lime)' : 'var(--bone)';
}

// eggs: a take lands -> Moshi lays one
const eggs = document.getElementById('eggs');
function layEgg() {
  if (eggs.children.length >= 24) return;
  eggs.appendChild(Object.assign(document.createElement('div'), { className: 'egg' }));
}
layEgg(); layEgg(); layEgg();

// the pit
const votes = { vibe: 47, redo: 12 };
function renderVotes() {
  const total = votes.vibe + votes.redo;
  for (const k of ['vibe', 'redo']) {
    const row = document.getElementById(k);
    row.querySelector('.bar').style.width = (100 * votes[k] / total).toFixed(1) + '%';
    row.querySelector('.n').textContent = votes[k];
  }
}
document.getElementById('vibe').addEventListener('click', () => { votes.vibe++; renderVotes(); });
document.getElementById('redo').addEventListener('click', () => { votes.redo++; renderVotes(); });
setInterval(() => { votes[Math.random() < .8 ? 'vibe' : 'redo']++; renderVotes(); }, 2600);
renderVotes();

// deed ticker (doubled for a seamless loop)
const DEEDS = ['kept take 4', 'tucked the delay −2 dB', 'looped verse 2', 'tuned the harmony — subtle',
               'punched in after the hook', 'muted the click', 'raised lead vocal +1.5 dB', 'printed rough bounce v3'];
document.getElementById('ticker').innerHTML =
  (DEEDS.map(d => ` <em>✓</em> moshi ${d} &emsp;·&emsp;`).join('')).repeat(2);

// demo dramaturgy: record during hooks, lay an egg when each take lands
let lastSect = -1;
function dramaturgy(pos) {
  const s = Math.floor(pos * 8);
  if (s !== lastSect) {
    if (SECTIONS[s] === 'HOOK') setRec(true);
    else if (recOn) { setRec(false); layEgg(); }
    lastSect = s;
  }
}

const t0 = performance.now();
function frame(now) {
  const t = (now - t0) / 1000;
  const pos = (t % SONG_S) / SONG_S;
  dramaturgy(pos);
  recAmt += ((recOn ? 1 : 0) - recAmt) * 0.06;
  level += (fakeLevel(t) - level) * 0.3;

  const beats = t * BPM / 60;
  const beatPulse = Math.pow(1 - (beats % 1), 3);           // sharp hit, fast decay
  const cx = W * 0.5, cy = H * 0.46;
  const R = Math.min(W, H) * 0.17;

  ctx.clearRect(0, 0, W, H);

  // halo = the song; one lap per loop, ticks at the sections
  const hr = R * 1.85;
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(246,242,235,.10)';
  ctx.beginPath(); ctx.arc(cx, cy, hr, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = `rgba(204,255,35,${0.6 + 0.4 * recAmt})`;
  ctx.shadowColor = 'rgba(217,255,76,.7)'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(cx, cy, hr, -Math.PI / 2, -Math.PI / 2 + pos * Math.PI * 2); ctx.stroke();
  ctx.shadowBlur = 0;
  for (let i = 0; i < 8; i++) {
    const a = -Math.PI / 2 + (i / 8) * Math.PI * 2;
    const cur = Math.floor(pos * 8) === i;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a) * hr, cy + Math.sin(a) * hr, cur ? 4.5 : 2.5, 0, Math.PI * 2);
    ctx.fillStyle = cur ? '#D9FF4C' : 'rgba(246,242,235,.3)';
    ctx.fill();
  }

  // the body — squash & stretch on the beat, hotter while recording
  const squash = 1 + 0.12 * beatPulse, bounceY = -14 * beatPulse;
  ctx.save();
  ctx.translate(cx, cy + bounceY);
  ctx.scale(squash, 1 / squash);
  ctx.beginPath();
  for (let i = 0; i <= 96; i++) {
    const th = (i / 96) * Math.PI * 2;
    const r = R * blobR(th, t, beatPulse);
    const x = Math.cos(th) * r, y = Math.sin(th) * r * 0.92;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = '#0d0d0c';
  ctx.shadowColor = `rgba(204,255,35,${0.25 + 0.55 * recAmt})`;
  ctx.shadowBlur = 30 + 26 * recAmt + 18 * beatPulse;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = `rgba(204,255,35,${0.30 + 0.45 * recAmt})`;
  ctx.lineWidth = 1.4;
  ctx.stroke();
  // ember heart while on air
  if (recAmt > 0.02) {
    const hg = ctx.createRadialGradient(0, 6, 2, 0, 6, R * 0.75);
    hg.addColorStop(0, `rgba(217,255,76,${0.5 * recAmt * (0.7 + 0.3 * Math.sin(t * 7))})`);
    hg.addColorStop(1, 'rgba(217,255,76,0)');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(0, 6, R * 0.75, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  // face follows the body
  face.style.left = cx - 80 + 'px';
  face.style.top = cy + bounceY - 42 + 'px';
  face.style.width = '160px';
  mouth.style.height = 10 + 26 * level + 'px';

  // song info sits under the halo
  const si = document.getElementById('songinfo');
  si.style.top = cy + hr + 22 + 'px';
  sectEl.textContent = SECTIONS[Math.floor(pos * 8)];
  tcvEl.textContent = `BAR ${Math.floor(beats / 4) % 32 + 1}.${Math.floor(beats % 4) + 1} · ${BPM} BPM${recOn ? ' · ● TAKE LIVE' : ''}`;

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
