<html lang="en">
<head>

<title>007 · TERRARIUM — the specimen, kept quietly</title>
<style>
  /* tokens (canonical: design-lab/tokens/moshi.css) */
  :root {
    --ink: #0B0B0B; --lime: #CCFF23; --lime-glow: #D9FF4C;
    --bone: #F6F2EB; --mist: #E5E5E1;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --font-display: "Archivo Black", "Helvetica Neue", -apple-system, "Arial Black", sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .chrome { position: fixed; font-family: var(--font-mono); color: var(--bone);
            user-select: none; -webkit-user-select: none; }
  #title { top: 18px; left: 20px; font-size: 11px; letter-spacing: .14em; opacity: .55; }
  #title b { font-family: var(--font-display); font-weight: 900; color: var(--lime); font-size: 12px; }

  /* ---- vitals: quiet but absolute (from 005) ---- */
  #vitals { top: 16px; left: 50%; transform: translateX(-50%); text-align: center; }
  #vitals svg { display: block; margin: 0 auto; }
  #sect { font-size: 10px; letter-spacing: .2em; opacity: .5; margin-top: 2px; }

  /* ---- the specimen, bottom-left, raymarched but small ---- */
  #creature { position: fixed; bottom: 26px; left: 32px; width: 210px; height: 190px;
              display: block; }
  #eyes { bottom: 126px; left: 137px; transform: translateX(-50%); display: flex; gap: 26px;
          font-family: var(--font-display); font-weight: 900; font-size: 19px;
          color: var(--bone); pointer-events: none;
          transition: color .5s, text-shadow .5s, gap .5s; }
  #eyes span { display: inline-block; transition: transform .45s cubic-bezier(.34,1.56,.64,1); }
  #eyes.listening span { animation: bob 2.4s ease-in-out infinite; }
  #eyes.recording { color: var(--lime); text-shadow: 0 0 14px rgba(217,255,76,.7); }
  #eyes.recording span { animation: pulse 1.1s ease-in-out infinite; }
  #eyes.flinch { color: var(--lime-glow); }
  #eyes.flinch span { animation: shake .14s linear infinite; }
  @keyframes bob   { 0%,100% { translate: 0 0; } 50% { translate: 0 -4px; } }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  @keyframes shake { 0% { translate: -2px 0; } 50% { translate: 2px 1px; } 100% { translate: -2px 0; } }

  /* ---- the ledger column: deeds as living cells (from 005) ---- */
  #ledger { top: 80px; right: 56px; bottom: 120px; width: 60px; display: flex;
        flex-direction: column; align-items: center; gap: 14px; }
  #ledgerLabel { top: 52px; right: 34px; font-size: 9px; letter-spacing: .22em; opacity: .35;
        writing-mode: vertical-rl; }
  .cell { position: relative; width: 36px; height: 34px; cursor: pointer; flex: none;
        transition: opacity 2s; }
  .cell .body { position: absolute; inset: 0; background: #0e0e0d;
        border: 1px solid rgba(204,255,35,.4);
        border-radius: 46% 54% 52% 48% / 52% 46% 54% 48%;
        box-shadow: 0 0 12px rgba(204,255,35,.14), inset 0 0 8px rgba(204,255,35,.10);
        animation: cellbreathe ease-in-out infinite; }
  .cell .nuc { position: absolute; left: 50%; top: 50%; width: 9px; height: 9px;
        transform: translate(-50%,-50%); border-radius: 50%; background: var(--lime);
        box-shadow: 0 0 10px rgba(217,255,76,.9); }
  @keyframes cellbreathe { 50% { transform: scale(1.08) rotate(3deg); } }
  .cell:hover .body { border-color: var(--lime); box-shadow: 0 0 20px rgba(204,255,35,.4); }
  .cell .tag { position: absolute; right: 48px; top: 50%; transform: translateY(-50%);
        white-space: nowrap; font-size: 10.5px; letter-spacing: .06em; color: var(--bone);
        background: rgba(11,11,11,.85); border: 1px solid rgba(204,255,35,.3);
        border-radius: 999px; padding: 4px 11px; opacity: 0; pointer-events: none;
        transition: opacity .25s; }
  .cell:hover .tag { opacity: 1; }
  .cell .tag em { font-style: normal; color: var(--lime); }
  .splat { position: fixed; width: 5px; height: 5px; border-radius: 50%;
        background: var(--lime); pointer-events: none; }

  #ask { bottom: 40px; left: 50%; transform: translateX(-50%); width: min(420px, 60vw); }
  #ask input { width: 100%; background: transparent; border: 0; outline: 0; text-align: center;
        border-bottom: 1px solid rgba(246,242,235,.18); padding: 8px 2px;
        font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; color: var(--bone); }
  #ask input::placeholder { color: rgba(246,242,235,.25); }
  #ask input:focus { border-bottom-color: rgba(204,255,35,.6); }
  #toast { bottom: 84px; left: 50%; transform: translateX(-50%); font-size: 10.5px;
        letter-spacing: .1em; color: var(--lime); opacity: 0; transition: opacity .4s; }
  #hint { bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 9.5px;
        letter-spacing: .12em; opacity: .28; }
  #err { top: 50%; left: 50%; transform: translate(-50%,-50%); color: var(--lime);
         font-size: 12px; display: none; }

  /* Y2K CONSOLE (house style v2): res-crunch only — scanlines were the wrong decade */
  canvas { image-rendering: pixelated; }
</style>

<body>
<canvas id="bg"></canvas>
<canvas id="creature"></canvas>
<div class="chrome" id="eyes"><span>&gt;</span><span>&lt;</span></div>

<div class="chrome" id="title"><b>TERRARIUM</b>&ensp;007 · the specimen, kept quietly</div>

<div class="chrome" id="vitals">
  <svg width="56" height="56" viewBox="0 0 56 56">
    <circle cx="28" cy="28" r="21" fill="none" stroke="rgba(246,242,235,.12)" stroke-width="2"/>
    <circle id="posRing" cx="28" cy="28" r="21" fill="none" stroke="#CCFF23" stroke-width="2"
            stroke-linecap="round" stroke-dasharray="131.9" stroke-dashoffset="131.9"
            transform="rotate(-90 28 28)"/>
    <circle id="ember" cx="28" cy="28" r="5.5" fill="rgba(246,242,235,.18)"/>
  </svg>
  <div id="sect" class="tc">VERSE 1 · BAR 1.1 · R TO PUNCH IN</div>
</div>

<div class="chrome" id="ledgerLabel">WHAT IT DID · POP TO UNDO</div>
<div class="chrome" id="ledger"></div>
<div class="chrome" id="toast"></div>
<div class="chrome" id="ask"><input id="cmd" placeholder="tell moshi — it will show you the deed" autocomplete="off" /></div>
<div class="chrome" id="hint">it works in the corner · R to punch in · hover a cell to read · pop to undo</div>
<div class="chrome" id="err">webgl unavailable</div>

<script>
// TERRARIUM — 002 + 005 + a hushed 001.
// SPECIMEN's raymarched body keeps its full reactivity (heat when recording,
// arousal when addressed, tremor when popped) but lives small and out of the
// way, bottom-left, exactly where SPORE LEDGER kept its goo blob. Deeds still
// bud off the body into the ledger. Behind everything, HEARTH's ink field —
// slowed, dimmed, veins barely luminous, and NO pressure rings — just breathes,
// warming sympathetically when the creature works.

// ---------------------------------------------------------------- gl helpers
const VERT = `attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;
function makeProg(gl, fragSrc) {
  function sh(ty, src) {
    const s = gl.createShader(ty);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, VERT));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fragSrc));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  gl.useProgram(p);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(p, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  return p;
}

// ------------------------------------------------- layer 1: the hushed field
// HEARTH's double domain warp, turned down: slower clock, two iso veins
// instead of three, ~half the heat ceiling, no onset ring, deeper vignette.
const BG_FRAG = `
precision highp float;
uniform vec2  u_res;
uniform float u_time;
uniform float u_warm;     // creature-coupled 0..1 — the field sympathizes
uniform float u_bright;
uniform float u_barPhase;

const vec3 INK  = vec3(0.0431);
const vec3 LIME = vec3(0.800, 1.000, 0.137);
const vec3 GLOW = vec3(0.851, 1.000, 0.298);

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash(i), b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) {
    v += a * vnoise(p);
    p = p * 2.03 + vec2(7.31, 3.17);
    a *= 0.5;
  }
  return v;
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);
  float t = u_time * (0.016 + 0.038 * u_warm);

  float breath = 0.5 + 0.5 * sin(u_time * 0.42);
  float inhale = 1.0 + 0.020 * breath * (0.4 + 0.6 * u_warm);

  vec2 p = uv * 2.1 * inhale;
  vec2 q = vec2(fbm(p + t * 0.9), fbm(p - t * 0.6 + 5.2));
  vec2 r = vec2(fbm(p + 1.9 * q + vec2(1.7, 9.2) + t * 0.35),
                fbm(p + 1.9 * q + vec2(8.3, 2.8) - t * 0.27));
  float f = fbm(p + 2.1 * r);

  float vein = 0.0;
  float w = mix(0.008, 0.016, u_bright);
  vein += smoothstep(w, 0.0, abs(f - 0.42));
  vein += smoothstep(w, 0.0, abs(f - 0.58)) * 0.7;
  vein *= 0.45 + 0.55 * fbm(p * 3.0 + r);

  // bar front kept, but a whisper of its former self
  float fx = u_barPhase * 2.6 - 1.3;
  float front = exp(-pow((uv.x - fx) * 5.5, 2.0)) * 0.5;

  vec3 col = INK * (0.42 + 0.55 * f * f);
  vec3 veinCol = mix(LIME, GLOW, u_bright);
  float heat = 0.08 + 0.30 * u_warm;
  col += vein * veinCol * heat * 0.45;
  col += front * veinCol * 0.035 * (0.5 + u_warm);

  float vig = smoothstep(1.15, 0.38, length(uv));
  col = mix(vec3(0.0215), col, vig);
  gl_FragColor = vec4(col, 1.0);
}`;

// --------------------------------------------- layer 2: the corner specimen
// SPECIMEN's SDF body verbatim in miniature; misses are transparent so the
// field shows through. The lume circling the membrane is still song position.
const CR_FRAG = `
precision highp float;
uniform vec2  u_res;
uniform float u_time;
uniform float u_arousal;
uniform float u_heat;
uniform float u_clip;
uniform float u_mouth;
uniform float u_barPhase;

const vec3 INK  = vec3(0.045);
const vec3 LIME = vec3(0.800, 1.000, 0.137);
const vec3 GLOW = vec3(0.851, 1.000, 0.298);

float hash31(vec3 p) {
  p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3));
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}
float noise3(vec3 p) {
  vec3 i = floor(p), f = fract(p);
  vec3 u = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(mix(hash31(i),               hash31(i + vec3(1,0,0)), u.x),
        mix(hash31(i + vec3(0,1,0)), hash31(i + vec3(1,1,0)), u.x), u.y),
    mix(mix(hash31(i + vec3(0,0,1)), hash31(i + vec3(1,0,1)), u.x),
        mix(hash31(i + vec3(0,1,1)), hash31(i + vec3(1,1,1)), u.x), u.y), u.z);
}
float smin(float a, float b, float k) {
  float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
  return mix(b, a, h) - k * h * (1.0 - h);
}
float map(vec3 p) {
  float t = u_time;
  vec3 q = p;
  q.y *= 1.0 + 0.05 * sin(t * 0.9);
  float d = length(q) - 0.60;
  d = smin(d, length(q - vec3( 0.40*sin(t*0.43+1.0), 0.33*cos(t*0.37),      0.18*sin(t*0.51))) - 0.30, 0.30);
  d = smin(d, length(q - vec3(-0.44*sin(t*0.31),     0.28*cos(t*0.41+2.0), -0.15*cos(t*0.29))) - 0.27, 0.30);
  d = smin(d, length(q - vec3( 0.24*cos(t*0.27+4.0),-0.40*sin(t*0.33),      0.20*sin(t*0.40))) - 0.24, 0.30);
  d = smin(d, length(q - vec3(-0.20,                 0.43*sin(t*0.23+1.7),  0.10))             - 0.22, 0.30);
  float amp   = mix(0.012, 0.150, pow(u_arousal, 1.4));
  float freq  = mix(2.5, 8.5, u_arousal);
  float speed = mix(0.35, 2.4, u_arousal);
  d -= amp * (noise3(q * freq + vec3(0.0, 0.0, t * speed)) - 0.5) * 2.0;
  d -= u_clip * 0.035 * (noise3(q * 18.0 + t * 9.0) - 0.5) * 2.0;
  return d;
}
vec3 normalAt(vec3 p) {
  const vec2 e = vec2(0.0015, -0.0015);
  return normalize(e.xyy * map(p + e.xyy) + e.yyx * map(p + e.yyx)
                 + e.yxy * map(p + e.yxy) + e.xxx * map(p + e.xxx));
}

void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);
  vec3 ro = vec3(0.0, 0.0, 2.55);
  vec3 rd = normalize(vec3(uv, -1.45));

  float t = 0.0; float d; vec3 hp;
  bool hit = false;
  for (int i = 0; i < 80; i++) {
    hp = ro + rd * t;
    d = map(hp);
    if (d < 0.0012) { hit = true; break; }
    t += d * 0.85;
    if (t > 5.0) break;
  }
  if (!hit) { gl_FragColor = vec4(0.0); return; }

  vec3 n = normalAt(hp);
  float fres = pow(1.0 - max(dot(n, -rd), 0.0), 2.5);

  vec3 col = INK * (0.55 + 0.45 * max(dot(n, normalize(vec3(0.4, 0.8, 0.5))), 0.0));
  col += LIME * fres * (0.16 + 0.55 * u_heat + 0.22 * u_arousal);

  float ember = u_heat * (0.45 * fres + 0.55 * exp(-3.2 * length(hp)))
              * (0.75 + 0.25 * sin(u_time * 7.0));
  col += GLOW * ember * 0.9;

  vec3 mdir = normalize(vec3(0.0, -0.34, 1.0));
  float ang = acos(clamp(dot(normalize(hp), mdir), -1.0, 1.0));
  float mr = mix(0.18, 0.46, u_mouth);
  float mouth = smoothstep(mr, mr - 0.10, ang);
  float spec = pow(max(dot(reflect(rd, n), normalize(vec3(0.3, 0.9, 0.4))), 0.0), 28.0);
  col = mix(col, LIME * (0.72 + 0.45 * u_heat) + vec3(spec), mouth);

  float az = atan(hp.x, hp.z);
  float ph = u_barPhase * 6.2831853 - 3.14159265;
  float dAz = abs(atan(sin(az - ph), cos(az - ph)));
  col += LIME * exp(-pow(dAz * 2.2, 2.0)) * (0.10 + 0.28 * u_heat) * (1.0 - mouth);

  col *= 1.0 - u_clip * 0.22 * step(0.5, fract(u_time * 13.0));
  gl_FragColor = vec4(col, 1.0);
}`;

// --------------------------------------------------------------- contexts
const bgCv = document.getElementById('bg');
const bgGl = bgCv.getContext('webgl', { antialias: false, alpha: false });
const crCv = document.getElementById('creature');
const crGl = crCv.getContext('webgl', { antialias: false, alpha: true });
if (!bgGl || !crGl) { document.getElementById('err').style.display = 'block'; throw new Error('no webgl'); }

const bgProg = makeProg(bgGl, BG_FRAG);
const BU = {};
for (const n of ['u_res','u_time','u_warm','u_bright','u_barPhase'])
  BU[n] = bgGl.getUniformLocation(bgProg, n);

const crProg = makeProg(crGl, CR_FRAG);
const CU = {};
for (const n of ['u_res','u_time','u_arousal','u_heat','u_clip','u_mouth','u_barPhase'])
  CU[n] = crGl.getUniformLocation(crProg, n);

function resize() {
  const dpr = 0.25;   // PS2 crunch
  bgCv.width = Math.floor(innerWidth * dpr);
  bgCv.height = Math.floor(innerHeight * dpr);
  bgGl.viewport(0, 0, bgCv.width, bgCv.height);
  const r = crCv.getBoundingClientRect();
  const cdpr = 0.5;   // PS2 crunch
  crCv.width = Math.floor(r.width * cdpr);
  crCv.height = Math.floor(r.height * cdpr);
  crGl.viewport(0, 0, crCv.width, crCv.height);
}
addEventListener('resize', resize); resize();
// harden: survive WebGL context loss
if (!bgGl || !crGl) { setTimeout(() => location.reload(), 1500); throw new Error('webgl unavailable - retrying'); }
for (const c of [bgCv, crCv]) {
  c.addEventListener('webglcontextlost', e => e.preventDefault());
  c.addEventListener('webglcontextrestored', () => location.reload());
}

// ------------------------------------------------------------- the ledger
const ledger = document.getElementById('ledger');
const toast = document.getElementById('toast');
const DEMO = ['kept take 4', 'added delay to lead vocal', 'raised vocal +1.5 dB',
              'looped verse 2', 'tightened the hook comp', 'rolled off 80 Hz on bass',
              'punched in after the hook', 'printed a rough bounce'];

function say(msg) {
  toast.textContent = msg;
  toast.style.opacity = .9;
  setTimeout(() => toast.style.opacity = 0, 2400);
}

function makeCell(text) {
  const c = document.createElement('div');
  c.className = 'cell';
  const dur = (3.5 + Math.random() * 3).toFixed(1);
  c.innerHTML = `<div class="body" style="animation-duration:${dur}s"></div>
                 <div class="nuc"></div>
                 <div class="tag"><em>✓</em> ${text}</div>`;
  c.addEventListener('click', () => pop(c, text));
  return c;
}

function pop(cell, text) {
  const r = cell.getBoundingClientRect();
  for (let i = 0; i < 9; i++) {
    const s = document.createElement('div');
    s.className = 'splat';
    s.style.left = r.left + r.width / 2 + 'px';
    s.style.top = r.top + r.height / 2 + 'px';
    document.body.appendChild(s);
    const a = Math.random() * Math.PI * 2, d = 24 + Math.random() * 36;
    s.animate([{ transform: 'translate(0,0)', opacity: 1 },
               { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px)`, opacity: 0 }],
              { duration: 480, easing: 'cubic-bezier(.17,.67,.4,1)' }).onfinish = () => s.remove();
  }
  cell.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.6)', opacity: 0 }],
               { duration: 240, easing: 'ease-out' }).onfinish = () => cell.remove();
  say(`↺ undid: ${text}`);
  flinch = 1;                    // the body shudders when you take a deed back
  setEyes('flinch', '×', '×');
  setTimeout(() => refreshEyes(), 700);
}

function deed(text) {
  const cell = makeCell(text);
  cell.style.visibility = 'hidden';
  ledger.prepend(cell);
  const target = cell.getBoundingClientRect();
  const m = crCv.getBoundingClientRect();

  // a spore buds off the specimen and travels to the ledger
  const fly = document.createElement('div');
  fly.className = 'cell';
  fly.innerHTML = '<div class="body"></div><div class="nuc"></div>';
  fly.style.position = 'fixed';
  fly.style.left = m.left + m.width * .55 + 'px';
  fly.style.top = m.top + m.height * .30 + 'px';
  fly.style.zIndex = 10;
  document.body.appendChild(fly);
  const dx = target.left - (m.left + m.width * .55);
  const dy = target.top - (m.top + m.height * .30);
  fly.animate([
    { transform: 'translate(0,0) scale(.4)', opacity: 0.0 },
    { transform: `translate(${dx * .3}px, ${dy * .55 - 60}px) scale(1.1)`, opacity: 1, offset: .45 },
    { transform: `translate(${dx}px, ${dy}px) scale(1)`, opacity: 1 },
  ], { duration: 1300, easing: 'cubic-bezier(.45,.05,.35,1)' }).onfinish = () => {
    fly.remove();
    cell.style.visibility = 'visible';
  };

  while (ledger.children.length > 7) ledger.lastElementChild.remove();
  setTimeout(() => { if (cell.isConnected) cell.style.opacity = .45; }, 30000);
  setTimeout(() => { if (cell.isConnected) { cell.style.opacity = 0; setTimeout(() => cell.remove(), 2000); } }, 55000);

  blip = 1;                      // the body works: a visible exhale per deed
}

// demo metabolism — slower than 005; this room is quieter
let di = 0;
setTimeout(function tick() {
  deed(DEMO[di++ % DEMO.length]);
  setTimeout(tick, 9000 + Math.random() * 8000);
}, 1800);

const cmd = document.getElementById('cmd');
cmd.addEventListener('keydown', e => {
  if (e.key === 'Enter' && cmd.value.trim()) { deed(cmd.value.trim()); cmd.value = ''; }
});

// --------------------------------------------- reactivity: events, not deck
// 002 demoed its states with buttons; here the same body is driven by what
// actually happens: focus = listening, R = recording heat, deed = blip,
// pop = flinch tremor, cursor near the creature = it perks up.
const eyes = document.getElementById('eyes');
let rec = false, blip = 0, flinch = 0, prox = 0;

function setEyes(cls, l, r) {
  eyes.className = 'chrome ' + cls;
  eyes.children[0].textContent = l;
  eyes.children[1].textContent = r;
}
function refreshEyes() {
  if (rec) setEyes('recording', '>', '<');
  else if (document.activeElement === cmd) setEyes('listening', '>', '<');
  else setEyes('', '>', '<');
}
cmd.addEventListener('focus', refreshEyes);
cmd.addEventListener('blur', refreshEyes);

addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'r' && document.activeElement !== cmd) {
    rec = !rec;
    if (rec) deed('punched in');
    refreshEyes();
  }
});

addEventListener('mousemove', e => {
  const m = crCv.getBoundingClientRect();
  const cx = m.left + m.width / 2, cy = m.top + m.height / 2;
  const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
  prox = Math.max(0, 1 - dist / 320);
});

// ------------------------------------------------------- shared transport
const SECTIONS = ['INTRO','VERSE 1','HOOK','VERSE 2','HOOK','BRIDGE','HOOK','OUT'];
const SONG_S = 96, BPM = 120, BARS = 8, CIRC = 131.9;
const ember = document.getElementById('ember'), ring = document.getElementById('posRing'),
      sect = document.getElementById('sect');
const cur = { a: 0.06, heat: 0, clip: 0, mouth: 0.24 };
const t0 = performance.now();

function frame(now) {
  const t = (now - t0) / 1000;

  // targets composed from live signals; autopilot keeps a faint idle sway
  const idle = 0.07 + 0.03 * Math.sin(t * 0.13);
  const listening = document.activeElement === cmd ? 0.16 : 0;
  const tgtA = Math.min(1, idle + listening + (rec ? 0.45 : 0) + prox * 0.18 + blip * 0.35);
  const tgtHeat = Math.min(1, (rec ? 1 : 0) + blip * 0.35);
  const tgtMouth = Math.min(0.9, 0.24 + (rec ? 0.28 : 0) + blip * 0.35 + listening * 0.6);
  cur.a += (tgtA - cur.a) * 0.05;
  cur.heat += (tgtHeat - cur.heat) * 0.05;
  cur.mouth += (tgtMouth - cur.mouth) * 0.05;
  cur.clip += (flinch - cur.clip) * 0.18;
  blip *= 0.965;
  flinch *= 0.90;

  // transport
  const pos = (t % SONG_S) / SONG_S;
  const beats = t * BPM / 60;
  const barPhase = (beats / 4 % BARS) / BARS;
  ring.setAttribute('stroke-dashoffset', (CIRC * (1 - pos)).toFixed(1));
  sect.textContent = `${SECTIONS[Math.floor(pos * 8)]} · BAR ${Math.floor(beats / 4) % 48 + 1}.${Math.floor(beats % 4) + 1}${rec ? ' · ● TAKING' : ' · R TO PUNCH IN'}`;
  if (rec) {
    const p = .7 + .3 * Math.sin(t * 7);
    ember.setAttribute('fill', `rgba(204,255,35,${p})`);
    ember.setAttribute('r', (5.5 + p * 2).toFixed(1));
  } else {
    ember.setAttribute('fill', 'rgba(246,242,235,.18)');
    ember.setAttribute('r', '5.5');
  }

  // the field sympathizes with the body, capped well below HEARTH levels
  const warm = Math.min(1, 0.18 + 0.45 * cur.heat + 0.30 * cur.a);
  const bright = 0.35 + 0.18 * Math.sin(t * 0.09 + 2.0);

  bgGl.useProgram(bgProg);
  bgGl.uniform2f(BU.u_res, bgCv.width, bgCv.height);
  bgGl.uniform1f(BU.u_time, t);
  bgGl.uniform1f(BU.u_warm, warm);
  bgGl.uniform1f(BU.u_bright, bright);
  bgGl.uniform1f(BU.u_barPhase, barPhase);
  bgGl.drawArrays(bgGl.TRIANGLES, 0, 3);

  crGl.useProgram(crProg);
  crGl.clearColor(0, 0, 0, 0);
  crGl.clear(crGl.COLOR_BUFFER_BIT);
  crGl.uniform2f(CU.u_res, crCv.width, crCv.height);
  crGl.uniform1f(CU.u_time, t);
  crGl.uniform1f(CU.u_arousal, cur.a);
  crGl.uniform1f(CU.u_heat, cur.heat);
  crGl.uniform1f(CU.u_clip, cur.clip);
  crGl.uniform1f(CU.u_mouth, cur.mouth);
  crGl.uniform1f(CU.u_barPhase, barPhase);
  crGl.drawArrays(crGl.TRIANGLES, 0, 3);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
