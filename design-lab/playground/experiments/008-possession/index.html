<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>008 · POSSESSION — the current UI, possessed</title>
<style>
  :root {
    --ink: #0B0B0B; --lime: #CCFF23; --lime-glow: #D9FF4C;
    --bone: #F6F2EB; --mist: #E5E5E1;
    --slab: #111110; --slab-2: #141413;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --font-display: "Archivo Black", "Helvetica Neue", -apple-system, "Arial Black", sans-serif;
    /* the seam: lume with a whisper of dispersion (field-notes motif 1+2) */
    --seam: 0 0 0 1px rgba(204,255,35,.16), 0 0 9px rgba(204,255,35,.10),
            1px 0 0 rgba(80,255,220,.05), -1px 0 0 rgba(255,80,200,.04);
  }
  html, body { margin: 0; height: 100%; background: #070707; overflow: hidden;
    font-family: var(--font-mono); color: var(--bone); }
  .mono { font-variant-numeric: tabular-nums; letter-spacing: .06em; }
  .disp { font-family: var(--font-display); font-weight: 900; letter-spacing: .02em;
    text-transform: uppercase; }

  /* recording: the whole room runs hot at the edges */
  #roomheat { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 50;
    background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(204,255,35,.07) 100%);
    transition: opacity .8s; }
  body.rec #roomheat { opacity: 1; animation: heat 1.1s ease-in-out infinite; }
  @keyframes heat { 50% { opacity: .55; } }

  /* ---- skeleton: same bones as ui/src, new matter ---- */
  #topbar { position: fixed; top: 0; left: 0; right: 0; height: 52px; display: flex;
    align-items: center; gap: 22px; padding: 0 20px; background: var(--slab);
    box-shadow: var(--seam); z-index: 20; }
  #wordmark { font-size: 17px; color: var(--bone); }
  #wordmark b { color: var(--lime); text-shadow: 0 0 16px rgba(217,255,76,.4); }
  #transport { display: flex; align-items: center; gap: 14px; font-size: 11px; opacity: .85; }
  #playbtn { cursor: pointer; border: 0; background: transparent; color: var(--lime);
    font-size: 13px; font-family: var(--font-mono); padding: 2px 6px; }
  #recchip { margin-left: auto; font-size: 10px; letter-spacing: .16em; cursor: pointer;
    border: 1px solid rgba(246,242,235,.18); border-radius: 999px; padding: 5px 13px; opacity: .6; }
  body.rec #recchip { color: var(--ink); background: var(--lime); border-color: var(--lime);
    opacity: 1; box-shadow: 0 0 22px rgba(217,255,76,.55); animation: heat 1.1s infinite; }

  #deeds { position: fixed; top: 64px; right: 16px; display: flex; flex-direction: column;
    gap: 7px; align-items: flex-end; z-index: 30; }
  .deed { font-size: 10px; letter-spacing: .05em; color: var(--bone);
    background: rgba(11,11,11,.82); border: 1px solid rgba(204,255,35,.32);
    border-radius: 999px; padding: 5px 11px; display: flex; gap: 8px; align-items: center;
    animation: din .45s cubic-bezier(.34,1.56,.64,1); transition: opacity 1s, transform 1s; }
  .deed em { font-style: normal; color: var(--lime); }
  .deed button { background: none; border: 0; color: rgba(246,242,235,.4); cursor: pointer;
    font-family: var(--font-mono); font-size: 10px; padding: 0; }
  .deed button:hover { color: var(--lime); }
  .deed.bye { opacity: 0; transform: translateY(-14px); }
  @keyframes din { from { opacity: 0; transform: translateX(26px) scale(.85); } }

  /* arrangement: lanes as ink slabs, seams of lume */
  #arrange { position: fixed; top: 64px; left: 14px; right: 14px; bottom: 218px; z-index: 5; }
  #ruler { height: 22px; display: flex; font-size: 9px; opacity: .4; padding-left: 150px; }
  #ruler span { flex: 1; border-left: 1px solid rgba(246,242,235,.12); padding: 4px 0 0 5px; }
  .lane { display: flex; height: 74px; margin-bottom: 10px; }
  .lhead { width: 136px; flex: none; background: var(--slab); box-shadow: var(--seam);
    border-radius: 10px; margin-right: 14px; padding: 10px 12px; position: relative; }
  .lhead .nm { font-size: 13px; color: var(--bone); }
  .lhead .ms { position: absolute; bottom: 9px; left: 12px; font-size: 9px;
    letter-spacing: .2em; opacity: .45; }
  .lhead .vol { position: absolute; bottom: 13px; right: 12px; width: 44px; height: 2px;
    background: rgba(246,242,235,.15); border-radius: 2px; }
  .lhead .vol i { display: block; height: 100%; width: 72%; background: var(--lime);
    border-radius: 2px; box-shadow: 0 0 6px rgba(204,255,35,.5); }
  .lbody { position: relative; flex: 1; background: var(--slab-2); box-shadow: var(--seam);
    border-radius: 10px; overflow: hidden; }
  .clip { position: absolute; top: 9px; bottom: 9px; background: #0a0a09;
    border: 1px solid rgba(204,255,35,.35); border-radius: 11px;
    box-shadow: inset 0 0 16px rgba(204,255,35,.07); cursor: pointer;
    transition: box-shadow .3s, border-color .3s; }
  .clip:hover { border-color: var(--lime); box-shadow: 0 0 18px rgba(204,255,35,.25),
    inset 0 0 16px rgba(204,255,35,.12); }
  .clip .cn { position: absolute; top: 5px; left: 9px; font-size: 8.5px;
    letter-spacing: .12em; color: rgba(246,242,235,.55); }
  .clip canvas { position: absolute; left: 4px; right: 4px; bottom: 4px; height: 26px;
    width: calc(100% - 8px); opacity: .9; }
  .clip .rl { position: absolute; top: 5px; right: 8px; font-size: 8px; color: var(--ink);
    background: var(--lime); border-radius: 99px; padding: 1px 6px; }

  /* the playhead: a lume line wearing its own dispersion, plus a traveling bulge */
  #phead { position: absolute; top: 22px; bottom: 0; width: 2px; background: var(--lime);
    box-shadow: 0 0 10px rgba(217,255,76,.8), 2px 0 0 rgba(80,255,220,.25),
      -2px 0 0 rgba(255,80,200,.2); z-index: 9; pointer-events: none; }
  #pulse { position: absolute; width: 90px; height: 90px; border-radius: 50%;
    background: radial-gradient(circle, rgba(204,255,35,.16), transparent 65%);
    pointer-events: none; z-index: 8; transform: translate(-50%, -50%); }

  /* bottom slabs: CHAIN + the RACK (parameter poetry) — eaten open, not slid */
  .slabpanel { position: fixed; bottom: 64px; background: var(--slab); box-shadow: var(--seam);
    border-radius: 14px; padding: 14px 18px; z-index: 12;
    transition: clip-path .7s cubic-bezier(.7,0,.3,1), opacity .5s; }
  .slabpanel.hid { clip-path: circle(0% at 20% 110%); opacity: 0; pointer-events: none; }
  .slabpanel.shown { clip-path: circle(141% at 20% 110%); opacity: 1; }
  .slabpanel.molten { animation: molt .8s ease-out; }
  @keyframes molt { 0% { box-shadow: 0 0 36px rgba(217,255,76,.55), var(--seam); }
                    100% { box-shadow: var(--seam); } }
  #chain { left: 14px; width: 330px; }
  #rack { right: 14px; width: 360px; }
  .ptitle { font-size: 9px; letter-spacing: .24em; opacity: .45; margin-bottom: 10px; }
  .ptitle b { color: var(--lime); opacity: 1; }
  .prow { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 10.5px; }
  .prow .lbl { width: 64px; letter-spacing: .14em; opacity: .8; }
  .prow .track { flex: 1; height: 2px; background: rgba(246,242,235,.13); border-radius: 2px;
    position: relative; cursor: pointer; }
  .prow .track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--lime);
    border-radius: 2px; box-shadow: 0 0 7px rgba(204,255,35,.55); }
  .prow .track u { position: absolute; top: 50%; width: 9px; height: 9px; border-radius: 50%;
    background: var(--lime); transform: translate(-50%,-50%);
    box-shadow: 0 0 9px rgba(217,255,76,.8); }
  .prow .val { width: 30px; text-align: right; opacity: .7; }
  .meta { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 9.5px; }
  .badge { color: var(--ink); background: var(--lime); border-radius: 99px; padding: 2px 8px;
    letter-spacing: .1em; }
  .ghost { border: 1px solid rgba(246,242,235,.2); border-radius: 99px; padding: 2px 10px;
    opacity: .65; cursor: pointer; }
  .ghost:hover { border-color: var(--lime); color: var(--lime); opacity: 1; }
  /* takes as capsules (field-notes motif 6) */
  #capsules { display: flex; gap: 7px; margin-top: 12px; }
  .cap { width: 22px; height: 30px; border-radius: 11px; position: relative; cursor: pointer;
    border: 1px solid rgba(204,255,35,.5);
    background: radial-gradient(ellipse at 35% 30%, rgba(217,255,76,.5), rgba(11,11,11,.9) 70%);
    box-shadow: inset 0 0 8px rgba(204,255,35,.3), 0 0 8px rgba(204,255,35,.18);
    animation: capin .5s cubic-bezier(.34,1.56,.64,1); }
  .cap:hover { box-shadow: inset 0 0 8px rgba(204,255,35,.5), 0 0 16px rgba(204,255,35,.45); }
  @keyframes capin { from { transform: scale(0) translateY(10px); } }

  /* dock toggles + whisper line */
  #dock { position: fixed; bottom: 18px; left: 22px; display: flex; gap: 14px; z-index: 20;
    font-size: 9.5px; letter-spacing: .2em; }
  #dock span { cursor: pointer; opacity: .45; }
  #dock span.on { color: var(--lime); opacity: 1; }
  #ask { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
    width: min(430px, 50vw); z-index: 20; }
  #ask input { width: 100%; background: transparent; border: 0; outline: 0; text-align: center;
    border-bottom: 1px solid rgba(246,242,235,.18); padding: 7px 2px;
    font-family: var(--font-mono); font-size: 11.5px; letter-spacing: .07em; color: var(--bone); }
  #ask input::placeholder { color: rgba(246,242,235,.26); }
  #ask input:focus { border-bottom-color: rgba(204,255,35,.6); }

  /* Moshi, resident */
  #moshi { position: fixed; bottom: 206px; left: 18px; width: 122px; height: 110px;
    z-index: 21; cursor: pointer; }
  .moshi-canvas { position: absolute; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated; }
  .moshi-face { position: absolute; left: 50%; top: 42%; pointer-events: none;
    transform: translate(-50%, -50%); display: flex; gap: .55em; align-items: center;
    font-family: var(--font-display); font-weight: 900; color: var(--bone);
    transition: gap .3s, color .25s; }
  .moshi-face span { display: inline-block; transition: transform .2s;
    transform: scaleY(var(--eyeY, 1)); }
  .moshi-face.blink span { transform: scaleY(0.12); }
  .moshi-face.wide span { transform: scaleY(1.4); }


  /* ── Y2K CONSOLE — house style v2 (see design-lab/HOUSE_STYLE.md) ──
     chunky plastic game-menu chrome: bevels, block shadows, segmented
     meters, press states, bounce. No scanlines — wrong decade. */
  .slabpanel, .lhead, .lbody, #topbar {
    background-image: radial-gradient(rgba(204,255,35,.04) 1px, transparent 1.01px);
    background-size: 3px 3px; }
  .slabpanel, .lhead, .lbody { border-radius: 10px;
    box-shadow: 0 0 0 2px #1d2010, 0 3px 0 #000, inset 0 1px 0 rgba(246,242,235,.07); }
  #topbar { box-shadow: 0 3px 0 #000, inset 0 -1px 0 rgba(246,242,235,.05); }
  .clip { border-radius: 8px; border-width: 2px; box-shadow: 0 2px 0 rgba(0,0,0,.85); }
  .pill, #recchip, .ghost { border-radius: 9px; border-width: 2px;
    box-shadow: 0 2px 0 #000; transition: transform .08s, box-shadow .08s; }
  .pill:active, #recchip:active, .ghost:active { transform: translateY(2px); box-shadow: 0 0 0 #000; }
  .badge { border-radius: 7px; box-shadow: 0 2px 0 #5d7607; }
  .deed { border-radius: 9px; border-width: 2px; box-shadow: 0 2px 0 #000;
    animation: din .45s cubic-bezier(.34,1.56,.64,1); }
  body.rec #recchip { box-shadow: 0 2px 0 #5d7607;
    animation: recbounce .5s cubic-bezier(.34,1.56,.64,1) infinite alternate; }
  @keyframes recbounce { from { transform: scale(1); } to { transform: scale(1.1); } }
  /* segmented meters — SSX boost-bar language */
  .prow .track { height: 10px; border-radius: 3px; background: #0a0a09;
    box-shadow: inset 0 0 0 1px #1d2010; }
  .prow .track i { border-radius: 2px; box-shadow: none;
    background: repeating-linear-gradient(90deg, var(--lime) 0 6px, #0e0e0d 6px 8px); }
  .prow .track u { border-radius: 2px; width: 6px; height: 16px; box-shadow: 0 2px 0 #000; }
  .lhead .vol { height: 8px; border-radius: 2px; }
  .lhead .vol i { box-shadow: none;
    background: repeating-linear-gradient(90deg, var(--lime) 0 4px, #0e0e0d 4px 6px); }
  #sect { font-family: var(--font-display); font-weight: 900; font-size: 14px;
    letter-spacing: .06em; transform: skewX(-6deg); }
  #wordmark b { text-shadow: none; }

  /* ── Y2K PLATE PASS (HOUSE_STYLE v2.2): less modern app, more 2000s game menu.
     Plastic gloss (hard two-stop), skewed lime title plates, boxed numerals. ── */
  .plate { display: inline-block; transform: skewX(-12deg);
    background: var(--lime); color: var(--ink);
    font-family: var(--font-display); font-weight: 900; font-style: italic;
    font-size: 11px; letter-spacing: .05em; padding: 4px 12px 3px; opacity: 1;
    border-radius: 3px; box-shadow: 0 3px 0 #000, inset 0 1px 0 rgba(255,255,255,.4);
    text-transform: uppercase; }

  .slabpanel, .lhead, #topbar { background-image:
      linear-gradient(180deg, rgba(246,242,235,.06) 0 44%, rgba(0,0,0,.30) 44% 100%),
      radial-gradient(rgba(204,255,35,.04) 1px, transparent 1.01px);
    background-size: 100% 100%, 3px 3px; }
  .ptitle { opacity: .9; display: flex; align-items: center; gap: 8px; }
  .prow .val { width: 36px; font-size: 12px; background: #060606; border-radius: 4px;
    padding: 3px 5px; box-shadow: inset 0 1px 2px #000, inset 0 -1px 0 rgba(246,242,235,.06);
    text-align: right; }
  .ghost, .badge, #recchip { background-image:
    linear-gradient(180deg, rgba(255,255,255,.10) 0 45%, rgba(0,0,0,.22) 45% 100%); }
  #wordmark { transform: skewX(-10deg); background: var(--lime); padding: 3px 13px 2px;
    border-radius: 3px; box-shadow: 0 3px 0 #000, inset 0 1px 0 rgba(255,255,255,.4); }
  #wordmark, #wordmark b { color: var(--ink); }

  /* ── KNOBS (hardware, not long sliders) ── */
  .kdeck { display: flex; gap: 18px; align-items: flex-end; margin: 4px 0 6px; }
  .kcell { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .knob { width: 38px; height: 38px; border-radius: 50%; position: relative; cursor: ns-resize;
    background: radial-gradient(circle at 35% 30%, #2a2c20, #101110 64%, #050505 100%);
    box-shadow: 0 3px 0 #000, inset 0 1px 0 rgba(246,242,235,.16), 0 0 0 2px #1d2010; }
  .knob i { position: absolute; left: 50%; top: 4px; width: 3px; height: 11px; margin-left: -1.5px;
    background: var(--lime); border-radius: 2px; transform-origin: 50% 15px; opacity: .9; }
  .klbl { font-size: 8.5px; letter-spacing: .16em; opacity: .55; }
  .kval { font-size: 11px; opacity: .75; }

  /* ── HUD DECLUTTER: translucent panels, outline plates, dimmer lime ── */
  .slabpanel { background-color: rgba(13,13,12,.62); }
  .lhead { background-color: rgba(13,13,12,.55); }
  .lbody { background-color: rgba(10,10,9,.42); }
  #topbar { background-color: rgba(13,13,12,.78); }
  .plate, #wordmark { background: rgba(204,255,35,.13); color: var(--lime);
    border: 1px solid rgba(204,255,35,.45); box-shadow: 0 2px 0 rgba(0,0,0,.6); }
  #wordmark b { color: var(--lime); }
  .clip { border-color: rgba(204,255,35,.20); }
  .clip canvas { opacity: .45; }
  .lhead .vol i { opacity: .65; }
  .deed { background: rgba(11,11,11,.55); border-color: rgba(204,255,35,.22); }
  .lhead .nm { font-style: italic; }
  .lbody, .clip { background-image:
    linear-gradient(180deg, rgba(246,242,235,.03) 0 40%, rgba(0,0,0,.18) 40% 100%); }

  #phead { box-shadow: none; }
  #moshi { image-rendering: pixelated; }

  /* THE PS2 SIGNAL CHAIN (HOUSE_STYLE v2.1) — one cable for every surface:
     soft 2000s AA + 16-step posterize over DOM and GL alike. html.raw = A/B. */
  * { -webkit-font-smoothing: antialiased; }
  body { filter: url(#ps2signal); }
  html.raw body { filter: none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:fixed" aria-hidden="true"><filter id="ps2signal"
  x="-2%" y="-2%" width="104%" height="104%" color-interpolation-filters="sRGB">
  <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="halo"/>
  <feComponentTransfer in="halo" result="halo2"><feFuncA type="linear" slope="0.40"/></feComponentTransfer>
  <feMerge result="glowed"><feMergeNode in="halo2"/><feMergeNode in="SourceGraphic"/></feMerge>
  <feGaussianBlur in="glowed" stdDeviation="0.5"/>
  <feComponentTransfer>
    <feFuncR type="discrete" tableValues="0 0.0667 0.1333 0.2 0.2667 0.3333 0.4 0.4667 0.5333 0.6 0.6667 0.7333 0.8 0.8667 0.9333 1"/>
    <feFuncG type="discrete" tableValues="0 0.0667 0.1333 0.2 0.2667 0.3333 0.4 0.4667 0.5333 0.6 0.6667 0.7333 0.8 0.8667 0.9333 1"/>
    <feFuncB type="discrete" tableValues="0 0.0667 0.1333 0.2 0.2667 0.3333 0.4 0.4667 0.5333 0.6 0.6667 0.7333 0.8 0.8667 0.9333 1"/>
  </feComponentTransfer>
</filter></svg>

<div id="roomheat"></div>

<div id="topbar">
  <div id="wordmark" class="disp">M<b>O</b>SH</div>
  <div id="transport" class="mono">
    <button id="playbtn" title="play/pause">▶</button>
    <span id="tc">BAR 1.1 · 0:00.0</span>
    <span style="opacity:.5">120 BPM</span>
    <span id="sect" style="color:var(--lime)">VERSE 1</span>
  </div>
  <div id="recchip" class="mono">● REC (R)</div>
</div>

<div id="deeds"></div>

<div id="arrange">
  <div id="ruler"></div>
  <div id="lanes"></div>
  <div id="phead"></div>
  <div id="pulse"></div>
</div>

<div class="slabpanel shown" id="chain">
  <div class="ptitle"><span class="plate">CHAIN</span> <b id="chainTrack">VOX</b></div>
  <div class="kdeck">
    <div class="kcell"><div class="knob" data-kn="0.68"><i></i></div><span class="klbl">NAM</span><span class="kval mono">68</span></div>
    <div class="kcell"><div class="knob" data-kn="1.0"><i></i></div><span class="klbl">MIX</span><span class="kval mono">100</span></div>
  </div>
  <div class="meta"><span class="badge">TIER A</span><span class="ghost">LAB</span><span class="mono" style="opacity:.45">0.0 ms</span></div>
</div>

<div class="slabpanel shown" id="rack">
  <div class="ptitle"><span class="plate">THE RACK</span> <b>RE-IMAGINE</b> · tone-147</div>
  <div class="kdeck">
    <div class="kcell"><div class="knob" data-kn="0.62"><i></i></div><span class="klbl">GRIT</span><span class="kval mono">62</span></div>
    <div class="kcell"><div class="knob" data-kn="0.18"><i></i></div><span class="klbl">AIR</span><span class="kval mono">18</span></div>
    <div class="kcell"><div class="knob" data-kn="0.07"><i></i></div><span class="klbl">EPIC</span><span class="kval mono">07</span></div>
  </div>
  <div class="meta"><span class="badge" id="dirty">DIRTY</span><span class="mono" style="opacity:.45">seed 3</span>
    <span class="ghost" id="render">RENDER</span><span class="ghost">↻ SEED</span></div>
  <div id="capsules"></div>
</div>

<div id="dock" class="mono"><span id="tgChain" class="on">CHAIN</span><span id="tgRack" class="on">THE RACK</span></div>
<div id="ask"><input id="cmd" placeholder="tell moshi — “punch me in after the hook”" autocomplete="off" /></div>
<div id="moshi"></div>

<script>
// POSSESSION — the shipping UI's exact skeleton (topbar / ruler / lanes / clips /
// chain / generative drawer), re-materialized per the field notes:
//   panels   = ink slabs with lume seams, eaten open (kaolti / hours)
//   playhead = lume line w/ spectral whisper + a traveling pressure pulse (marioecg)
//   takes    = glass capsules budded off the render rack (techartist_ / Jaenam97)
//   rack     = parameter poetry, mono + tabular (lukasspitter / BlousonRouge)
//   deeds    = every agent action visible + poppable (constraint #2)
//   Moshi    = resident, breathing; recording is an ember, the room runs hot.
// Same MoshOps commands under every control — this is a SKIN, the seam is untouched.

const BPM = 120, BARS = 16, SONG_S = (BARS * 4) * 60 / BPM;
const SECTIONS = ['INTRO','VERSE 1','HOOK','VERSE 2','HOOK','BRIDGE','HOOK','OUT'];
let playing = true, rec = false, tPos = 0.04;

// ---- lanes + clips (mirrors shot_consolidated's session) ----
const LANES = [
  { nm: 'VOX', clips: [{ a: .01, b: .14, n: 'take 4 · kept', rl: 0 }, { a: .30, b: .42, n: 'hook comp', rl: 1 }] },
  { nm: 'GTR', clips: [{ a: .06, b: .26, n: 'tone-131', rl: 1 }] },
  { nm: 'PAD', clips: [{ a: .02, b: .22, n: 'tone-196', rl: 0 }, { a: .48, b: .60, n: 'swell', rl: 0 }] },
];
const ruler = document.getElementById('ruler');
for (let i = 0; i < BARS; i++) ruler.insertAdjacentHTML('beforeend', `<span class="mono">${i}</span>`);
const lanesEl = document.getElementById('lanes');
for (const L of LANES) {
  const lane = document.createElement('div');
  lane.className = 'lane';
  lane.innerHTML = `<div class="lhead"><div class="nm disp">${L.nm}</div>
      <div class="ms">M&ensp;S</div><div class="vol"><i></i></div></div>
    <div class="lbody"></div>`;
  const body = lane.querySelector('.lbody');
  for (const c of L.clips) {
    const el = document.createElement('div');
    el.className = 'clip';
    el.style.left = (c.a * 100) + '%';
    el.style.width = ((c.b - c.a) * 100) + '%';
    el.innerHTML = `<span class="cn mono">${c.n.toUpperCase()}</span>${c.rl ? '<span class="rl">RL</span>' : ''}<canvas></canvas>`;
    body.appendChild(el);
    c.el = el;
    // waveform squiggle, lime dust style
    requestAnimationFrame(() => {
      const cv = el.querySelector('canvas'), g = cv.getContext('2d');
      cv.width = cv.offsetWidth * 2; cv.height = 52;
      g.fillStyle = 'rgba(204,255,35,.75)';
      for (let x = 0; x < cv.width; x += 3) {
        const h = (Math.abs(Math.sin(x * .07 + c.a * 40)) * .7 + Math.random() * .3) * 40;
        g.fillRect(x, 26 - h / 2, 1.6, h);
      }
    });
  }
  lanesEl.appendChild(lane);
}

// ---- deeds (constraint #2, fed by the same JSONL that already exists) ----
const deedsEl = document.getElementById('deeds');
function deed(text) {
  const d = document.createElement('div');
  d.className = 'deed';
  d.innerHTML = `<em>✓</em> ${text} <button>×</button>`;
  d.querySelector('button').onclick = () => {
    d.firstElementChild.textContent = '↺';
    setTimeout(() => d.classList.add('bye'), 600);
    setTimeout(() => d.remove(), 1700);
  };
  deedsEl.prepend(d);
  if (typeof moshi !== 'undefined') moshi.pulse(0.4);
  while (deedsEl.children.length > 4) deedsEl.lastElementChild.remove();
  setTimeout(() => { if (d.isConnected) { d.classList.add('bye'); setTimeout(() => d.remove(), 1200); } }, 8000);
}

// ---- Moshi, resident: the 3D component (canonical copy lives in 010) ----
function MoshiBlob(host, opts = {}) {
  const seed = opts.seed ?? Math.random() * 10;
  const cv = document.createElement('canvas');
  cv.className = 'moshi-canvas';
  host.appendChild(cv);

  const FRAG = `
precision highp float;
uniform vec2  u_res;
uniform float u_t, u_tq, u_seed;
uniform float u_arousal, u_heat, u_squash, u_gasp;
uniform float u_eyeStyle, u_blink, u_wide;
uniform vec2  u_gaze;
const vec3 LIME = vec3(0.800, 1.000, 0.137);
const vec3 GLOW = vec3(0.851, 1.000, 0.298);
float hash31(vec3 p){ p=fract(p*0.3183099+vec3(.1,.2,.3)); p*=17.0;
  return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float noise3(vec3 p){ vec3 i=floor(p), f=fract(p); vec3 u=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash31(i),hash31(i+vec3(1,0,0)),u.x),
                 mix(hash31(i+vec3(0,1,0)),hash31(i+vec3(1,1,0)),u.x),u.y),
             mix(mix(hash31(i+vec3(0,0,1)),hash31(i+vec3(1,0,1)),u.x),
                 mix(hash31(i+vec3(0,1,1)),hash31(i+vec3(1,1,1)),u.x),u.y),u.z); }
float smin(float a,float b,float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.);
  return mix(b,a,h)-k*h*(1.-h); }
float bayer(vec2 fc){ float b=mod(fc.x,2.0)*2.0+mod(fc.y,2.0); vec2 f2=floor(fc/2.0);
  return (b*4.0+mod(f2.x,2.0)*2.0+mod(f2.y,2.0))/16.0; }
float sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a;
  float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0); return length(pa-ba*h); }
float chevron(vec2 p, float flip){ p.x*=flip;          // +1 = '>'   -1 = '<'
  return min(sdSeg(p, vec2(-0.5, 0.62), vec2(0.5, 0.0)),
             sdSeg(p, vec2(-0.5,-0.62), vec2(0.5, 0.0))); }
float map(vec3 p){
  float sq = 1.0 - u_squash * 0.45;                 // squash & stretch, volume-ish
  p.y *= 1.0 / sq; p.x *= sq; p.z *= sq;
  float t = u_t * 0.8 + u_seed;
  vec3 q = p;
  float d = length(q) - 0.50 * (1.0 + 0.04 * sin(u_t * 1.3 + u_seed));
  d = smin(d, length(q - vec3( 0.33*sin(t*.50+1.0), 0.28*cos(t*.40),  0.14*sin(t*.60))) - 0.25, 0.26);
  d = smin(d, length(q - vec3(-0.36*sin(t*.35),     0.24*cos(t*.45+2.0), -0.12*cos(t*.30))) - 0.22, 0.26);
  d = smin(d, length(q - vec3( 0.20*cos(t*.30+4.0), -0.34*sin(t*.38),  0.16*sin(t*.45))) - 0.19, 0.26);
  d = smin(d, length(q - vec3(-0.15, 0.36*sin(t*.27+1.7), 0.10)) - 0.17, 0.26);
  float amp = mix(0.008, 0.13, u_arousal * u_arousal);
  d -= amp * (noise3(q * mix(3.0, 8.5, u_arousal) + u_tq) - 0.5) * 2.0;
  return d;
}
vec3 normalAt(vec3 p){ const vec2 e = vec2(.004,-.004);
  return normalize(e.xyy*map(p+e.xyy)+e.yyx*map(p+e.yyx)+e.yxy*map(p+e.yxy)+e.xxx*map(p+e.xxx)); }
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / min(u_res.x, u_res.y);
  float dth = bayer(gl_FragCoord.xy);
  vec3 ro = vec3(0.0, 0.0, 1.9);
  vec3 rd = normalize(vec3(uv, -1.45));
  float t = 0.0; vec3 hp; bool hit = false;
  for (int i = 0; i < 56; i++) {
    hp = ro + rd * t;
    float d = map(hp);
    if (d < 0.004) { hit = true; break; }
    t += d * 0.9;
    if (t > 4.0) break;
  }
  vec4 outc = vec4(0.0);
  if (hit) {
    vec3 n = normalAt(hp);
    n = normalize(floor(n * 3.0 + 0.5) / 3.0);        // FACETS - flat low-poly light
    float diff = max(dot(n, normalize(vec3(0.5, 0.8, 0.6))), 0.0);
    float band = floor(diff * 3.0 + dth) / 3.0;
    vec3 col = vec3(0.045) + band * vec3(0.065, 0.07, 0.06);
    float rim = pow(1.0 - max(dot(n, -rd), 0.0), 2.2);
    col += LIME * step(0.6, rim + dth * 0.22) * (0.16 + 0.25 * u_heat);
    // ember: banded heart, no halo
    float ember = u_heat * exp(-2.6 * length(hp)) * (0.7 + 0.3 * sin(u_t * 7.0));
    col += GLOW * (floor(ember * 3.0 + dth) / 3.0) * 0.45;
    // THE FACE LIVES IN THE BODY - decals evaluated on the hit direction,
    // lit by the same facet bands, edges dithered: they squash, blink, lean and
    // tremble WITH the matter instead of floating in front of it (no DOM face).
    float sq = 1.0 - u_squash * 0.45;
    vec3 nd = normalize(hp);
    // the mouth: a SMILE at rest; a poke (or a hard gasp) opens it to an O.
    {
      vec3 md = normalize(vec3(u_gaze.x * 0.26, (-0.30 + u_gaze.y * 0.15) * sq, 1.0));
      if (dot(nd, md) > 0.6) {
        vec3 mu = normalize(cross(vec3(0.0, 1.0, 0.0), md));
        vec3 mv = cross(md, mu);
        vec2 mo = vec2(dot(nd - md, mu), dot(nd - md, mv)) * 3.4;
        mo.y /= sq;                                     // the grin squashes too
        float oAmt = clamp(u_wide * 1.2 + u_gasp * 0.8, 0.0, 1.0);
        float r = 0.30 + 0.08 * u_heat + 0.10 * oAmt;
        float ring = abs(length(mo) - r) - (0.085 + 0.045 * u_heat + 0.04 * oAmt);
        float m = (1.0 - step(0.0, ring + (dth - 0.5) * 0.05))
                * step(mo.y, -0.05 + 1.4 * oAmt);       // lower arc -> full O
        col = mix(col, LIME * (0.75 + 0.30 * u_heat), m);
      }
    }
    float sep = 0.30 + 0.10 * u_arousal;               // wide-set when feral
    float jit = (noise3(vec3(u_tq * 3.0, u_seed, 1.0)) - 0.5) * 0.14
              * max(0.0, u_arousal - 0.35);            // feral tremble, on twos
    float eyeY = max(0.10,
      (1.0 + 0.35 * smoothstep(0.4, 1.0, u_heat) + 0.4 * u_wide)
      * (1.0 - u_blink * 0.92) * sq);                  // steep on REC, shut on blink
    vec3 eyeCol = mix(vec3(0.90, 0.93, 0.87), LIME, smoothstep(0.45, 0.75, u_heat));
    eyeCol *= 0.60 + 0.45 * band;                      // facet-lit like the hide
    for (int e = 0; e < 2; e++) {
      float s = (e == 0) ? -1.0 : 1.0;
      vec3 ed = normalize(vec3(s * sep + u_gaze.x * 0.22 + jit,
                               (0.20 + u_gaze.y * 0.16) * sq, 1.0));
      if (dot(nd, ed) < 0.6) continue;
      vec3 uu = normalize(cross(vec3(0.0, 1.0, 0.0), ed));
      vec3 vv = cross(ed, uu);
      vec2 o = vec2(dot(nd - ed, uu), dot(nd - ed, vv)) * 4.5;
      o.y /= eyeY;
      if (u_eyeStyle < 0.5) {                          // GLYPH - the brand brackets
        float ch = chevron(o * 1.6, -s);
        col = mix(col, eyeCol, 1.0 - step(0.20 + (dth - 0.5) * 0.10, ch));
      } else if (u_eyeStyle < 1.5) {                   // SOCKET - carved pit, lime pupil
        float so = length(o * vec2(1.0, 1.25)) - 0.56;
        col = mix(col, vec3(0.015), 1.0 - step(0.0, so));
        vec2 po = o - vec2(u_gaze.x, -u_gaze.y) * 0.16;
        col = mix(col, LIME * (0.7 + 0.3 * u_heat),
                  (1.0 - step(0.0, length(po) - 0.22)) * (1.0 - step(0.0, so)));
      }
    }
    if (u_eyeStyle > 1.5) {                            // VISOR - band, chevron cutouts
      vec3 fd = normalize(vec3(u_gaze.x * 0.20 + jit, (0.20 + u_gaze.y * 0.14) * sq, 1.0));
      if (dot(nd, fd) > 0.55) {
        vec3 uu = normalize(cross(vec3(0.0, 1.0, 0.0), fd));
        vec3 vv = cross(fd, uu);
        vec2 o = vec2(dot(nd - fd, uu), dot(nd - fd, vv)) * 4.5;
        float bm = (1.0 - step(0.40 * eyeY, abs(o.y))) * (1.0 - step(1.15, abs(o.x)));
        col = mix(col, vec3(0.02), bm);
        float ch = min(chevron((o - vec2(-0.52, 0.0)) * 1.7, 1.0),
                       chevron((o - vec2( 0.52, 0.0)) * 1.7, -1.0));
        col = mix(col, LIME * (0.75 + 0.25 * u_heat),
                  (1.0 - step(0.30 + (dth - 0.5) * 0.1, ch)) * bm);
      }
    }
    outc = vec4(col, 1.0);
  }
  gl_FragColor = outc;
}`;
  const VERT = 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }';
  const gl = cv.getContext('webgl', { antialias: false, alpha: true, premultipliedAlpha: false });
  if (!gl) {                       // context cap hit - a DOM face keeps the page alive
    const face = document.createElement('div');
    face.className = 'moshi-face';
    face.innerHTML = '<span>&gt;</span><span>&lt;</span>';
    face.style.opacity = '0.6';
    face.style.fontSize = Math.round(host.clientWidth * 0.17) + 'px';
    host.appendChild(face);
    return { el: host, set() {}, pulse() {}, poke() {} };
  }
  cv.addEventListener('webglcontextlost', e => e.preventDefault());
  cv.addEventListener('webglcontextrestored', () => location.reload());
  function sh(ty, src) {
    const s = gl.createShader(ty);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const al = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(al);
  gl.vertexAttribPointer(al, 2, gl.FLOAT, false, 0, 0);
  const U = {};
  for (const n of ['u_res','u_t','u_tq','u_seed','u_arousal','u_heat','u_squash','u_gasp','u_eyeStyle','u_blink','u_wide','u_gaze'])
    U[n] = gl.getUniformLocation(prog, n);

  function resize() {
    cv.width = Math.max(24, Math.floor(host.clientWidth / 3));   // chunky on purpose
    cv.height = Math.max(24, Math.floor(host.clientHeight / 3));
    gl.viewport(0, 0, cv.width, cv.height);
  }
  resize();
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(host);

  const P = { arousal: 0.08, heat: 0, gx: 0, gy: 0, eyeStyle: opts.eyeStyle ?? 0 };
  const cur = { arousal: 0.08, heat: 0 };
  const eye = { blink: 0, wide: 0 };
  let squash = 0, squashV = 0, tq = 0, lastTick = 0;
  const t0 = performance.now() + seed * 997;

  (function blink() {              // alive even when idle
    setTimeout(() => { eye.blink = 1; blink(); }, 1600 + Math.random() * 3800);
  })();

  function frame(now) {
    const t = (now - t0) / 1000;
    cur.arousal += (P.arousal - cur.arousal) * 0.06;
    cur.heat += (P.heat - cur.heat) * 0.07;
    // damped spring with overshoot - squash & stretch, never robotic
    squashV += (-squash * 0.16 - squashV * 0.14);
    squash += squashV;
    eye.blink *= 0.80; eye.wide *= 0.94;     // face state decays; the shader wears it
    if (t - lastTick > 1 / 12) { lastTick = t; tq = t; }   // wobble on twos
    const sqv = Math.max(-0.6, Math.min(0.85, squash));
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(U.u_res, cv.width, cv.height);
    gl.uniform1f(U.u_t, t); gl.uniform1f(U.u_tq, tq); gl.uniform1f(U.u_seed, seed);
    gl.uniform1f(U.u_arousal, cur.arousal);
    gl.uniform1f(U.u_heat, cur.heat);
    gl.uniform1f(U.u_squash, sqv);
    gl.uniform1f(U.u_gasp, Math.min(1, Math.abs(squashV) * 6));   // mouth gasps with impact
    gl.uniform1f(U.u_eyeStyle, P.eyeStyle);
    gl.uniform1f(U.u_blink, Math.min(1, eye.blink));
    gl.uniform1f(U.u_wide, Math.min(1, eye.wide));
    gl.uniform2f(U.u_gaze, P.gx, P.gy);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  return {
    el: host,
    set(p) { Object.assign(P, p); },
    pulse(amount = 0.55) {                                       // beat hit
      squashV += amount * 0.45;
      if (amount > 0.6 && Math.random() < 0.3) eye.blink = 1;    // hard hits jolt a blink
    },
    poke() {                                                      // indignant squish
      squashV += 0.95 * 0.45;
      eye.wide = 1;
      const a0 = P.arousal;
      P.arousal = Math.min(1, a0 + 0.45);
      setTimeout(() => { P.arousal = a0; }, 900);
    },
  };
}
const moshi = MoshiBlob(document.getElementById('moshi'), { seed: 7.4 });
document.getElementById('moshi').addEventListener('pointerdown', () => moshi.poke());
addEventListener('mousemove', e => {
  const r = moshi.el.getBoundingClientRect();
  const dx = (e.clientX - (r.left + r.width / 2)) / innerWidth;
  const dy = (e.clientY - (r.top + r.height / 2)) / innerHeight;
  moshi.set({ gx: Math.max(-1, Math.min(1, dx * 3)), gy: Math.max(-1, Math.min(1, dy * 3)) });
});

// ---- the loop: playhead line + peristaltic pulse through the lanes ----
const phead = document.getElementById('phead'), pulse = document.getElementById('pulse'),
      arrange = document.getElementById('arrange');
let recAmt = 0; const t0 = performance.now(); let last = t0;
function frame(now) {
  const t = (now - t0) / 1000, dt = Math.min(.05, (now - last) / 1000); last = now;
  if (playing) tPos = (tPos + dt / SONG_S) % 1;
  recAmt += ((rec ? 1 : 0) - recAmt) * .07;

  const beats = tPos * BARS * 4;
  tc.textContent = `BAR ${Math.floor(beats / 4) + 1}.${Math.floor(beats % 4) + 1} · ${(tPos * SONG_S).toFixed(1).padStart(5, '0')}s`;
  sect.textContent = SECTIONS[Math.floor(tPos * 8)];

  const headW = 150, w = arrange.clientWidth - headW;
  const px = headW + tPos * w;
  phead.style.left = px + 'px';
  const py = 22 + ((Math.sin(t * .6) * .5 + .5) * (arrange.clientHeight - 60));
  pulse.style.left = px + 'px';
  pulse.style.top = (arrange.clientHeight * .45) + 'px';

  // clips swell as the pulse passes through them — the song being digested
  for (const L of LANES) for (const c of L.clips) {
    const mid = headW + ((c.a + c.b) / 2) * w;
    const d = Math.abs(mid - px);
    const s = 1 + Math.max(0, .045 * (1 - d / 110));
    c.el.style.transform = `scaleY(${s})`;
    if (s > 1.012) c.el.style.borderColor = 'rgba(204,255,35,.8)';
    else c.el.style.borderColor = 'rgba(204,255,35,.35)';
  }

  moshi.set({ heat: recAmt, arousal: 0.12 + recAmt * 0.35 });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
deed('session restored · 3 tracks');
