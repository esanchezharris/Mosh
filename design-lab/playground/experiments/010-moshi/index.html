<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>010 · MOSHI — the agent as a 3D component</title>
<style>
  :root {
    --ink: #0B0B0B; --lime: #CCFF23; --lime-glow: #D9FF4C;
    --bone: #F6F2EB; --mist: #E5E5E1; --slab: #111110;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --font-display: "Archivo Black", "Helvetica Neue", -apple-system, "Arial Black", sans-serif;
  }
  html, body { margin: 0; height: 100%; background: #070707; overflow: hidden;
    font-family: var(--font-mono); color: var(--bone); }
  .mono { font-variant-numeric: tabular-nums; letter-spacing: .06em; }
  .disp { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; }
  #title { position: fixed; top: 18px; left: 20px; font-size: 11px; letter-spacing: .14em; opacity: .55; }
  #title b { font-family: var(--font-display); font-weight: 900; color: var(--lime); font-size: 12px; }
  #hint { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: .12em; opacity: .35; }

  #stage { position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; gap: 7vw; }
  .pedestal { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .pedestal .blobhost { position: relative; cursor: pointer; }
  .pedestal .lab { font-size: 9px; letter-spacing: .22em; opacity: .4; }

  /* Y2K console chrome (house style v2): plastic, bevels, bounce */
  #deck { position: fixed; bottom: 52px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 8px; align-items: center; }
  #deck button { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em;
    background: var(--slab); color: var(--bone); border: 2px solid #1d2010;
    border-radius: 9px; padding: 7px 14px; cursor: pointer;
    box-shadow: 0 3px 0 #000; transition: transform .08s, box-shadow .08s; }
  #deck button:hover { border-color: var(--lime); color: var(--lime); }
  #deck button:active { transform: translateY(3px); box-shadow: 0 0 0 #000; }
  #deck button.on { color: var(--ink); background: var(--lime); border-color: var(--lime);
    box-shadow: 0 3px 0 #5d7607; }
  #beat.on { animation: bb .5s cubic-bezier(.34,1.56,.64,1) infinite alternate; }
  @keyframes bb { to { transform: scale(1.07); } }

  /* the component's own bits */
  .moshi-canvas { position: absolute; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated; }
  .moshi-face { position: absolute; left: 50%; top: 42%; pointer-events: none;
    transform: translate(-50%, -50%); display: flex; gap: .55em; align-items: center;
    font-family: var(--font-display); font-weight: 900; color: var(--bone);
    transition: gap .3s; }
  .moshi-face span { display: inline-block; transition: transform .2s; }
  .moshi-face.blink span { transform: scaleY(0.12); }
  .moshi-face.wide span { transform: scaleY(1.4); }
</style>
</head>
<body>
<div id="title"><b>MOSHI</b>&ensp;010 · the agent as a 3D component — poke them</div>
<div id="stage">
  <div class="pedestal"><div class="blobhost" style="width:96px;height:88px"></div><div class="lab mono">CHIP · 96</div></div>
  <div class="pedestal"><div class="blobhost" style="width:170px;height:155px"></div><div class="lab mono">DOCK · 170</div></div>
  <div class="pedestal"><div class="blobhost" style="width:300px;height:270px"></div><div class="lab mono">STAGE · 300</div></div>
</div>
<div id="deck">
  <button data-s="calm" class="on">CALM</button>
  <button data-s="listening">LISTENING</button>
  <button data-s="recording">RECORDING</button>
  <button data-s="feral">FERAL</button>
  <button id="beat">♪ BEAT</button>
</div>
<div id="hint">it watches your cursor · click = poke · beat = squash &amp; stretch on twos</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// MoshiBlob — the agent as a 3D component (canonical copy; 008/009 carry pastes).
//   Mini raymarched SDF: five drifting lobes, smin-blended, arousal spikes.
//   House style v2: faceted normals (flat low-poly shading), Bayer band light,
//   quarter-res nearest, on-twos wobble. No bloom, no glow — band emission only.
//   Behaviors: idle breath · beat squash&stretch (damped spring) · cursor-tracking
//   eyes + blink · poke = deep squish + wide eyes · heat = ember core + hot mouth.
// API: const m = MoshiBlob(host); m.set({arousal, heat, gx, gy}); m.pulse(); m.poke()
// ─────────────────────────────────────────────────────────────────────────────
function MoshiBlob(host, opts = {}) {
  const seed = opts.seed ?? Math.random() * 10;
  const cv = document.createElement('canvas');
  cv.className = 'moshi-canvas';
  const face = document.createElement('div');
  face.className = 'moshi-face';
  face.innerHTML = '<span>&gt;</span><span>&lt;</span>';
  host.appendChild(cv); host.appendChild(face);

  const FRAG = `
precision highp float;
uniform vec2  u_res;
uniform float u_t, u_tq, u_seed;
uniform float u_arousal, u_heat, u_squash;
uniform vec2  u_gaze;
const vec3 LIME = vec3(0.800, 1.000, 0.137);
const vec3 GLOW = vec3(0.851, 1.000, 0.298);
float hash31(vec3 p){ p=fract(p*0.3183099+vec3(.1,.2,.3)); p*=17.0;
  return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float noise3(vec3 p){ vec3 i=floor(p), f=fract(p); vec3 u=f*f*(3.0-2.0*f);
  return mix(mix(mix(hash31(i),hash31(i+vec3(1,0,0)),u.x),
                 mix(hash31(i+vec3(0,1,0)),hash31(i+vec3(1,1,0)),u.x),u.y),
             mix(mix(hash31(i+vec3(0,0,1)),hash31(i+vec3(1,0,1)),u.x),
                 mix(hash31(i+vec3(0,1,1)),hash31(i+vec3(1,1,1)),u.x),u.y),u.z); }
float smin(float a,float b,float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.);
  return mix(b,a,h)-k*h*(1.-h); }
float bayer(vec2 fc){ float b=mod(fc.x,2.0)*2.0+mod(fc.y,2.0); vec2 f2=floor(fc/2.0);
  return (b*4.0+mod(f2.x,2.0)*2.0+mod(f2.y,2.0))/16.0; }
float map(vec3 p){
  float sq = 1.0 - u_squash * 0.45;                 // squash & stretch, volume-ish
  p.y *= 1.0 / sq; p.x *= sq; p.z *= sq;
  float t = u_t * 0.8 + u_seed;
  vec3 q = p;
  float d = length(q) - 0.50 * (1.0 + 0.04 * sin(u_t * 1.3 + u_seed));
  d = smin(d, length(q - vec3( 0.33*sin(t*.50+1.0), 0.28*cos(t*.40),  0.14*sin(t*.60))) - 0.25, 0.26);
  d = smin(d, length(q - vec3(-0.36*sin(t*.35),     0.24*cos(t*.45+2.0), -0.12*cos(t*.30))) - 0.22, 0.26);
  d = smin(d, length(q - vec3( 0.20*cos(t*.30+4.0), -0.34*sin(t*.38),  0.16*sin(t*.45))) - 0.19, 0.26);
  d = smin(d, length(q - vec3(-0.15, 0.36*sin(t*.27+1.7), 0.10)) - 0.17, 0.26);
  float amp = mix(0.008, 0.13, u_arousal * u_arousal);
  d -= amp * (noise3(q * mix(3.0, 8.5, u_arousal) + u_tq) - 0.5) * 2.0;
  return d;
}
vec3 normalAt(vec3 p){ const vec2 e = vec2(.004,-.004);
  return normalize(e.xyy*map(p+e.xyy)+e.yyx*map(p+e.yyx)+e.yxy*map(p+e.yxy)+e.xxx*map(p+e.xxx)); }
void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*u_res) / min(u_res.x, u_res.y);
  float dth = bayer(gl_FragCoord.xy);
  vec3 ro = vec3(0.0, 0.0, 1.9);
  vec3 rd = normalize(vec3(uv, -1.45));
  float t = 0.0; vec3 hp; bool hit = false;
  for (int i = 0; i < 56; i++) {
    hp = ro + rd * t;
    float d = map(hp);
    if (d < 0.004) { hit = true; break; }
    t += d * 0.9;
    if (t > 4.0) break;
  }
  vec4 outc = vec4(0.0);
  if (hit) {
    vec3 n = normalAt(hp);
    n = normalize(floor(n * 3.0 + 0.5) / 3.0);        // FACETS — flat low-poly light
    float diff = max(dot(n, normalize(vec3(0.5, 0.8, 0.6))), 0.0);
    float band = floor(diff * 3.0 + dth) / 3.0;
    vec3 col = vec3(0.045) + band * vec3(0.065, 0.07, 0.06);
    float rim = pow(1.0 - max(dot(n, -rd), 0.0), 2.2);
    col += LIME * step(0.6, rim + dth * 0.22) * (0.16 + 0.25 * u_heat);
    // the mouth — glossy lime decal, follows the gaze a little, opens with heat
    vec3 mdir = normalize(vec3(u_gaze.x * 0.30, -0.34 + u_gaze.y * 0.18, 1.0));
    float ang = acos(clamp(dot(normalize(hp), mdir), -1.0, 1.0));
    float mr = 0.30 + 0.14 * u_heat + 0.06 * u_squash;
    float mouth = smoothstep(mr, mr - 0.07, ang);
    col = mix(col, LIME * (0.78 + 0.30 * u_heat), mouth);
    // ember: banded heart, no halo
    float ember = u_heat * exp(-2.6 * length(hp)) * (0.7 + 0.3 * sin(u_t * 7.0));
    col += GLOW * (floor(ember * 3.0 + dth) / 3.0) * 0.55 * (1.0 - mouth);
    outc = vec4(col, 1.0);
  }
  gl_FragColor = outc;
}`;
  const VERT = 'attribute vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }';
  const gl = cv.getContext('webgl', { antialias: false, alpha: true, premultipliedAlpha: false });
  if (!gl) {                       // context cap hit — degrade to a face, keep the page alive
    face.style.opacity = '0.6';
    return { el: host, set() {}, pulse() {}, poke() {} };
  }
  cv.addEventListener('webglcontextlost', e => e.preventDefault());
  cv.addEventListener('webglcontextrestored', () => location.reload());
  function sh(ty, src) {
    const s = gl.createShader(ty);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog); gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const al = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(al);
  gl.vertexAttribPointer(al, 2, gl.FLOAT, false, 0, 0);
  const U = {};
  for (const n of ['u_res','u_t','u_tq','u_seed','u_arousal','u_heat','u_squash','u_gaze'])
    U[n] = gl.getUniformLocation(prog, n);

  function resize() {
    cv.width = Math.max(24, Math.floor(host.clientWidth / 3));   // chunky on purpose
    cv.height = Math.max(24, Math.floor(host.clientHeight / 3));
    gl.viewport(0, 0, cv.width, cv.height);
    face.style.fontSize = Math.round(host.clientWidth * 0.17) + 'px';
  }
  resize();
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(host);

  const P = { arousal: 0.08, heat: 0, gx: 0, gy: 0 };
  const cur = { arousal: 0.08, heat: 0 };
  let squash = 0, squashV = 0, tq = 0, lastTick = 0;
  const t0 = performance.now() + seed * 997;

  // blink: alive even when idle
  (function blink() {
    setTimeout(() => {
      face.classList.add('blink');
      setTimeout(() => { face.classList.remove('blink'); blink(); }, 110);
    }, 1600 + Math.random() * 3800);
  })();

  function frame(now) {
    const t = (now - t0) / 1000;
    cur.arousal += (P.arousal - cur.arousal) * 0.06;
    cur.heat += (P.heat - cur.heat) * 0.07;
    // damped spring with overshoot — squash & stretch, never robotic
    squashV += (-squash * 0.16 - squashV * 0.14);
    squash += squashV;
    if (t - lastTick > 1 / 12) { lastTick = t; tq = t; }   // wobble on twos
    // eyes ride the gaze
    face.style.transform =
      `translate(calc(-50% + ${(P.gx * 13).toFixed(1)}%), calc(-50% + ${(P.gy * 11).toFixed(1)}%))`;
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(U.u_res, cv.width, cv.height);
    gl.uniform1f(U.u_t, t); gl.uniform1f(U.u_tq, tq); gl.uniform1f(U.u_seed, seed);
    gl.uniform1f(U.u_arousal, cur.arousal);
    gl.uniform1f(U.u_heat, cur.heat);
    gl.uniform1f(U.u_squash, Math.max(-0.6, Math.min(0.85, squash)));
    gl.uniform2f(U.u_gaze, P.gx, P.gy);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  return {
    el: host,
    set(p) { Object.assign(P, p); },
    pulse(amount = 0.55) { squashV += amount * 0.45; },          // beat hit
    poke() {                                                      // indignant squish
      squashV += 0.95 * 0.45;
      face.classList.add('wide');
      setTimeout(() => face.classList.remove('wide'), 450);
      const a0 = P.arousal;
      P.arousal = Math.min(1, a0 + 0.45);
      setTimeout(() => { P.arousal = a0; }, 900);
    },
  };
}

// ── workbench ──
const blobs = [...document.querySelectorAll('.blobhost')].map((h, i) =>
  MoshiBlob(h, { seed: i * 3.7 + 1 }));
blobs.forEach(b => b.el.addEventListener('pointerdown', () => b.poke()));

const STATES = {
  calm: { arousal: 0.08, heat: 0 },
  listening: { arousal: 0.30, heat: 0.10 },
  recording: { arousal: 0.45, heat: 1.0 },
  feral: { arousal: 1.0, heat: 0.35 },
};
document.querySelectorAll('#deck button[data-s]').forEach(btn =>
  btn.addEventListener('click', () => {
    document.querySelectorAll('#deck button[data-s]').forEach(b =>
      b.classList.toggle('on', b === btn));
    blobs.forEach(b => b.set(STATES[btn.dataset.s]));
  }));

// every blob watches your cursor
addEventListener('mousemove', e => {
  for (const b of blobs) {
    const r = b.el.getBoundingClientRect();
    const dx = (e.clientX - (r.left + r.width / 2)) / innerWidth;
    const dy = (e.clientY - (r.top + r.height / 2)) / innerHeight;
    b.set({ gx: Math.max(-1, Math.min(1, dx * 3)), gy: Math.max(-1, Math.min(1, dy * 3)) });
  }
});

// the beat
let beatOn = false, beatTimer = null;
const beatBtn = document.getElementById('beat');
beatBtn.addEventListener('click', () => {
  beatOn = !beatOn;
  beatBtn.classList.toggle('on', beatOn);
  clearInterval(beatTimer);
  if (beatOn) {
    let n = 0;
    beatTimer = setInterval(() => {
      blobs.forEach(b => b.pulse(n % 4 === 0 ? 0.8 : 0.4));
      n++;
    }, 500);                                          // 120 bpm
  }
});
</script>
</body>
</html>
