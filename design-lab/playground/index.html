<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MOSHI — the lookbook</title>
<style>
  /* NANUM SQUARE ROUND — the display voice (user-supplied; OFL, Naver). */
  @font-face { font-family: 'NanumSquareRound'; font-weight: 800;
    src: url('fonts/nanum-square-round/NanumSquareRoundEB.ttf') format('truetype'); }
  @font-face { font-family: 'NanumSquareRound'; font-weight: 700;
    src: url('fonts/nanum-square-round/NanumSquareRoundB.ttf') format('truetype'); }

  :root {
    --ink: #0B0B0B; --lime: #CCFF23; --lime-glow: #D9FF4C;
    --bone: #F6F2EB; --mist: #E5E5E1;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;
    --font-display: 'NanumSquareRound', "Archivo Black", "Helvetica Neue", -apple-system, "Arial Black", sans-serif;
  }
  html, body { margin: 0; height: 100%; background: #070707; overflow: hidden;
    font-family: var(--font-mono); color: var(--bone); }
  .mono { font-variant-numeric: tabular-nums; letter-spacing: .06em; }
  .disp { font-family: var(--font-display); font-weight: 800; letter-spacing: .02em;
    text-transform: uppercase; }

  /* THE STAGE — he is the page. everything else whispers at the edges. */
  #stage { position: fixed; inset: 0; }

  #wordmark { position: fixed; top: 16px; left: 18px; z-index: 10;
    transform: skewX(-10deg); font-size: 15px;
    background: rgba(204,255,35,.13); color: var(--lime);
    border: 1px solid rgba(204,255,35,.45); border-radius: 3px;
    padding: 3px 13px 2px; box-shadow: 0 2px 0 rgba(0,0,0,.6); }

  .chip { position: fixed; z-index: 10; cursor: pointer;
    font-size: 9.5px; letter-spacing: .14em; opacity: .55;
    border: 2px solid rgba(246,242,235,.2); border-radius: 9px; padding: 4px 12px;
    background-image: linear-gradient(180deg, rgba(255,255,255,.10) 0 45%, rgba(0,0,0,.22) 45% 100%);
    box-shadow: 0 3px 0 #000, inset 0 1px 0 rgba(246,242,235,.10);
    transition: transform .08s, box-shadow .08s; }
  .chip:hover { border-color: var(--lime); color: var(--lime); opacity: 1; }
  .chip:active { transform: translateY(3px); box-shadow: 0 0 0 #000; }
  #signal { top: 18px; right: 18px; }
  #res    { top: 18px; right: 132px; }
  #style  { top: 18px; right: 246px; }
  #anat   { top: 18px; right: 372px; }

  /* THE LOOKBOOK plate — number, name, state, caption */
  #plate { position: fixed; left: 50%; bottom: 46px; transform: translateX(-50%);
    z-index: 10; text-align: center; pointer-events: none; width: min(560px, 86vw); }
  #pnum { font-size: 9px; letter-spacing: .26em; opacity: .45; margin-bottom: 6px; }
  #pname { display: inline-block; transform: skewX(-12deg);
    font-family: var(--font-display); font-weight: 800; font-style: italic;
    font-size: 22px; letter-spacing: .05em; text-transform: uppercase;
    background: rgba(204,255,35,.13); color: var(--lime);
    border: 1px solid rgba(204,255,35,.45); border-radius: 3px;
    padding: 5px 18px 4px; box-shadow: 0 3px 0 rgba(0,0,0,.6);
    transition: opacity .25s; }
  #pcap { margin-top: 8px; font-size: 10px; letter-spacing: .10em; opacity: .55;
    line-height: 1.6; transition: opacity .25s; }

  #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    z-index: 10; font-size: 9px; letter-spacing: .16em; opacity: .30;
    white-space: nowrap; }

  /* state + pose chips — the agent's repertoire, not style sliders */
  #states, #poses { position: fixed; bottom: 18px; z-index: 10;
    display: flex; flex-direction: column; gap: 6px; }
  #states { left: 18px; }
  #poses  { left: 132px; }
  #states .st, #poses .st { cursor: pointer; font-size: 8.5px; letter-spacing: .18em;
    color: rgba(246,242,235,.5); border: 1px solid rgba(246,242,235,.16);
    border-radius: 8px; padding: 4px 10px; width: 86px; text-align: left;
    background: rgba(11,11,11,.4); box-shadow: 0 2px 0 rgba(0,0,0,.7);
    transition: transform .08s; }
  #states .st:hover, #poses .st:hover { color: var(--lime); border-color: rgba(204,255,35,.5); }
  #states .st:active, #poses .st:active { transform: translateY(2px); }
  #states .st.on, #poses .st.on { color: var(--ink); background: var(--lime);
    border-color: var(--lime); font-weight: 700; }
  .raillbl2 { font-size: 7.5px; letter-spacing: .22em; opacity: .35; margin-bottom: 2px; }

  /* the presence orb — the SAME component at coat-pocket size */
  #mini { position: fixed; right: 22px; bottom: 22px; width: 76px; height: 76px;
    z-index: 10; opacity: .9; }
  #minilbl { position: fixed; right: 22px; bottom: 8px; width: 76px; z-index: 10;
    font-size: 7px; letter-spacing: .16em; opacity: .3; text-align: center; }

  .arrow { position: fixed; top: 50%; transform: translateY(-50%); z-index: 10;
    font-size: 26px; color: var(--lime); opacity: .18; cursor: pointer;
    padding: 18px 14px; user-select: none; transition: opacity .2s; }
  .arrow:hover { opacity: .8; }
  #prev { left: 8px; } #next { right: 8px; }

  /* THE PS2 SIGNAL CHAIN — the cable carries the CHROME. html.raw = A/B.
     ONE glow source: never add text-shadows on top of this.
     The canvases live OUTSIDE the filtered subtree: a filter wrapping an
     every-frame-animating canvas re-rasterizes the whole page through the
     blur+posterize chain per frame (Chromium only caches filtered subtrees
     that hold still); the GL world carries its own crunch in-shader. */
  * { -webkit-font-smoothing: antialiased; }
  #chrome { position: fixed; inset: 0; z-index: 10; pointer-events: none;
    filter: url(#ps2signal); }
  html.raw #chrome { filter: none; }
  #chrome .chip, #chrome .arrow, #chrome #states .st { pointer-events: auto; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:fixed" aria-hidden="true"><filter id="ps2signal"
  x="0%" y="0%" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="halo"/>
  <feComponentTransfer in="halo" result="halo2"><feFuncA type="linear" slope="0.40"/></feComponentTransfer>
  <feMerge result="glowed"><feMergeNode in="halo2"/><feMergeNode in="SourceGraphic"/></feMerge>
  <feGaussianBlur in="glowed" stdDeviation="0.5"/>
  <feComponentTransfer>
    <feFuncR type="discrete" tableValues="0 0.0667 0.1333 0.2 0.2667 0.3333 0.4 0.4667 0.5333 0.6 0.6667 0.7333 0.8 0.8667 0.9333 1"/>
    <feFuncG type="discrete" tableValues="0 0.0667 0.1333 0.2 0.2667 0.3333 0.4 0.4667 0.5333 0.6 0.6667 0.7333 0.8 0.8667 0.9333 1"/>
    <feFuncB type="discrete" tableValues="0 0.0667 0.1333 0.2 0.2667 0.3333 0.4 0.4667 0.5333 0.6 0.6667 0.7333 0.8 0.8667 0.9333 1"/>
  </feComponentTransfer>
</filter></svg>

<div id="stage"></div>
<div id="mini"></div>

<div id="chrome">
  <div id="wordmark" class="disp">MOSHI · LOOKBOOK</div>
  <div id="anat" class="chip mono" title="anatomy: A = 3D blob w/ flat emotes · B = always volumetric · C = sea-star max contrast">ANAT·A</div>
  <div id="style" class="chip mono">STYLE·TOON</div>
  <div id="res" class="chip mono">RES·PS2+</div>
  <div id="signal" class="chip mono">SIGNAL·PS2</div>

  <div class="arrow" id="prev" title="previous look">◀</div>
  <div class="arrow" id="next" title="next look">▶</div>

  <div id="states">
    <div class="raillbl2 mono">STATE</div>
  </div>
  <div id="poses">
    <div class="raillbl2 mono">POSE</div>
  </div>

  <div id="plate">
    <div id="pnum" class="mono">LOOK 01 / 12</div>
    <div id="pname" class="disp">TAR</div>
    <div id="pcap" class="mono"></div>
  </div>
  <div id="hint" class="mono">◀ ▶ THE LOOKBOOK · R = REROLL · C = TAKE LANDS · CLICK = POKE · HOLD = PET · DRAG = SPIN</div>
  <div id="minilbl" class="mono">SAME GUY · 76PX</div>
</div>

<script src="moshi.js"></script>
<script>
// THE LOOKBOOK — a curated, captioned walk through who Moshi can be:
// personality × state × seed, numbered like a catalog. Scroll/arrows turn
// pages; the state chips re-pose the current look; R rerolls inside the
// family. Curation over sliders: every page is an opinion.
const LOOKS = [
  { p: 'TAR',       sd: 0.500, st: 'IDLE',      cap: 'THE CANONICAL — everyone starts here. obsidian, lime-veined.' },
  { p: 'TAR',       sd: 0.500, st: 'RECORDING', cap: 'REC lives in the face: ember + hot eyes. the matter never flinches.' },
  { p: 'DISCO',     sd: 0.500, st: 'LISTENING', cap: 'the flow runs through him while the track plays. he nods.' },
  { p: 'MOLTEN',    sd: 0.500, st: 'IDLE',      cap: 'heavy gold. the patience of a planet.' },
  { p: 'GHOST',     sd: 0.500, st: 'PAUSED',    cap: 'held breath — lids low, eyes down. the world can wait.' },
  { p: 'SILK',      sd: 0.500, st: 'SLEEPING',  cap: 'pearl at rest. the waves slow to tide.' },
  { p: 'BREAKS',    sd: 0.500, st: 'RECORDING', cap: 'punched in and running hot.' },
  { p: 'CHROME',    sd: 0.500, st: 'RENDERING', cap: 'cooking — the work churns under the skin as light.' },
  { p: 'BUBBLE',    sd: 0.500, st: 'IDLE',      cap: 'poke him. you know you want to.' },
  { p: 'PORCELAIN', sd: 0.500, st: 'IDLE',      cap: 'the paper look: bone body, ink eyes. lime keeps the grin.' },
  { p: 'DISCO',     sd: 0.870, st: 'IDLE',      cap: 'same family, different child — R rerolls inside the lines.' },
  { p: 'TAR',       sd: 0.500, st: 'LISTENING', cap: 'even obsidian moves when the music is on.' },
];

// the user's frontrunner settings (2026-06-12): TOON style at PS2+ res,
// the chrome on the PS2 signal cable
const stage = Moshi(document.getElementById('stage'), {
  personality: LOOKS[0].p, seed: LOOKS[0].sd, room: true,
  quality: 'ps2+', style: 'toon',
});
const mini = Moshi(document.getElementById('mini'), {
  personality: LOOKS[0].p, seed: LOOKS[0].sd, interactive: false,
  resDiv: 2, maxW: 96, maxH: 96, style: 'toon',
});
mini.set('mood', 0.7);

const pnum = document.getElementById('pnum'), pname = document.getElementById('pname'),
      pcap = document.getElementById('pcap');
let idx = 0, seed = LOOKS[0].sd;

// state chips
const statesEl = document.getElementById('states');
const stBtns = {};
for (const s of Moshi.STATES) {
  const b = document.createElement('button');
  b.className = 'st mono';
  b.textContent = s;
  b.onclick = () => { setLookState(s); };
  statesEl.appendChild(b);
  stBtns[s] = b;
}
// pose chips — browse the body's vocabulary on any look
const posesEl = document.getElementById('poses');
for (const p of Moshi.POSES) {
  const b = document.createElement('button');
  b.className = 'st mono';
  b.textContent = p.replace('_', ' ');
  b.onclick = () => { stage.setPose(p, 3); mini.setPose(p, 3); };
  posesEl.appendChild(b);
}
function setLookState(s) {
  stage.setState(s); mini.setState(s);
  for (const k in stBtns) stBtns[k].classList.toggle('on', k === s);
  pnum.textContent = `LOOK ${String(idx + 1).padStart(2, '0')} / ${LOOKS.length} · ${s}`;
}

function show(snap) {
  const L = LOOKS[idx];
  pname.style.opacity = 0; pcap.style.opacity = 0;
  setTimeout(() => {
    pname.textContent = L.p;
    pcap.textContent = L.cap + `   ·   SEED ${seed.toFixed(3)}`;
    pname.style.opacity = 1; pcap.style.opacity = 1;
  }, 200);
  stage.setPersonality(L.p, seed, snap ? { snap: true } : undefined);
  mini.setPersonality(L.p, seed, snap ? { snap: true } : undefined);
  setLookState(L.st);
}
function go(d) {
  idx = ((idx + d) % LOOKS.length + LOOKS.length) % LOOKS.length;
  seed = LOOKS[idx].sd;
  show(false);
}
document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key.toLowerCase() === 'r') { seed = Math.random(); show(false); }
  if (e.key.toLowerCase() === 'c') { stage.celebrate(); mini.celebrate(); }
});
let wheelLock = 0;
addEventListener('wheel', e => {
  const now = performance.now();
  if (now < wheelLock || Math.abs(e.deltaY) < 12) return;
  wheelLock = now + 650;
  go(e.deltaY > 0 ? 1 : -1);
}, { passive: true });

// the console dial: PS1 swims · PS2 holds · PS2+ is the frontrunner
const resChip = document.getElementById('res');
let qi = 2;
resChip.onclick = () => {
  qi = (qi + 1) % Moshi.QUALITIES.length;
  const q = Moshi.QUALITIES[qi];
  stage.setQuality(q);
  resChip.textContent = 'RES·' + q.toUpperCase();
};

// the STYLE dial cycles the render languages: PS2 crunch · clean TOON sticker ·
// BAKED (Humongous click-adventure soft baked light)
const styleChip = document.getElementById('style');
let si = Moshi.STYLES.indexOf('toon');
styleChip.onclick = () => {
  si = (si + 1) % Moshi.STYLES.length;
  const s = Moshi.STYLES[si];
  stage.setStyle(s); mini.setStyle(s);
  styleChip.textContent = 'STYLE·' + s.toUpperCase();
};

// the ANATOMY variations: pick the 3D-vs-flat balance by eye
const anatChip = document.getElementById('anat');
let ai = 0;
anatChip.onclick = () => {
  ai = (ai + 1) % Moshi.ANATOMIES.length;
  const a = Moshi.ANATOMIES[ai];
  stage.setAnatomy(a); mini.setAnatomy(a);
  anatChip.textContent = 'ANAT·' + a;
};

// the signal chain A/B
const signal = document.getElementById('signal');
signal.onclick = () => {
  const raw = document.documentElement.classList.toggle('raw');
  signal.textContent = raw ? 'SIGNAL·RAW' : 'SIGNAL·PS2';
};

show(true);
</script>
</body>
</html>
