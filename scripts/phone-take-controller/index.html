<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TAKE CTRL</title>
<style>
  :root {
    --bg: #0d0e11; --panel: #16181d; --ink: #e8e6df; --dim: #6f7480;
    --rec: #e5484d; --keep: #46a758; --again: #f2a33c; --hear: #4c9dd8; --stop: #3a3f4a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "SF Mono", ui-monospace, Menlo, monospace;
    display: flex; flex-direction: column; gap: 10px;
    padding: max(12px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    overscroll-behavior: none;
  }
  /* state banner */
  #banner {
    border-radius: 14px; padding: 14px 16px; background: var(--panel);
    display: flex; align-items: center; justify-content: space-between;
    border: 2px solid #23262d;
  }
  #stateTxt { font-size: 22px; font-weight: 800; letter-spacing: 2px; }
  #barTxt { font-size: 15px; color: var(--dim); text-align: right; line-height: 1.4; }
  body.rec #banner { border-color: var(--rec); animation: pulse 1.1s infinite; }
  body.rec #stateTxt { color: var(--rec); }
  body.play #banner { border-color: var(--hear); }
  body.play #stateTxt { color: var(--hear); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(229,72,77,.25); } }
  #dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #555; margin-right: 7px; vertical-align: 1px; }
  #dot.on { background: var(--keep); }
  /* take navigator */
  #takeRow {
    display: flex; align-items: stretch; gap: 8px; background: var(--panel);
    border-radius: 14px; padding: 8px; border: 2px solid #23262d;
  }
  #takeRow .lbl { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-left: 8px; }
  #takeRow .lbl small { color: var(--dim); font-size: 11px; letter-spacing: 1px; }
  #takeRow .lbl b { font-size: 24px; }
  #takeRow .lbl b span { font-size: 13px; color: var(--dim); font-weight: 500; }
  .step { width: 64px; font-size: 28px; border-radius: 10px; border: 0; background: #262a33; color: var(--ink); }
  .step:active { background: #333947; }
  /* buttons */
  #grid { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  button.big {
    border: 0; border-radius: 16px; color: #fff; font-family: inherit;
    font-weight: 800; letter-spacing: 2px; font-size: 21px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  }
  button.big small { font-weight: 500; font-size: 11px; opacity: .75; letter-spacing: .5px; }
  button.big:active { filter: brightness(1.25); transform: scale(.985); }
  #btnRec { flex: 3; background: var(--rec); font-size: 26px; }
  .row { flex: 2.4; display: flex; gap: 10px; }
  .row button { flex: 1; }
  #btnKeep { background: var(--keep); }
  #btnAgain { background: var(--again); color: #201503; }
  .row2 { flex: 1.6; display: flex; gap: 10px; }
  .row2 button { flex: 1; }
  #btnHear { background: var(--hear); }
  #btnStop { background: var(--stop); }
  #toast { min-height: 18px; text-align: center; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
  <div id="banner">
    <div id="stateTxt"><span id="dot"></span>PAUSED</div>
    <div id="barTxt">take 1<br><span id="rtt"></span></div>
  </div>

  <div id="takeRow">
    <button class="step" id="prev">&minus;</button>
    <div class="lbl"><small>TAKE</small><b><span id="takeMark">&nbsp;</span> <span id="keptTxt"></span></b></div>
    <button class="step" id="next">+</button>
  </div>

  <div id="grid">
    <button class="big" id="btnRec">PUT ME IN<small>record a fresh take</small></button>
    <div class="row">
      <button class="big" id="btnKeep">KEEP<small>take safe &middot; roll next</small></button>
      <button class="big" id="btnAgain">AGAIN<small>redo this take</small></button>
    </div>
    <div class="row2">
      <button class="big" id="btnHear">HEAR IT<small>play this take</small></button>
      <button class="big" id="btnStop">STOP</button>
    </div>
  </div>
  <div id="toast"></div>

<script>
  const $ = id => document.getElementById(id);

  async function act(action, extra) {
    try {
      const r = await fetch("/action", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(Object.assign({ action }, extra || {})),
      });
      const j = await r.json();
      if (j.msg) $("toast").textContent = j.msg;
      render(j);
    } catch (e) {
      $("toast").textContent = "server unreachable";
    }
  }

  function render(s) {
    if (!s) return;
    const live = s.live || {};
    // trust Live's transport for the banner when connected; server owns record/play intent
    let st = s.state || "PAUSED";
    if (live.connected && !live.is_playing) st = "PAUSED";
    $("stateTxt").innerHTML = '<span id="dot" class="' + (live.connected ? "on" : "") + '"></span>' + st;
    document.body.className = st === "RECORDING" ? "rec" : st === "PLAYING" ? "play" : "";

    if (typeof s.take === "number") {
      $("takeMark").textContent = s.take;
      $("keptTxt").innerHTML = "<span>" + (s.cur_has_take ? "&#9679; recorded" : "empty") +
        " &middot; " + (s.kept || 0) + " kept</span>";
    }
    $("barTxt").innerHTML = (live.bar ? "bar " + live.bar : (s.track == null ? "no track" : "ready")) +
      "<br><span id='rtt'>" + (live.osc_rtt_ms != null ? "osc " + live.osc_rtt_ms + "ms" :
      (live.connected ? "" : "live offline")) + "</span>";
    if (s.hint) $("toast").textContent = s.hint;
  }

  $("btnRec").onclick   = () => act("record");
  $("btnKeep").onclick  = () => act("keep");
  $("btnAgain").onclick = () => act("again");
  $("btnHear").onclick  = () => act("play");
  $("btnStop").onclick  = () => act("stop");
  $("prev").onclick     = () => act("prev");
  $("next").onclick     = () => act("next");

  async function poll() {
    try { render(await (await fetch("/state")).json()); } catch (e) { /* keep last */ }
  }
  setInterval(poll, 500);
  poll();
</script>
</body>
</html>
