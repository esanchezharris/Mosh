# Supabase project config for the Mosh cloud backend (multiplayer relay + brain proxy).
# Project ref: tpvkqaqydafpgockzchm (org "moshpit").
project_id = "tpvkqaqydafpgockzchm"

[functions.relay]
# The room code (a ~128-bit bearer) is the auth boundary, enforced inside the RPCs
# — NOT Supabase Auth — so the gateway must not require a JWT. The function reads
# the service-role key from the auto-injected Deno.env; the native client sends only
# the publishable apikey.
verify_jwt = false

[functions.playtest-evidence]
# Owner-only bearer validation happens inside the function. Supabase service
# credentials remain auto-injected into the Edge runtime and never reach Mosh.
verify_jwt = false

[functions.brain]
# Mosh has no per-user Supabase Auth, so there is no user JWT to verify — install_id
# (an opaque per-install UUID, see functions/brain/index.ts's header comment) is the
# only per-caller identity, and it is checked in the function body, not by the gateway.
# LLM provider keys are read from Deno.env (Supabase secrets); the native client sends
# only the project's publishable apikey. See docs/brain-proxy/RUNBOOK.md.
verify_jwt = false
